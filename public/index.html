    arrowDown: svg('<path d="M12 5v14"/><path d="m6 13 6 6 6-6"/>'),
    // A speaker, not a bell: on a Mac a bell reads as notifications, and this is sound.
    speaker: svg('<path d="M11 5 6.5 9H3.5v6h3l4.5 4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/>'),
    speakerOff: svg('<path d="M11 5 6.5 9H3.5v6h3l4.5 4z"/><path d="m15.5 9.5 5 5"/><path d="m20.5 9.5-5 5"/>'),
  };
  // A question keeps its own icon, but it needs you just like a blocked session does.
  const STATUS_ICON = {
    working: ICON.spinner, waiting: ICON.alert, asks: ICON.question, error: ICON.error,
    done: ICON.check, idle: ICON.moon, ended: ICON.power,
  };
  const LABEL = { working: "Working", waiting: "Needs you", asks: "Needs you", error: "Error", done: "Done", idle: "Idle", ended: "Closed" };
  const TOOLS = {
    Read: ["Reading", "file"], Edit: ["Editing", "pencil"], MultiEdit: ["Editing", "pencil"], Write: ["Writing", "pencil"],
    NotebookEdit: ["Editing", "pencil"], Bash: ["Running", "terminal"], Grep: ["Searching", "search"],
    Glob: ["Finding files", "search"], WebFetch: ["Reading the web", "globe"], WebSearch: ["Searching the web", "globe"],
    Agent: ["Delegating", "bot"], Task: ["Delegating", "bot"], Skill: ["Using skill", "star"],
    TodoWrite: ["Updating todos", "listChecks"], ToolSearch: ["Loading tools", "plug"],
    Compact: ["Compacting context", "compress"], Workflow: ["Starting a workflow", "flow"],
  };
  const MCP = {
    Claude_Browser: ["Using the browser", "browser"], "claude-in-chrome": ["Using Chrome", "browser"],
    "computer-use": ["Controlling the Mac", "browser"], ccd_session: ["Managing sessions", "grid"],
    ccd_session_mgmt: ["Managing sessions", "grid"], visualize: ["Drawing a visual", "star"],
  };

  const $content = document.getElementById("content");
  const $banner = document.getElementById("banner");
  const $week = document.getElementById("week");
  const $history = document.getElementById("history");
  const $scheduled = document.getElementById("scheduled");
  const $counts = document.getElementById("counts");
  const $link = document.getElementById("link");
  const $sound = document.getElementById("sound");
  const $q = document.getElementById("q");
  const $announce = document.getElementById("announce");
  document.querySelector('[data-view="week"]').innerHTML = `${ICON.grid}<span>Last 7 Days</span>`;
  document.querySelector('[data-view="history"]').innerHTML = `${ICON.history}<span>All Sessions</span>`;
  document.querySelector('[data-view="scheduled"]').innerHTML = `${ICON.calendarClock}<span>Scheduled</span>`;
  document.querySelector(".search .sr").outerHTML = ICON.search;

  let state = { now: Date.now(), needs: 0, sessions: [], tasks: [] };
  let live = new Map(); // sid → session, for what is in the last 7 days
  let ready = false; // the first update has arrived
  let link = "connecting"; // connecting, live or offline
  let skew = 0;
  let view = "week";
  let query = "";
  const seen = new Map(); // sid → what we last alerted on

  const DAY = 864e5;
  const FRESH_MS = 60_000; // what needs you breathes for this long, then holds still
  const now = () => Date.now() + skew;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const base = (p) => (typeof p === "string" && p.startsWith("/") ? p.split("/").filter(Boolean).pop() : p);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const tag = (inner, cls = "", title = "") => `<span class="tag ${cls}"${title ? ` title="${esc(title)}"` : ""}>${inner}</span>`;
  const kTokens = (n) => (n >= 999_500 ? `${(n / 1e6).toFixed(1).replace(/\.0$/, "")}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n));
  const dayStart = (back = 0) => { const d = new Date(now()); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - back); return d.getTime(); };
  const scratch = document.createElement("div");
  // Text for VoiceOver: two lines of a card read as two sentences, not one run-on word.
  const plain = (html) => {
    scratch.innerHTML = html.replace(/<\/div>(?=<div class="line">)/g, ". </div>");
    return scratch.textContent.replace(/\s+/g, " ").trim();
  };

  function describe(tool) {
    if (TOOLS[tool]) return TOOLS[tool];
    if (tool?.startsWith("mcp__")) {
      const server = tool.split("__")[1] || "";
      return MCP[server] || [`Using ${/^[0-9a-f-]{20,}$/.test(server) ? "a connector" : server}`, "plug"];
    }
    return [`Using ${tool}`, "plug"];
  }

  // What a session (or one of its agents) is doing: the tool's icon, then its target.
  function action(tool, detail) {
    if (!tool) return "";
    const [verb, icon] = describe(tool);
    const d = base(detail);
    return `<span title="${esc(verb)}">${ICON[icon]}</span><span class="txt">${d ? `<b>${esc(d)}</b>` : esc(verb)}</span>`;
  }

  // One way to write time everywhere: "now", "6m ago", "6h ago", "yesterday", "3d ago",
  // and spans as "45m" or "1h 5m".
  function ago(t) {
    const s = Math.max(0, Math.round((now() - t) / 1000));
    if (s < 45) return "now";
    const m = Math.round(s / 60);
    if (m < 60) return `${m}m ago`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.round(h / 24);
    return d === 1 ? "yesterday" : `${d}d ago`;
  }
  function span(t) {
    const m = Math.max(0, Math.round((now() - t) / 60000));
    return m < 1 ? "<1m" : m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
  }
  const clock = (t) => new Date(t).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  function dayLabel(t) {
    if (t >= dayStart(0)) return "Today";
    if (t >= dayStart(1)) return "Yesterday";
    const d = new Date(t);
    if (t >= dayStart(6)) return d.toLocaleDateString("en-US", { weekday: "long" });
    const sameYear = d.getFullYear() === new Date(now()).getFullYear();
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", ...(sameYear ? {} : { year: "numeric" }) });
  }

  // The one rule for "needs you" comes from the server, so the window, the Dock badge
  // and the menu bar always agree: blocked on you, or a question or an error from the
  // last day.
  const needsYou = (s) => s.needsYou ?? (s.status === "waiting" || ((s.status === "asks" || s.status === "error") && now() - s.last < DAY));
  const isFresh = (s) => (s.status === "waiting" || s.status === "asks" || s.status === "error") && needsYou(s) && now() - (s.since || s.last) < FRESH_MS;

  // The server calls a workflow it can't name "Workflow"; that name says nothing.
  const wfNamed = (wf) => Boolean(wf?.name) && wf.name !== "Workflow";
  const isStale = (s) => (s.status === "asks" || s.status === "error") && !needsYou(s);
  const label = (s) => (s.background ? "Agents working" : s.status === "asks" && isStale(s) ? "Asked you" : LABEL[s.status] || "Closed");
  const statusIcon = (s) => (s.background ? ICON.bot : STATUS_ICON[s.status] || ICON.check);
  const busiest = (s) => [...(s.agents || [])].sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0))[0];
  const agentLine = (a) => {
    const d = base(a.detail);
    return `${ICON.bot}<span class="txt"><span class="sub">${esc(a.label || "Agent")} ·</span> ${a.tool ? `<b>${esc(d || describe(a.tool)[0])}</b>` : "Thinking…"}</span>`;
  };

  // Two fixed lines under the title: what is happening, and its context.
  function detail(s) {
    const wrap = (html) => `<div class="wrap">${html}</div>`;
    const lines = (a, b) => `<div class="line">${a}</div>${b ? `<div class="line">${b}</div>` : ""}`;
    const plan = s.plan?.current
      ? `${ICON.listChecks}<span class="txt"><span class="sub">Step ${s.plan.index} of ${s.plan.total} ·</span> ${esc(s.plan.current)}</span>` : "";
    const agent = busiest(s);

    if (s.status === "waiting") return wrap(esc(s.wait || "Waiting for your answer"));
    if (s.status === "asks") return wrap(`<b>${esc(s.ask || "It asked you something")}</b>`);
    if (s.status === "error") return wrap(esc(s.error || "The turn ended with an error"));
    if (s.background) {
      const wf = s.workflows?.[0];
      const head = wf
        ? `${ICON.flow}<span class="txt">${wfNamed(wf) ? `Workflow <b>${esc(wf.name)}</b>` : "A workflow"}${wf.phase ? ` · ${esc(wf.phase)}` : ""}</span>`
        : `${ICON.agents}<span class="txt">${plural(s.agentCount, "agent", "agents")} in the background</span>`;
      return lines(head, agent ? agentLine(agent) : "");
    }
    if (s.status === "working") {
      return lines(action(s.tool, s.detail) || `${ICON.bulb}<span class="txt">Thinking…</span>`, plan || (agent ? agentLine(agent) : ""));
    }
    if (s.note) return wrap(esc(s.note));
    if (s.recap) return wrap(esc(s.recap));
    if (s.status === "done") return wrap(`Finished at ${clock(s.last)}`);
    if (s.status === "idle") return wrap("Open, waiting for a message");
    if (s.status === "ended") return wrap(`Closed at ${clock(s.since || s.last)}`);
    return "";
  }

  function tags(s) {
    const out = [];
    if (s.project) out.push(tag(`${ICON.folder}<span>${esc(s.project)}</span>`, "name", s.project));
    const wf = s.workflows?.[0];
    if (wf || s.agentCount) {
      const tokens = wf?.tokens || (s.agents || []).reduce((n, a) => n + (a.tokens || 0), 0);
      const since = wf?.startedAt ?? Math.min(...(s.agents || []).map((a) => a.startedAt || Date.now()));
      const bits = [
        s.agentCount ? plural(s.agentCount, "agent", "agents") : "",
        wf && !s.background && wfNamed(wf) ? wf.name : "",
        since ? span(since) : "",
        tokens ? `${kTokens(tokens)} tokens` : "",
      ].filter(Boolean);
      const tip = [
        wf ? `Workflow ${wf.name}` : "", wf?.description,
        since ? `Running for ${span(since)}` : "", tokens ? `${kTokens(tokens)} tokens` : "", "",
        ...(s.agents || []).map((a) => `${a.label || "Agent"}${a.phase ? ` (${a.phase})` : ""}${a.tokens ? ` · ${kTokens(a.tokens)} tokens` : ""}`),
      ].filter((x) => x !== undefined).join("\n").trim();
      out.push(tag(`${wf ? ICON.flow : ICON.agents}<span>${esc(bits.join(" · "))}</span>`, "", tip));
    }
    return `<div class="tags">${out.join("")}</div>`;
  }

  function bar(s) {
    // Only a plan still in progress; one with every step done has nothing left to show.
    if (!s.plan || s.plan.done >= s.plan.total || !(s.status === "working" || s.status === "waiting") || s.background) return "";
    const segs = Array.from({ length: s.plan.total }, (_, i) =>
      `<span class="${i < s.plan.done ? "on" : i === s.plan.index - 1 ? "now" : ""}"></span>`).join("");
    const tip = `Plan: ${s.plan.done} of ${s.plan.total} steps done${s.plan.current ? `, now on step ${s.plan.index}` : ""}`;
    // The count next to the segments says what they are: steps of the plan, done of total.
    return `<div class="bar" title="${tip}" aria-hidden="true"><span class="segs">${segs}</span><span class="n">${s.plan.done}/${s.plan.total} done</span></div>`;
  }

  // ---------------------------------------------------------------- Last 7 Days

  // Active comes first: what needs you, what is working, and anything touched in the last
  // two hours, in order of urgency. Then the rest of today, yesterday and earlier.
  const ACTIVE_MS = 2 * 60 * 60 * 1000;
  const SECTIONS = [
    { id: "active", label: "Active", hint: "last 2 hours", icon: ICON.activity,
      test: (s) => needsYou(s) || s.status === "working" || now() - s.last < ACTIVE_MS },
    { id: "today", label: "Earlier today", icon: ICON.sun, test: (s) => s.last >= dayStart(0) },
    { id: "yesterday", label: "Yesterday", icon: ICON.calendar, test: (s) => s.last >= dayStart(1) },
    { id: "earlier", label: "Earlier", icon: ICON.layers, test: () => true },
  ];

  const cards = new Map(); // sid → card element, kept between updates
  const groups = new Map(); // section id → section element

  function upsertCard(s) {
    let el = cards.get(s.sid);
    if (!el) {
      el = document.createElement("button");
      el.type = "button";
      el.dataset.sid = s.sid;
      if (seen.size) el.classList.add("new"); // not on the first draw
      el.addEventListener("animationend", (e) => { if (e.animationName === "enter") el.classList.remove("new"); });
      cards.set(s.sid, el);
    }
    // "new" and "found" are short-lived marks that a live update must not wipe.
    const keep = ["new", "found"].filter((c) => el.classList.contains(c)).map((c) => ` ${c}`).join("");
    const cls = `card ${s.status}${s.background ? " background" : ""}${isStale(s) ? " stale" : ""}${isFresh(s) ? " fresh" : ""}${keep}`;
    if (el.className !== cls) el.className = cls;
    const when = ago(s.status === "working" ? s.last : s.since);
    // A run of a scheduled task shows a calendar clock by its time instead of the plain clock.
    const timeTip = s.task ? ` title="${esc(s.taskName ? `A run of ${s.taskName}` : "A scheduled run")}"` : "";
    const inner = `
      <div class="top">
        ${tag(`${statusIcon(s)}<span>${label(s)}</span>`, `s-${s.status}`)}
        <span class="time"${timeTip}>${s.task ? ICON.calendarClock : ICON.clock}${when}</span>
      </div>
      <div class="title">${esc(s.title)}</div>
      <div class="detail">${detail(s)}</div>
      ${tags(s)}
      ${bar(s)}`;
    if (el._inner !== inner) {
      el.innerHTML = inner;
      el._inner = inner;
      syncIcons(el);
      // VoiceOver reads the whole card as one sentence: title, state, what it's doing.
      el.setAttribute("aria-label", [s.title, label(s), s.task ? "Scheduled run" : "", plain(detail(s)), s.project ? `in ${s.project}` : "", when].filter(Boolean).join(". "));
    }
    el.title = (s.agents || []).length
      ? `Open in the Claude app\n\n${s.agents.map((a) => `${a.label || "Agent"}: ${describe(a.tool || "Agent")[0]}`).join("\n")}`
      : "Open in the Claude app";
    return el;
  }

  function emptyWeek() {
    return `<div class="empty-state">
      <div class="art" aria-hidden="true">
        <span class="mini m1"><i></i><b></b><b></b></span>
        <span class="mini m2"><i></i><b></b><b></b></span>
        <span class="mini m3"><i></i><b></b><b></b></span>
      </div>
      <h3>No sessions in the last 7 days</h3>
      <p>Start a session in the Claude app, or run <code>claude</code> in a terminal. It shows up here as soon as it does something, and stays for 7 days.</p>
      <button class="btn" type="button" data-go="history">${ICON.history}Show All Sessions</button>
    </div>`;
  }

  // Shown only if the first update takes a moment; it fades in after 300 ms.
  const loadingState = () => `<div class="empty-state loading"><div class="badge">${ICON.spinner}</div><h3>Loading sessions</h3></div>`;

  function offlineState() {
    return `<div class="empty-state"><div class="badge off">${ICON.unplug}</div>
      <h3>Can't reach the monitor</h3>
      <p>${embed
        ? "The app runs it for you and keeps trying. If this stays, quit the app and open it again."
        : "Start it with <code>bun server.ts</code> in the project folder. This page connects on its own as soon as it's up."}</p></div>`;
  }

  // A row for a session of the rest of the week: state, title, folder and time, and the
  // recap or the question on a second line. Only Active gets cards.
  function weekRow(s, earlier) {
    const st = LABEL[s.status] ? s.status : "ended";
    const snip = st === "asks" ? s.ask : st === "error" ? s.error : s.note || s.recap || "";
    const time = earlier ? `${new Date(s.last).toLocaleDateString("en-US", { weekday: "short" })} ${clock(s.last)}` : clock(s.last);
    const sched = s.task ? `<span class="hsched" title="${esc(s.taskName ? `A run of ${s.taskName}` : "A scheduled run")}">${ICON.calendarClock}</span>` : "";
    const aria = [s.title, label(s), s.task ? "Scheduled run" : "", snip, s.project ? `in ${s.project}` : "", time].filter(Boolean).join(". ");
    return `<button type="button" class="hrow s-${st}${isStale(s) ? " stale" : ""}" data-sid="${esc(s.sid)}" title="Open in the Claude app" aria-label="${esc(aria)}">
      <span class="hicon" title="${esc(label(s))}">${still(statusIcon(s))}</span>
      <span class="htitle"><span class="t">${esc(s.title)}</span>${sched}</span>
      ${s.project ? tag(`${ICON.folder}<span>${esc(s.project)}</span>`, "name", s.project) : "<span></span>"}
      <span class="htime">${time}</span>
      ${snip ? `<span class="hsnip">${esc(snip)}</span>` : ""}
    </button>`;
  }

  // Redraws a list of rows only where it changed, so hover, focus and a ring stay put.
  function morphRows(listEl, html) {
    if (listEl._html === html) return;
    listEl._html = html;
    const next = document.createElement("template");
    next.innerHTML = html;
    const fresh = [...next.content.children];
    const old = [...listEl.children];
    if (fresh.length !== old.length || fresh.some((n, i) => n.dataset.sid !== old[i].dataset.sid)) {
      const focused = listEl.contains(document.activeElement) ? document.activeElement.dataset.sid : null;
      listEl.replaceChildren(...fresh);
      for (const el of listEl.children) el._html = el.innerHTML;
      if (focused) listEl.querySelector(`[data-sid="${CSS.escape(focused)}"]`)?.focus({ preventScroll: true });
      return;
    }
    fresh.forEach((n, i) => {
      const o = old[i];
      const cls = n.className + (o.classList.contains("found") ? " found" : "");
      if (o.className !== cls) o.className = cls;
      for (const a of ["title", "aria-label"]) if (o.getAttribute(a) !== n.getAttribute(a)) o.setAttribute(a, n.getAttribute(a));
      if (o._html !== n.innerHTML) { o.innerHTML = n.innerHTML; o._html = n.innerHTML; }
    });
  }

  const LONG_DAY = 6; // more rows than this, and a wide window splits the day in two columns

  function weekShell() {
    if ($week.querySelector(":scope > .wsplit")) return;
    cards.clear();
    groups.clear();
    $week.innerHTML = `<div class="wsplit"><div class="wmain"></div><div class="wside"></div></div>`;
  }

  function renderWeek() {
    if (!ready) {
      cards.clear();
      groups.clear();
      $week.innerHTML = link === "offline" ? offlineState() : loadingState();
      syncIcons($week);
      return;
    }
    const list = state.sessions;
    if (!list.length) {
      cards.clear();
      groups.clear();
      $week.innerHTML = emptyWeek();
      return;
    }
    weekShell();
    const $main = $week.querySelector(".wmain");
    const $side = $week.querySelector(".wside");

    // Cards are kept between updates, one per session. A status change then fades the
    // card's color instead of redrawing it, and a card that changes place slides there.
    const before = new Map([...cards].map(([sid, el]) => [sid, el.isConnected ? el.getBoundingClientRect() : null]));
    const buckets = new Map(SECTIONS.map((g) => [g.id, []]));
    for (const s of list) buckets.get(SECTIONS.find((g) => g.test(s)).id).push(s);
    // Newest first in the day sections; the server's order (urgency) in Active.
    for (const id of ["today", "yesterday", "earlier"]) buckets.get(id).sort((a, b) => b.last - a.last);

    const section = (g, body) => {
      const sec = document.createElement("section");
      sec.className = `group ${g.id}`;
      sec.setAttribute("aria-label", g.label);
      sec.innerHTML = `<h2 class="group-head">${g.icon}<span>${g.label}</span><span class="count"></span>${g.hint ? `<span class="hint">· ${g.hint}</span>` : ""}</h2>${body}`;
      groups.set(g.id, sec);
      return sec;
    };

    // Active: cards.
    const active = buckets.get("active");
    const keep = new Set();
    let sec = groups.get("active");
    if (!active.length) {
      sec?.remove();
      groups.delete("active");
    } else {
      if (!sec) $main.appendChild(sec = section(SECTIONS[0], `<div class="grid"></div>`));
      sec.querySelector(".count").textContent = active.length;
      const grid = sec.querySelector(".grid");
      active.forEach((s, i) => {
        const el = upsertCard(s);
        keep.add(s.sid);
        if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
      });
    }
    for (const [sid, el] of cards) if (!keep.has(sid)) { el.remove(); cards.delete(sid); }

    // The rest of the week: compact rows, by day.
    let prev = null;
    for (const g of SECTIONS.slice(1)) {
      const items = buckets.get(g.id);
      sec = groups.get(g.id);
      if (!items.length) { sec?.remove(); groups.delete(g.id); continue; }
      if (!sec) sec = section(g, `<div class="hlist"></div>`);
      const want = prev ? prev.nextSibling : $side.firstChild;
      if (sec !== want) $side.insertBefore(sec, want);
      prev = sec;
      sec.querySelector(".count").textContent = items.length;
      const rows = sec.querySelector(".hlist");
      rows.classList.toggle("long", items.length > LONG_DAY);
      morphRows(rows, items.map((s) => weekRow(s, g.id === "earlier")).join(""));
    }

    // FLIP: start each moved card where it was on screen and let it glide to its new
    // place. Starting from the on-screen position keeps it smooth even mid-move.
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      for (const [sid, el] of cards) {
        const a = before.get(sid);
        if (!a) continue;
        const b = el.getBoundingClientRect();
        const dx = a.left - b.left;
        const dy = a.top - b.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
            { duration: 380, easing: "cubic-bezier(0.2, 0, 0, 1)" });
        }
      }
    }
  }

  // ---------------------------------------------------------------- All Sessions

  const hist = { items: [], total: 0, ready: false, html: "", req: 0 };

  async function loadHistory(reset) {
    const q = query;
    const req = ++hist.req; // a refresh and a "Show more" can cross; only the newest counts
    // A refresh keeps as many rows as were already shown.
    const limit = reset ? Math.max(60, hist.items.length) : 60;
    const offset = reset ? 0 : hist.items.length;
    try {
      const r = await fetch(`/api/history?limit=${limit}&offset=${offset}&q=${encodeURIComponent(q)}`).then((x) => x.json());
      if (q !== query || req !== hist.req) return; // a newer request is on its way
      hist.items = reset ? r.sessions : hist.items.concat(r.sessions);
      hist.total = r.total;
      hist.ready = true;
      renderHistory();
    } catch {
      // The server is restarting; the next update tries again.
    }
  }

  // Marks every match of the search in a piece of text.
  function hl(text) {
    const raw = String(text ?? "");
    if (!query) return esc(raw);
    const lower = raw.toLowerCase();
    const q = query.toLowerCase();
    let out = "";
    let i = 0;
    for (let j; (j = lower.indexOf(q, i)) !== -1; i = j + q.length) {
      out += esc(raw.slice(i, j)) + `<mark>${esc(raw.slice(j, j + q.length))}</mark>`;
    }
    return out + esc(raw.slice(i));
  }

  // A row reads from the database, then takes the live state of the session if it is
  // still in the last 7 days, so a row that is working right now looks and moves like
  // its card.
  function merged(h) {
    const s = live.get(h.sid);
    return s ? { ...h, ...s, project: s.project || h.project, cwd: s.cwd || h.cwd } : h;
  }

  function historyRow(h) {
    const st = LABEL[h.status] ? h.status : "ended";
    const isLive = live.has(h.sid) && (st === "working" || needsYou(h));
    let snip = st === "waiting" ? h.wait : st === "asks" ? h.ask : st === "error" ? h.error : h.note || h.recap || h.ask || "";
    // A search that matched only the first prompt shows the prompt, so you can see why.
    const q = query.toLowerCase();
    if (q && !`${h.title} ${snip}`.toLowerCase().includes(q) && h.prompt?.toLowerCase().includes(q)) snip = h.prompt;
    let icon = h.background ? ICON.bot : STATUS_ICON[st] || ICON.check;
    if (!isLive) icon = icon.replace(/ (spin|pulse|bot)"/, '"');
    const what = isLive ? `<span class="hstate">${esc(label(h))}</span>` : `<span class="sr">${esc(label(h))}.</span>`;
    return `<button type="button" class="hrow s-${st}${isLive ? " live" : ""}${isLive && isFresh(h) ? " fresh" : ""}" data-sid="${esc(h.sid)}" title="Open in the Claude app">
      <span class="hicon" title="${esc(label(h))}">${icon}</span>
      <span class="htitle"><span class="t">${hl(h.title)}</span>${h.task ? `<span class="hsched" title="${esc(h.taskName ? `A run of ${h.taskName}` : "A scheduled run")}">${ICON.calendarClock}</span>` : ""}${what}</span>
      ${h.project ? tag(`${ICON.folder}<span>${hl(h.project)}</span>`, "name", h.project) : "<span></span>"}
      <span class="htime">${clock(h.last)}</span>
      ${snip ? `<span class="hsnip">${hl(snip)}</span>` : ""}
    </button>`;
  }

  function renderHistory() {
    let html;
    if (!hist.ready) {
      html = link === "offline" ? offlineState() : loadingState();
    } else if (!hist.items.length) {
      html = query
        ? `<div class="empty-state"><div class="badge">${ICON.search}</div>
            <h3>No sessions match “${esc(query)}”</h3>
            <p>Try a project name or a word from the task.</p></div>`
        : `<div class="empty-state"><div class="badge">${ICON.history}</div>
            <h3>No sessions yet</h3>
            <p>Every session is kept here for good, and you can search them all. The last 7 days are here too.</p></div>`;
    } else {
      const items = hist.items.map(merged).sort((a, b) => b.last - a.last);
      const days = [];
      for (const h of items) {
        const d = dayLabel(h.last);
        if (days.at(-1)?.label !== d) days.push({ label: d, items: [] });
        days.at(-1).items.push(h);
      }
      html = days.map((d) => `<section class="group" aria-label="${esc(d.label)}">
          <h2 class="group-head">${d.label === "Today" ? ICON.sun : ICON.calendar}<span>${esc(d.label)}</span><span class="count">${d.items.length}</span></h2>
          <div class="hlist${d.items.length > LONG_DAY ? " long" : ""}">${d.items.map(historyRow).join("")}</div>
        </section>`).join("") +
        (hist.items.length < hist.total
          ? `<div class="more"><button class="btn" type="button" data-more>${ICON.arrowDown}Show ${Math.min(60, hist.total - hist.items.length)} More</button></div>` : "");
    }
    // Live updates arrive often; redraw only when something on screen changed.
    if (html === hist.html) return;
    hist.html = html;
    const next = document.createElement("template");
    next.innerHTML = html;
    const PARTS = "[data-sid], .group-head .count, [data-more]";
    const shape = (root) => [...root.querySelectorAll(".group-head > span:not(.count), [data-sid], [data-more]")]
      .map((e) => e.dataset.sid ?? e.textContent).join("|");
    const was = shape($history);
    if (was && shape(next.content) === was) {
      // Same rows in the same order: change each one in place, so a new state fades its
      // color like a card does, and hover and focus stay where they are.
      const old = $history.querySelectorAll(PARTS);
      next.content.querySelectorAll(PARTS).forEach((n, i) => {
        const o = old[i];
        if (o.className !== n.className) o.className = n.className;
        if (o._html !== n.innerHTML) { o.innerHTML = n.innerHTML; o._html = n.innerHTML; }
      });
    } else {
      const focused = $history.contains(document.activeElement) ? document.activeElement.closest("[data-sid]")?.dataset.sid : null;
      $history.innerHTML = html;
      $history.querySelectorAll(PARTS).forEach((o) => { o._html = o.innerHTML; });
      if (focused) $history.querySelector(`[data-sid="${CSS.escape(focused)}"]`)?.focus({ preventScroll: true });
    }
    syncIcons($history);
  }

  // A new session shows up in All Sessions too, without waiting for a search or a switch.
  let historyTimer;
  function refreshHistory() {
    if (view !== "history" || !hist.ready) return renderHistory();
    const loaded = new Set(hist.items.map((h) => h.sid));
    const oldest = hist.items.at(-1)?.last ?? 0;
    const missing = !query && state.sessions.some((s) => !loaded.has(s.sid) && s.last >= oldest);
    if (missing) { clearTimeout(historyTimer); historyTimer = setTimeout(() => loadHistory(true), 400); }
    renderHistory();
  }

  // ---------------------------------------------------------------- Scheduled

  // When something happens, in words: "today at 7:10 AM", "yesterday at…", "Mon at…".
  function when(t) {
    const at = clock(t);
    if (t >= dayStart(0) && t < dayStart(-1)) return `today at ${at}`;
    if (t >= dayStart(1) && t < dayStart(0)) return `yesterday at ${at}`;
    if (t >= dayStart(-1) && t < dayStart(-2)) return `tomorrow at ${at}`;
    const d = new Date(t);
    const near = Math.abs(t - now()) < 6 * DAY;
    return `${d.toLocaleDateString("en-US", near ? { weekday: "short" } : { month: "short", day: "numeric" })} at ${at}`;
  }
  // The next run, short, for the corner of the card.
  function nextLabel(t) {
    const ms = t - now();
    if (ms < 45_000) return "now";
    if (ms < 3_600_000) return `in ${Math.round(ms / 60_000)}m`;
    const w = when(t);
    return w[0].toUpperCase() + w.slice(1);
  }

  // A task card: how its last run went, or that it is paused, missed a run or never ran.
  function taskLook(t) {
    const r = t.lastRun;
    if (!t.enabled) return { cls: "paused", tag: tag(`${ICON.pause}<span>Paused</span>`, "s-idle"), label: "Paused" };
    if (r && (r.status === "working" || r.needsYou)) {
      const s = { ...r, background: false };
      const text = r.status === "working" ? "Running" : label(s);
      return { cls: r.status, tag: tag(`${statusIcon(s)}<span>${text}</span>`, `s-${r.status}`), label: text, fresh: isFresh(s) };
    }
    if (t.missed) return { cls: "missed", tag: tag(`${ICON.alarm}<span>Missed</span>`, "s-missed"), label: "Missed a run" };
    if (!r) return { cls: "unrun", tag: tag(`${ICON.calendarClock}<span>Scheduled</span>`, "s-idle"), label: "No runs yet" };
    if (r.status === "asks") return { cls: "asks stale", tag: tag(`${ICON.question.replace(" pulse", "")}<span>Asked you</span>`, "s-asks"), label: "Asked you" };
    if (r.status === "error") return { cls: "error stale", tag: tag(`${ICON.error.replace(" pulse", "")}<span>Error</span>`, "s-error"), label: "Error" };
    if (r.status === "ended" && r.note) return { cls: "ended", tag: tag(`${ICON.power}<span>Closed</span>`, "s-ended"), label: "Closed" };
    return { cls: "done", tag: tag(`${ICON.check}<span>Done</span>`, "s-done"), label: "Done" };
  }

  function taskDetail(t) {
    const r = t.lastRun;
    const line = (html) => `<div class="line">${html}</div>`;
    const sched = line(`${ICON.calendarClock}<span class="txt">${t.schedule ? esc(t.schedule) : `<code>${esc(t.cron)}</code>`}</span>`);
    let second;
    if (t.enabled && r?.status === "working") {
      second = action(r.tool, r.detail) || `${ICON.bulb}<span class="txt">Started ${when(r.first)}</span>`;
    } else if (t.enabled && r?.needsYou) {
      const text = r.status === "waiting" ? r.wait || "Waiting for your answer" : r.status === "asks" ? r.ask || "It asked you something" : r.error || "The run ended with an error";
      second = `<span class="txt"><b>${esc(text)}</b></span>`;
    } else if (t.enabled && t.missed) {
      second = `${ICON.alarm}<span class="txt">Didn't run ${when(t.missed)}</span>`;
    } else {
      second = `${ICON.history}<span class="txt">${r ? `Last run ${when(r.first)}` : "No runs yet"}</span>`;
    }
    return sched + line(second);
  }

  function runDots(t) {
    if (!t.runs.length) return "";
    const runs = [...t.runs].reverse(); // oldest first, like a timeline
    const word = runWord;
    const tip = `Last ${plural(runs.length, "run", "runs")}, oldest first:\n${runs.map((r) => `${when(r.at)}: ${word(r)}`).join("\n")}`;
    const dots = runs.map((r) => `<i class="r-${r.status === "idle" ? "done" : r.status}"></i>`).join("");
    return tag(`<span class="dots" aria-hidden="true">${dots}</span>`, "", tip);
  }
  const runWord = (r) => (r.status === "working" ? "running" : r.status === "done" || r.status === "idle" ? "done"
    : r.status === "ended" ? "closed" : r.status === "error" ? "error" : r.status === "waiting" ? "needs you" : "asked you");
  // "Last 7 runs: 6 done, 1 error", for VoiceOver, which can't see the dots.
  function runSummary(t) {
    if (!t.runs.length) return "";
    const counts = new Map();
    for (const r of t.runs) counts.set(runWord(r), (counts.get(runWord(r)) || 0) + 1);
    return `Last ${plural(t.runs.length, "run", "runs")}: ${[...counts].map(([w, n]) => `${n} ${w}`).join(", ")}`;
  }

  const taskCards = new Map(); // task id → card element, kept between updates
  function upsertTask(t) {
    let el = taskCards.get(t.id);
    if (!el) {
      el = document.createElement("button");
      el.type = "button";
      el.dataset.task = t.id;
      taskCards.set(t.id, el);
    }
    const look = taskLook(t);
    const cls = `card task ${look.cls}${look.fresh ? " fresh" : ""}`;
    if (el.className !== cls) el.className = cls;
    // A click opens the last run; a task that never ran has nothing to open.
    if (t.lastRun) el.dataset.sid = t.lastRun.sid; else delete el.dataset.sid;
    const nextText = t.enabled && t.next ? nextLabel(t.next) : "";
    const inner = `
      <div class="top">
        ${look.tag}
        ${nextText ? `<span class="time" title="Next run ${esc(when(t.next))}">${ICON.clock}${nextText}</span>` : ""}
      </div>
      <div class="title">${esc(t.name)}</div>
      <div class="detail">${taskDetail(t)}</div>
      <div class="tags">${t.project ? tag(`${ICON.folder}<span>${esc(t.project)}</span>`, "name", t.project) : ""}${runDots(t)}</div>`;
    if (el._inner !== inner) {
      el.innerHTML = inner;
      el._inner = inner;
      syncIcons(el);
      el.setAttribute("aria-label", [t.name, look.label, plain(taskDetail(t)), nextText ? `Next run ${when(t.next)}` : "", runSummary(t)].filter(Boolean).join(". "));
    }
    el.title = t.lastRun ? "Open the last run in the Claude app" : "No runs yet";
    return el;
  }

  const TASK_GROUPS = [
    { id: "on", label: "Scheduled", hint: "on this Mac", test: (t) => t.enabled },
    { id: "off", label: "Paused", test: (t) => !t.enabled },
  ];
  const taskGroups = new Map();

  function renderScheduled() {
    if (!ready) {
      taskCards.clear();
      taskGroups.clear();
      $scheduled.innerHTML = link === "offline" ? offlineState() : loadingState();
      syncIcons($scheduled);
      return;
    }
    const list = state.tasks || [];
    if (!list.length) {
      taskCards.clear();
      taskGroups.clear();
      $scheduled.innerHTML = `<div class="empty-state"><div class="badge">${ICON.calendarClock}</div>
        <h3>No scheduled tasks</h3>
        <p>Ask Claude in the Claude app to run something on a schedule. Each task shows up here with its next run and how the last one went.</p></div>`;
      return;
    }
    $scheduled.querySelector(":scope > .empty-state")?.remove();
    const keep = new Set();
    let prev = null;
    for (const g of TASK_GROUPS) {
      const items = list.filter(g.test); // the server's order: what needs you, running, missed, next up
      let sec = taskGroups.get(g.id);
      if (!items.length) { sec?.remove(); taskGroups.delete(g.id); continue; }
      if (!sec) {
        sec = document.createElement("section");
        sec.className = `group ${g.id === "on" ? "active" : ""}`;
        sec.setAttribute("aria-label", g.label);
        sec.innerHTML = `<h2 class="group-head">${g.id === "on" ? ICON.calendarClock : ICON.pause}<span>${g.label}</span><span class="count"></span>${g.hint ? `<span class="hint">· ${g.hint}</span>` : ""}</h2><div class="grid"></div>`;
        taskGroups.set(g.id, sec);
      }
      const want = prev ? prev.nextSibling : $scheduled.firstChild;
      if (sec !== want) $scheduled.insertBefore(sec, want);
      prev = sec;
      sec.querySelector(".count").textContent = items.length;
      const grid = sec.querySelector(".grid");
      items.forEach((t, i) => {
        const el = upsertTask(t);
        keep.add(t.id);
        if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
      });
    }
    for (const [id, el] of taskCards) if (!keep.has(id)) { el.remove(); taskCards.delete(id); }
  }

  // ---------------------------------------------------------------- views

  function setView(v, fromApp) {
    if (v !== "week" && v !== "history" && v !== "scheduled") return;
    view = v;
    $week.hidden = v !== "week";
    $history.hidden = v !== "history";
    $scheduled.hidden = v !== "scheduled";
    document.querySelectorAll(".seg [data-view]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === v)));
    $content.scrollTop = 0;
    if (v === "history") { renderHistory(); loadHistory(true); }
    if (v === "scheduled") renderScheduled();
    if (!fromApp) bridge()?.postMessage({ view: v }); // keep the app's toolbar switch in step
  }

  let searchTimer;
  function search(q, fromApp) {
    query = String(q ?? "").trim();
    if ($q.value !== q) $q.value = q ?? "";
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (query && view !== "history") setView("history", fromApp);
      else if (view === "history") loadHistory(true);
    }, 180);
  }

  // The app drives these from its toolbar.
  window.csm = { setView: (v) => setView(v, true), search: (q) => search(q, true), reportChrome: () => { fitCounts(); reportChrome(); } };

  // In the app the header row sits in the title bar, and the app drags the window by it.
  // It needs to know where the things you can click are, so it leaves those alone.
  function reportChrome() {
    if (!bridge()) return;
    const holes = [...document.querySelectorAll("#counts [data-pop], #link, #sound, .nav, #pop.open")]
      .map((el) => el.getBoundingClientRect())
      .filter((r) => r.width && r.height)
      .map((r) => [r.left, r.top, r.width, r.height]);
    bridge().postMessage({ holes });
  }
  addEventListener("resize", () => requestAnimationFrame(reportChrome));

  document.querySelector(".seg").addEventListener("click", (e) => {
    const b = e.target.closest("[data-view]");
    if (b) setView(b.dataset.view);
  });
  $q.addEventListener("input", () => search($q.value));

  $content.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (go) return setView(go.dataset.go);
    if (e.target.closest("[data-more]")) return loadHistory(false);
    const item = e.target.closest("[data-sid]");
    if (item) openSession(item.dataset.sid);
  });

  // In the app, a right click opens the app's own menu for that session, and anywhere
  // else no web menu (Reload, Inspect) at all.
  const sessionFor = (sid) => live.get(sid) ?? hist.items.find((h) => h.sid === sid);
  document.addEventListener("contextmenu", (e) => {
    if (!embed) return;
    e.preventDefault();
    const task = e.target.closest("[data-task]");
    if (task) {
      const t = state.tasks.find((x) => x.id === task.dataset.task);
      if (t) bridge()?.postMessage({ menu: { sid: t.lastRun?.sid ?? "", title: t.name, cwd: t.cwd, file: t.file } });
      return;
    }
    const item = e.target.closest("[data-sid]");
    if (!item) return;
    const s = sessionFor(item.dataset.sid);
    bridge()?.postMessage({ menu: { sid: item.dataset.sid, title: s?.title ?? "", cwd: s?.cwd ?? "" } });
  });

  // Arrow keys move between cards the way they look on screen; Home and End jump to the
  // first and last. Return or Space opens the session, as a click does.
  $content.addEventListener("keydown", (e) => {
    const from = e.target.closest?.(".card, .hrow");
    if (!from || e.metaKey || e.altKey || e.ctrlKey) return;
    const items = [...(view === "week" ? $week : view === "history" ? $history : $scheduled).querySelectorAll(".card, .hrow")];
    const i = items.indexOf(from);
    let to;
    if (e.key === "Home") to = items[0];
    else if (e.key === "End") to = items.at(-1);
    else if (e.key === "ArrowLeft") to = items[i - 1];
    else if (e.key === "ArrowRight") to = items[i + 1];
    else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      const down = e.key === "ArrowDown";
      const a = from.getBoundingClientRect();
      const cx = a.left + a.width / 2;
      const all = items.filter((el) => el !== from).map((el) => ({ el, b: el.getBoundingClientRect() }))
        .filter(({ b }) => (down ? b.top >= a.bottom - 1 : b.bottom <= a.top + 1));
      if (all.length) {
        // The nearest row first, then the item in it closest to the same column.
        const edge = down ? Math.min(...all.map((c) => c.b.top)) : Math.max(...all.map((c) => c.b.bottom));
        const row = all.filter((c) => Math.abs((down ? c.b.top : c.b.bottom) - edge) < 4);
        row.sort((p, q) => Math.abs(p.b.left + p.b.width / 2 - cx) - Math.abs(q.b.left + q.b.width / 2 - cx));
        to = row[0].el;
      }
    } else return;
    e.preventDefault();
    if (to) { to.focus({ preventScroll: true }); to.scrollIntoView({ block: "nearest" }); }
  });

  // ---------------------------------------------------------------- header

  // Full counts if they fit; numbers only if not; then without the less important ones.
  function fitCounts() {
    $counts.classList.remove("tight", "tighter", "tightest");
    const over = () => $counts.scrollWidth > $counts.clientWidth + 1;
    for (const step of ["tight", "tighter", "tightest"]) {
      if (!over()) return;
      $counts.classList.add(step);
    }
  }
  addEventListener("resize", () => requestAnimationFrame(fitCounts));

  function renderHeader() {
    const list = state.sessions;
    const needs = state.needs ?? list.filter(needsYou).length;
    const working = list.filter((s) => s.status === "working").length;
    const agents = list.reduce((k, s) => k + (s.agentCount || 0), 0);
    // Each count is a button: hover or focus shows what's behind it.
    // The number and its words are apart, so a tight header can keep just the number.
    const count = (kind, icon, n, words, cls) =>
      `<span class="tag ${cls}" data-pop="${kind}" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false" aria-label="${n} ${words}" title="${n} ${words}">${icon}<span>${n}<span class="word"> ${words}</span></span>${ICON.chev}</span>`;
    const counts = [
      needs ? count("needs", ICON.alert.replace(" pulse", ""), needs, needs === 1 ? "needs you" : "need you", "s-waiting") : "",
      working ? count("working", ICON.spinner, working, "working", "s-working") : "",
      agents ? count("agents", ICON.agents, agents, agents === 1 ? "agent" : "agents", "low") : "",
      list.length ? count("week", ICON.calendar, list.length, "in 7 days", "low") : "",
    ].join("");
    if ($counts._html !== counts) {
      $counts.innerHTML = counts;
      $counts._html = counts;
      syncIcons($counts);
      fitCounts();
      requestAnimationFrame(reportChrome);
      // The counts were redrawn: keep an open card on its count, or close it if that count is gone.
      if (popKind) {
        const anchor = $counts.querySelector(`[data-pop="${popKind}"]`);
        if (anchor) { popAnchor = anchor; anchor.setAttribute("aria-expanded", "true"); placePop(); } else hidePop();
      }
    }
    if (popKind) fillPop();
  }

  // ---------------------------------------------------------------- count details

  const $pop = document.getElementById("pop");
  let popKind = null; // which count's card is open
  let popAnchor = null;
  let popShowTimer;
  let popHideTimer;
  const POP_DELAY = 250; // a pause before the first card, so passing over the header opens nothing
  const POP_GRACE = 150; // time to move from a count into its card
  const POP_MAX = 8;

  const openSession = (sid) => fetch(`/api/open/${encodeURIComponent(sid)}`, { method: "POST", headers: { "x-csm": "1" } });
  const still = (icon) => icon.replace(/ (spin|pulse|bot)"/, '"');

  function popRow(s, text, meta) {
    return `<button type="button" class="prow s-${s.status}" data-sid="${esc(s.sid)}" title="Show its card">
      <span class="pi">${still(statusIcon(s))}</span><span class="pt">${esc(s.title)}</span><span class="pm">${esc(meta)}</span>
      <span class="ps">${esc(text)}</span></button>`;
  }
  const popHead = (icon, text) => `<div class="pop-head">${still(icon)}<span>${esc(text)}</span></div>`;
  const popMore = (n) => (n > 0 ? `<div class="pop-more">and ${n} more</div>` : "");

  function doing(s) {
    if (s.background) {
      const wf = s.workflows?.[0];
      return wf ? `${wfNamed(wf) ? `Workflow ${wf.name}` : "A workflow"}${wf.phase ? ` · ${wf.phase}` : ""}` : `${plural(s.agentCount, "agent", "agents")} in the background`;
    }
    return s.tool ? act(s.tool, s.detail) : "Thinking…";
  }
  // "Reading orders.sql", or a command's own description as it is ("Run the checkout tests").
  function act(tool, detail) {
    const target = base(detail);
    if (!target) return describe(tool)[0];
    return /\s/.test(target) ? target : `${describe(tool)[0]} ${target}`;
  }

  function popHtml(kind) {
    const list = state.sessions;
    if (kind === "needs") {
      const items = list.filter(needsYou);
      const what = (s) => (s.status === "waiting" ? s.wait || "Waiting for your answer" : s.status === "asks" ? s.ask || "It asked you something" : s.error || "The turn ended with an error");
      return popHead(ICON.alert, items.length === 1 ? "1 session needs you" : `${items.length} sessions need you`) +
        items.slice(0, POP_MAX).map((s) => popRow(s, what(s), ago(s.since))).join("") + popMore(items.length - POP_MAX);
    }
    if (kind === "working") {
      const items = list.filter((s) => s.status === "working");
      return popHead(ICON.spinner, `${items.length} working`) +
        items.slice(0, POP_MAX).map((s) => popRow(s, doing(s), s.plan?.current && !s.background ? `Step ${s.plan.index} of ${s.plan.total}` : ago(s.last))).join("") +
        popMore(items.length - POP_MAX);
    }
    if (kind === "agents") {
      const total = list.reduce((k, s) => k + (s.agentCount || 0), 0);
      const pairs = list.flatMap((s) => (s.agents || []).map((a) => ({ s, a })));
      const rows = pairs.slice(0, POP_MAX).map(({ s, a }) => {
        const doing = a.tool ? act(a.tool, a.detail) : "Thinking…";
        return `<button type="button" class="prow s-working" data-sid="${esc(s.sid)}" title="Show the card of ${esc(s.title)}">
          <span class="pi">${still(ICON.bot)}</span><span class="pt">${esc(a.label || "Agent")}</span><span class="pm">${a.tokens ? `${kTokens(a.tokens)} tokens` : ""}</span>
          <span class="ps">${esc(s.title)} · ${esc(doing)}</span></button>`;
      }).join("");
      return popHead(ICON.agents, plural(total, "agent", "agents")) + rows + popMore(total - Math.min(pairs.length, POP_MAX));
    }
    // In the last 7 days: how many in each state, most urgent first.
    const order = ["Needs you", "Error", "Asked you", "Working", "Agents working", "Done", "Idle", "Closed"];
    const color = { "Needs you": "var(--color-warning)", Error: "var(--color-error)", "Asked you": "var(--color-warning-muted)",
      Working: "var(--color-accent)", "Agents working": "var(--color-text-accent)", Done: "var(--color-success)" };
    const by = new Map();
    for (const s of list) by.set(label(s), (by.get(label(s)) || 0) + 1);
    const rows = order.filter((l) => by.get(l)).map((l) => `<button type="button" class="prow count" data-state="${l}" title="Show these cards">
        <span class="pi"><i class="pop-dot" style="${color[l] ? `background:${color[l]}` : ""}"></i></span><span class="pt">${l}</span><span class="pm">${by.get(l)}</span></button>`).join("");
    const runs = list.filter((s) => s.task).length;
    return popHead(ICON.calendar, `${plural(list.length, "session", "sessions")} in the last 7 days`) + rows +
      (runs ? `<div class="pop-note">${runs === 1 ? "1 is a run" : `${runs} are runs`} of a scheduled task.</div>` : "") +
      `<div class="pop-foot"><button type="button" class="prow" data-go="history"><span class="pi">${ICON.history}</span><span class="pt">Show All Sessions</span></button></div>`;
  }

  function fillPop() {
    const html = popHtml(popKind);
    if ($pop._html !== html) { $pop.innerHTML = html; $pop._html = html; }
  }

  // Under its count, kept inside the window.
  function placePop() {
    if (!popAnchor) return;
    const r = popAnchor.getBoundingClientRect();
    const w = $pop.offsetWidth;
    $pop.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
    $pop.style.top = `${r.bottom + 6}px`;
  }

  function showPop(anchor) {
    clearTimeout(popShowTimer);
    clearTimeout(popHideTimer);
    if (popAnchor && popAnchor !== anchor) popAnchor.setAttribute("aria-expanded", "false");
    popKind = anchor.dataset.pop;
    popAnchor = anchor;
    anchor.setAttribute("aria-expanded", "true");
    fillPop();
    placePop();
    $pop.classList.add("open");
    reportChrome();
  }

  function hidePop() {
    clearTimeout(popShowTimer);
    clearTimeout(popHideTimer);
    popAnchor?.setAttribute("aria-expanded", "false");
    popKind = null;
    popAnchor = null;
    $pop.classList.remove("open");
    reportChrome();
  }

  const toCountOrPop = (el) => el && ($pop.contains(el) || el.closest?.("#counts [data-pop]"));
  function leavePop(e) {
    if (toCountOrPop(e.relatedTarget)) return;
    clearTimeout(popShowTimer);
    clearTimeout(popHideTimer);
    popHideTimer = setTimeout(hidePop, POP_GRACE);
  }
  $counts.addEventListener("pointerover", (e) => {
    const t = e.target.closest("[data-pop]");
    if (!t) return;
    clearTimeout(popHideTimer);
    if (popAnchor === t) return;
    clearTimeout(popShowTimer);
    popShowTimer = setTimeout(() => showPop(t), popKind ? 0 : POP_DELAY); // from one count to the next, at once
  });
  $counts.addEventListener("pointerout", (e) => { if (e.target.closest("[data-pop]")) leavePop(e); });
  $pop.addEventListener("pointerenter", () => clearTimeout(popHideTimer));
  $pop.addEventListener("pointerleave", leavePop);
  let popQuietFocus = false; // focus coming back after Escape doesn't reopen the card
  $counts.addEventListener("focusin", (e) => {
    const t = e.target.closest("[data-pop]");
    if (t && !popQuietFocus) showPop(t);
    popQuietFocus = false;
  });
  // A click goes to those cards: back to Last 7 Days if needed, up (or down) to the
  // first of them, and a ring on each for a moment. The details stay on hover.
  const FOR_COUNT = {
    needs: (s) => needsYou(s),
    working: (s) => s.status === "working",
    agents: (s) => (s.agentCount || 0) > 0,
    week: () => true,
  };
  let foundTimer;
  function goToCards(match, ring = true) {
    hidePop();
    if (view !== "week") setView("week");
    const sids = new Set(state.sessions.filter(match).map((s) => s.sid));
    const els = [...$week.querySelectorAll(".card, .hrow")].filter((el) => sids.has(el.dataset.sid));
    if (!els.length) return;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    els[0].scrollIntoView({ block: "nearest", behavior: still ? "auto" : "smooth" });
    els[0].focus({ preventScroll: true });
    clearTimeout(foundTimer);
    $week.querySelectorAll(".found").forEach((el) => el.classList.remove("found"));
    if (!ring) return;
    els.forEach((el) => el.classList.add("found"));
    foundTimer = setTimeout(() => els.forEach((el) => el.classList.remove("found")), 1600);
  }
  function goToCount(kind) {
    if (kind !== "week") return goToCards(FOR_COUNT[kind] || (() => false));
    hidePop();
    if (view !== "week") setView("week");
    $content.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  $counts.addEventListener("click", (e) => { const t = e.target.closest("[data-pop]"); if (t) goToCount(t.dataset.pop); });
  document.addEventListener("pointerdown", (e) => { if (popKind && !toCountOrPop(e.target)) hidePop(); });
  $counts.addEventListener("keydown", (e) => {
    const t = e.target.closest("[data-pop]");
    if (!t) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      goToCount(t.dataset.pop); // the same as a click
    } else if (e.key === "ArrowDown") {
      // Down arrow steps into the card's rows; up and down move between them.
      e.preventDefault();
      if (popAnchor !== t) showPop(t);
      $pop.querySelector(".prow[data-sid], .prow[data-state], .prow[data-go]")?.focus();
    }
  });
  $pop.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const rows = [...$pop.querySelectorAll(".prow[data-sid], .prow[data-state], .prow[data-go]")];
    const i = rows.indexOf(document.activeElement);
    if (e.key === "ArrowUp" && i <= 0) return popAnchor?.focus();
    rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))]?.focus();
  });
  document.addEventListener("focusin", (e) => { if (popKind && !toCountOrPop(e.target)) hidePop(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !popKind) return;
    const back = popAnchor;
    hidePop();
    if (back && document.activeElement !== back) { popQuietFocus = true; back.focus({ preventScroll: true }); }
  });
  addEventListener("resize", () => { if (popKind) placePop(); });
  $pop.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (go) { hidePop(); return setView(go.dataset.go); }
    // A row goes to its card (or a state to its cards); the card itself opens the session.
    const item = e.target.closest("[data-sid]");
    if (item) return goToCards((s) => s.sid === item.dataset.sid);
    const st = e.target.closest("[data-state]");
    if (st) goToCards((s) => label(s) === st.dataset.state);
  });

  // The app says when a newer version is out. "Later" hides it until the next version.
  let update = null;
  let dismissed = "";
  try { dismissed = localStorage.getItem("csm-update-dismissed") || ""; } catch {}
  window.csm.updateAvailable = (v) => { update = v; renderBanner(); };

  function renderBanner() {
    const offline = ready && link === "offline"
      ? `<div class="banner" role="status">${ICON.unplug}<span><b>Can't reach the monitor.</b> Showing what it last sent while it tries again.</span></div>`
      : "";
    const newer = update && update !== dismissed
      ? `<div class="banner update" role="status">${ICON.arrowDown}<span><b>Version ${esc(update)} is available.</b> Download it, quit this one, and put the new one in Applications in its place.</span>
          <button class="btn" type="button" data-update>Download</button>
          <button class="x" type="button" data-later aria-label="Later" title="Later">${ICON.close}</button></div>`
      : "";
    const html = offline + newer;
    if ($banner.innerHTML !== html) $banner.innerHTML = html;
  }
  $banner.addEventListener("click", (e) => {
    if (e.target.closest("[data-update]")) bridge()?.postMessage({ update: true });
    if (e.target.closest("[data-later]")) {
      dismissed = update;
      try { localStorage.setItem("csm-update-dismissed", update); } catch {}
      renderBanner();
    }
  });

  let freshTimer;
  function render() {
    renderHeader();
    renderBanner();
    renderWeek();
    if (view === "history") refreshHistory();
    if (view === "scheduled") renderScheduled();
    // Redraw when the first breathing minute of something that needs you runs out.
    clearTimeout(freshTimer);
    const ends = state.sessions.filter(isFresh).map((s) => (s.since || s.last) + FRESH_MS - now());
    if (ends.length) freshTimer = setTimeout(render, Math.max(50, Math.min(...ends) + 50));
  }

  // Animated icons breathe or turn in step with each other, whenever their card was
  // drawn: each starts at the same point of a shared 2.4 s clock.
  function syncIcons(root) {
    const offset = `-${Math.round(performance.now() % 2400)}ms`;
    root.querySelectorAll("svg.spin, svg.pulse, svg.bot, .bar .now").forEach((d) => { d.style.animationDelay = offset; });
  }

  // ---------------------------------------------------------------- sound

  // In the app the alert sound is the system's, played by the app when sound is on; in
  // a browser, a soft chime, off until you turn it on (that click also unlocks audio).
  let audio = null;
  let soundOn = false;
  try { soundOn = localStorage.getItem("csm-sound") === "1"; } catch {}
  function paintSound() {
    const text = soundOn ? "Turn Off Alert Sound" : "Turn On Alert Sound";
    $sound.innerHTML = soundOn ? ICON.speaker : ICON.speakerOff;
    $sound.setAttribute("aria-pressed", String(soundOn));
    $sound.setAttribute("aria-label", text);
    $sound.title = text;
  }
  $sound.addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem("csm-sound", soundOn ? "1" : "0"); } catch {}
    if (soundOn) { audio = audio || new AudioContext(); audio.resume(); chime(); }
    paintSound();
  });
  function chime() {
    if (!soundOn) return;
    audio = audio || new AudioContext();
    const t = audio.currentTime;
    [[880, 0], [1320, 0.12]].forEach(([f, d]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.18, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.35);
      o.connect(g).connect(audio.destination);
      o.start(t + d); o.stop(t + d + 0.4);
    });
  }
  paintSound();

  // ---------------------------------------------------------------- live updates

  // What is worth a sound and a spoken note: a session starts waiting on you, or ends
  // its turn with a question or an error.
  const alertKey = (s) =>
    s.status === "waiting" ? `w:${s.wait}` : s.status === "asks" ? `a:${s.ask}` : s.status === "error" ? `e:${s.error}` : s.status;

  function receive(next) {
    const first = !ready;
    const changed = [];
    for (const s of next.sessions) {
      const key = alertKey(s);
      if (!first && seen.get(s.sid) !== key && /^[wae]:/.test(key)) changed.push(s);
    }
    state = next;
    live = new Map(next.sessions.map((s) => [s.sid, s]));
    ready = true;
    skew = next.now - Date.now();
    render();
    seen.clear();
    for (const s of next.sessions) seen.set(s.sid, alertKey(s));
    if (!seen.size) seen.set("", "");
    const needs = next.needs ?? next.sessions.filter(needsYou).length;
    document.title = needs ? `(${needs}) Claude Session Monitor` : "Claude Session Monitor";
    if (changed.length) {
      const text = changed.map((s) => `${s.title}: ${s.status === "error" ? "error" : "needs you"}`).join(". ");
      if (bridge()) bridge().postMessage({ alert: true, announce: text }); // the app speaks it and plays the sound
      else { $announce.textContent = text; chime(); }
    }
  }

  function setLink(v) {
    if (link === v) return;
    link = v;
    $link.classList.toggle("off", v !== "live");
    $link.lastElementChild.textContent = v === "live" ? "Live" : v === "offline" ? "Offline" : "Connecting…";
    render();
  }

  // The server pings every 10 s. With no word from it for 25 s the connection is dead
  // even if it never closed, so start over.
  let es = null;
  let heard = 0;
  function connect() {
    es?.close();
    es = new EventSource("/api/stream");
    heard = Date.now();
    es.onopen = () => { heard = Date.now(); setLink("live"); };
    es.onmessage = (m) => { heard = Date.now(); setLink("live"); receive(JSON.parse(m.data)); };
    es.addEventListener("ping", () => { heard = Date.now(); setLink("live"); });
    es.onerror = () => setLink("offline"); // EventSource keeps retrying on its own
  }
  setInterval(() => {
    if (Date.now() - heard > 25_000) { setLink("offline"); connect(); }
  }, 5000);
  render();
  connect();
  setInterval(render, 15000); // keeps "5m ago" fresh
</script>
</body>
</html>
