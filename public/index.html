<!doctype html>
<html lang="en" data-density="compact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Claude Session Monitor</title>
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="design-base.css">
<link rel="stylesheet" href="design-components.css">
<link rel="stylesheet" href="design-dataviz.css">
<script src="design-icons.js"></script>
<style>
  /* The family's design system draws the tokens, the base and the shared components
     (design-*.css, vendored from mac-app-design; never edit them here). What follows is
     this page's own: its layout, the usage meter and strip, and its menus. */


  /* In the app it should feel like a Mac window, not a web page: the arrow cursor (the
     hand is for links), no text selection, and its own context menu. */

  /* The page fills its window and reflows to any size: the header, then the views,
     which scroll when their content doesn't fit. */
  .strip { display: flex; flex-direction: column; gap: 12px; height: 100%; padding: 12px 16px 0; }
  /* No rubber band at its ends: a flick that ends at the top would drag the pinned usage tile
     down and back with the cards. */
  .content { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: none; margin: 0 -8px; padding: 0 8px 16px; scroll-padding-block: 32px; }
  /* Where the view scrolls out of sight, it fades into the window (the design system's
     .scroll-fade), over the side gutters too; a card brought into view clears the fade. */
  .content > .scroll-fade { margin-inline: -8px; }
  .content > .scroll-fade.down { bottom: -16px; }
  #pop { scroll-padding-block: 24px; }
  .view[hidden] { display: none; }

  /* In the app (?embed) the window has a transparent title bar: the header sits on the
     same line as the window buttons (left) and the toolbar (right), which holds the
     view tabs, search, status and sound in place of the page's own. */
  body.embed .strip { padding-top: var(--csm-chrome-top, 12px); }
  body.embed header { padding-right: var(--csm-chrome-right, 0px); }
  body.embed :is(#link, #sound, header .seg, header .search, header .pinf) { display: none; }
  .lights { display: none; flex: none; width: var(--csm-lights-w, 56px); height: 1px; margin-right: -8px; }
  body.embed .lights { display: block; }


  /* ---------- header ---------- */
  /* The plan's weekly usage, from the status line: quiet gray, orange from 80%. */
  .usage { display: inline-flex; align-items: center; gap: 7px; flex: none; height: var(--csm-tag-h); padding: 0 8px; border-radius: var(--radius-inner); background: none; font-size: var(--csm-text-meta); line-height: var(--csm-lh-meta); color: var(--color-text-secondary); margin-right: 6px; cursor: default; }
  .usage[hidden] { display: none; }
  .usage .u-bar { width: 84px; height: 6px; border-radius: 3px; background: var(--color-overlay-pressed); overflow: hidden; }
  .usage .u-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--obsidian-text-hover); transition: width 600ms var(--ease-standard), background-color 200ms var(--ease-standard); }
  .usage .u-pct { color: var(--color-text-primary); font-weight: var(--font-weight-heading); font-variant-numeric: tabular-nums; }
  .usage.high .u-bar i { background: var(--color-warning); }
  .usage.high .u-pct { color: var(--color-text-orange); }
  @media (prefers-reduced-motion: reduce) { .usage .u-bar i { transition: background-color 200ms linear; } }
  @container (max-width: 640px) { .usage .u-lbl, .usage .u-reset { display: none; } }
  @container (max-width: 480px) { .usage { display: none; } }
  .link { display: inline-flex; align-items: center; gap: 6px; font-size: var(--csm-text-meta); color: var(--color-text-secondary); }
  .link i { width: 6px; height: 6px; border-radius: 50%; background: #26A756; }
  .link.off i { background: var(--color-error); }

  /* ---------- view tabs and search (in the browser; the app has them in its toolbar) ----------
     They sit in the header's row, the tabs and then the search, before the week's usage. When
     the header runs short the tabs keep their icons and drop their words (the words stay as tips). */
  header .seg { flex: none; margin-left: 8px; }
  header .seg button { height: 22px; } /* 26 px in all, as tall as the search beside it */
  header .search { flex: 0 1 240px; min-width: 120px; margin: 0 6px 0 8px; }
  header .search input { height: 26px; }
  header .search svg.i { top: 6px; }
  @container (max-width: 940px) { header .seg button > span { display: none; } }

  /* ---------- groups ---------- */
  .group + .group { margin-top: 20px; }
  /* Last 7 Days: Active as cards, and under it the rest of the week as rows. In it and in
     All Sessions, a long day in a wide window goes into two columns, read down the first
     and on into the second. */
  #week, #history { container: list / inline-size; }
  .wsplit { display: flex; flex-direction: column; gap: 28px; }
  .wmain:empty, .wside:empty { display: none; }
  .qart { display: inline-flex; gap: 6px; flex: none; }
  .qcard { width: 84px; height: 34px; border-radius: 6px; padding: 7px 8px; display: flex; flex-direction: column; gap: 6px;
    background: var(--color-background-card); opacity: 1; transition: background-color 450ms var(--ease-standard), opacity 400ms var(--ease-standard); }
  .qcard.off { opacity: 0; }
  .qcard b { height: 4px; width: 70%; border-radius: 2px; background: #FFFFFF26; }
  .qrow { display: flex; align-items: center; gap: 4px; height: 10px; }
  .qpill { width: 24px; height: 8px; border-radius: 3px; background: #FFFFFF26; transition: background-color 450ms var(--ease-standard); }
  .qcard .calm, .qcard .pdot, .qok { display: none; }
  .qcard .calm { transform: scale(0.8); transform-origin: left center; color: var(--color-mark-working); }
  .qcard .pdot { transform: scale(0.85); color: var(--color-text-orange); }
  .qok svg.i { width: 10px; height: 10px; color: var(--color-text-green); }
  .qcard.work { background: var(--color-background-card); } .qcard.work .qpill { background: #7170FF59; } .qcard.work .calm { display: inline-flex; }
  .qcard.need { background: var(--color-background-card); } .qcard.need .qpill { background: var(--color-warning); } .qcard.need .pdot { display: inline-grid; }
  .qcard.done { background: var(--color-background-card); } .qcard.done .qpill { background: var(--color-success-muted); } .qcard.done .qok { display: inline-flex; }
  .wside .hlist { max-width: none; } /* as wide as the cards above, so the edges line up */
  @container list (min-width: 1100px) {
    #history .hlist, #history .group-head { max-width: none; } /* as wide as Last 7 Days, so both columns have room */
    .hlist.long { display: block; columns: 2; column-gap: 8px; }
    .hlist.long .hrow { width: 100%; margin-bottom: 4px; break-inside: avoid; }
  }
  /* Active's window: its words are a menu, with a small chevron to say so. */
  .pick-box { position: relative; display: inline-flex; align-items: center; gap: 3px; border-radius: 4px; transition: color var(--duration-fast) var(--ease-standard); }
  .pick-box svg.chev { width: 9px; height: 9px; opacity: 0.6; }
  .pick-box select { position: absolute; inset: 0; width: 100%; margin: 0; opacity: 0; cursor: pointer; font: inherit; }
  .pick-box:hover { color: var(--color-text-primary); }
  .pick-box:hover svg.chev { opacity: 1; }
  /* WebKit counts a click on a menu as keyboard focus: the ring shows only when you came by keyboard. */
  .pick-box:has(select:focus-visible:not([data-clicked])) { outline: 2px solid var(--color-text-accent); outline-offset: 2px; }
  /* The week's usage, a narrow tile at the right of Active, always two cards tall. The week
     reads bottom up as its seven days; the fill is what you've used, the blue mark is
     where an even week would be today. Gray while you're on pace, orange when you run
     hot, red near the limit. */
  .abody { display: flex; gap: 8px; align-items: stretch; }
  .abody > .grid { flex: 1; min-width: 0; }
  .abody > .grid:empty, .abody:has(> .quiet) > .grid { display: none; } /* cards still fading out don't hold a column beside the quiet line */
  .abody > .quiet { flex: 1; align-self: flex-start; }
  .meter { --fill: #C4C8CF; --over: var(--fill); --say: var(--color-text-secondary);
    /* Always two cards tall, whether Active has one row or more, so the day blocks keep their size. */
    flex: none; align-self: flex-start; width: 96px; box-sizing: border-box; height: calc(2 * var(--csm-card-h) + 8px);
    /* It stays where it starts while Active's cards scroll by (pinMeter sets its top to that
       place), and goes with Active once its cards end. */
    position: sticky; top: 0;
    display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 4px; cursor: default; }
  /* Flush with the cards beside it: the tile is a box as tall as two cards, so "This week"
     starts on their top edge and the last line ends on the second row's bottom edge, each with
     its whole line, not its letters, which sit inside it like a card's text. */
  /* While the layout glides the cards, it lifts Active out of the flow and puts it back in
     place with a translate; the sticky top would then count Active's place twice and the
     meter would drop by it. The translate already holds that place, so no top meanwhile. */
  #week.is-animated .abody > .meter { top: 0 !important; }
  .meter[hidden] { display: none; }
  .meter.on-pace, .meter.plenty { --say: var(--color-text-green); }
  /* Ahead of pace, only the part above the blue line takes the color: how much too fast. */
  .meter.fast { --over: var(--color-text-orange); --say: var(--color-text-orange); }
  .meter.hot { --over: var(--color-warning); --say: var(--color-text-orange); }
  .meter.limit { --fill: var(--color-error); --over: var(--color-error); --say: var(--color-text-red); }
  .meter .m-lbl { font-size: var(--csm-text-meta); line-height: var(--csm-lh-meta); letter-spacing: 0.01em; color: var(--color-text-secondary); }
  /* The figure in rounded digits, like a gauge's reading. */
  /* The digits sit on the column's axis, over the day blocks; the % follows on the same
     baseline, same family and weight, a step quieter. An invisible % on the left balances it. */
  .meter .m-pct { display: block; white-space: nowrap; font-family: ui-rounded, var(--font-family-body); font-size: 32px; line-height: 34px; font-weight: var(--font-weight-heading); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--color-text-primary); }
  .meter .m-pct small.ghost { visibility: hidden; margin-left: 0; margin-right: 1px; }
  .meter .m-pct small { font-size: 17px; line-height: 1; font-weight: var(--font-weight-heading); letter-spacing: 0; margin-left: 1px; color: var(--color-text-secondary); }
  /* The week, bottom up: one segment a day, filled up to what you've used; the days gone
     by a step lighter than the ones to come; now is the blue line across today. */
  .meter .m-week { flex: 1; min-height: 40px; display: flex; flex-direction: column-reverse; gap: 2px; margin: 12px 0 10px; }
  .meter .m-row { flex: 1; min-height: 0; display: flex; align-items: center; gap: 7px; }
  /* Sized by the script in whole screen pixels, so every day and every gap is the same. */
  .meter .m-week.snap { gap: var(--gap); justify-content: center; }
  .meter .m-week.snap .m-row { flex: none; height: var(--row); }
  .meter .m-row::after { content: ""; width: 9px; flex: none; } /* balances the letter, so the days sit on the axis */
  .meter .m-dl { width: 9px; flex: none; font-size: 10px; line-height: 10px; font-weight: var(--font-weight-medium); color: var(--color-text-secondary); text-align: center; }
  .meter .m-row.today .m-dl { color: var(--color-text-primary); font-weight: var(--font-weight-heading); }
  .meter .m-seg { position: relative; align-self: stretch; width: 22px; border-radius: 2px; background: #FFFFFF0D; }
  .meter .m-row.past .m-seg, .meter .m-row.today .m-seg { background: #FFFFFF1C; }
  .meter .m-seg b { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: inherit; background: var(--fill);
    transition: height 380ms var(--ease-standard) var(--d, 0ms), background-color 450ms var(--ease-standard); }
  .meter .m-seg i { position: absolute; left: 0; right: 0; height: 0; border-radius: inherit; background: var(--over);
    transition: height 380ms var(--ease-standard) var(--d, 0ms), background-color 450ms var(--ease-standard); }
  /* Where the used part meets the part ahead of pace, under the blue line, the corners are straight. */
  .meter .m-seg b.seam { border-top-left-radius: 0; border-top-right-radius: 0; }
  .meter .m-seg i.seam { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  /* The dark contour sets the line off the fill: 1.6 px, 2 screen pixels at 125%. */
  .meter .m-now { position: absolute; left: -5px; right: -5px; height: 2px; margin-bottom: -1px; border-radius: 1px; background: var(--color-text-accent); box-shadow: 0 0 0 1.6px var(--color-background-body); z-index: 1; }
  .meter .m-say { font-size: var(--csm-text-body); line-height: var(--csm-lh-body); font-weight: var(--font-weight-heading); color: var(--say); }
  .meter .m-reset { margin-top: 1px; font-size: var(--csm-text-meta); line-height: var(--csm-lh-meta); color: var(--color-text-secondary); }
  /* Ahead of pace, when it runs out takes the reset's place, in the pace's color. */
  .meter .m-out, .wstrip .ws-out { color: var(--say); font-weight: var(--font-weight-heading); }
  .meter:focus-visible, .wstrip:focus-visible, .usage:focus-visible { outline: 2px solid var(--color-text-accent); outline-offset: 2px; border-radius: var(--radius-inner); }

  /* The usage card, on hover or focus of the week's usage: a raised surface, lifted by a
     shadow, not a line; groups set apart by space; one left edge for all its text. */
  .ucard { position: fixed; z-index: 30; width: min(248px, calc(100vw - 16px)); box-sizing: border-box; padding: 6px; border-radius: 12px;
    background: var(--color-surface-raised); box-shadow: 0 16px 40px #000000A0; color: var(--color-text-primary);
    font-size: var(--csm-text-body); line-height: var(--csm-lh-body); font-variant-numeric: tabular-nums; pointer-events: none;
    opacity: 0; visibility: hidden; transform: translateX(6px) scale(0.98); transform-origin: right top;
    transition: opacity 120ms var(--ease-standard), transform 120ms var(--ease-standard), visibility 0s linear 120ms; } /* out quickly */
  .ucard.below { transform: translateY(-6px) scale(0.98); transform-origin: left top; }
  /* In gently, from the side of what it explains: a slower fade while it settles. */
  .ucard.open { opacity: 1; visibility: visible; transform: none;
    transition: opacity 220ms var(--ease-standard), transform 320ms cubic-bezier(0.16, 1, 0.3, 1), visibility 0s; }
  @media (prefers-reduced-motion: reduce) {
    .ucard, .ucard.below { transform: none; transition: opacity 120ms linear, visibility 0s linear 120ms; }
    .ucard.open { transform: none; transition: opacity 220ms linear, visibility 0s; }
  }
  /* When it runs out: no solid block, so the amber cards stay the only light surface. The label
     and the note in gray, the date between them in orange (8.9:1), red once the week is used up (7.7:1). */
  .uc-out { border-radius: 6px; padding: 8px 10px 2px; color: var(--color-text-primary); }
  .uc-out .l { font-size: 11.5px; line-height: 15px; color: var(--color-text-secondary); }
  .uc-out .t { margin: 2px 0 -1px; font-size: 17px; line-height: 22px; font-weight: var(--font-weight-heading); letter-spacing: -0.01em; color: var(--color-text-orange); }
  .uc-out.limit .t { color: var(--color-text-red); }
  .uc-chart { padding: 10px 10px 0; }
  .uc-out + .uc-chart { padding-top: 12px; }
  .uc-chart svg { display: block; overflow: visible; }
  .uc-chart text { font: var(--font-weight-medium) 10px var(--font-family-body); fill: var(--color-text-secondary); }
  .uc-chart text.today { fill: var(--color-text-primary); font-weight: 700; }
  .uc-chart text.lim { font-size: 9.5px; }
  .uc-rows { padding: 8px 10px 0; }
  .uc-rows + .uc-rows { padding-top: 10px; }
  .uc-row { display: flex; align-items: center; gap: 8px; height: 20px; }
  .uc-row .k { flex: 1; color: var(--color-text-secondary); }
  .uc-row .v { font-weight: 500; color: #E6E8EB; }
  .uc-sw { width: 14px; height: 2px; border-radius: 1px; background: var(--color-text-accent); } /* the blue line it's measured against */
  .uc-bar { width: 36px; height: 3px; border-radius: 2px; background: #FFFFFF1C; overflow: hidden; }
  .uc-bar b { display: block; height: 100%; background: #C4C8CF; }
  /* As the header strip writes it: the data in white, the words in gray. */
  .uc-foot { padding: 10px 10px 6px; font-size: var(--csm-text-meta); line-height: var(--csm-lh-meta); color: var(--color-text-secondary); }
  .uc-foot b { color: var(--color-text-primary); font-weight: var(--font-weight-heading); }
  /* The 5-hour window, last: its line's box ends on the second row's bottom edge. In SF Pro
     the capitals sit in the middle of the line, so the bar, centered on the line, is centered
     on them; the line above sits halfway between the reset's baseline and these capitals, the
     padding less the room the line keeps above them. */
  .meter .m-five { align-self: stretch; display: flex; align-items: center; gap: 6px; margin-top: 5px; padding-top: calc(8px - (1lh - 1cap) / 2); font-size: var(--csm-text-meta); line-height: var(--csm-lh-meta); color: var(--color-text-secondary); }
  .meter .m-five i { flex: 1; height: 4px; border-radius: 2px; background: var(--color-overlay-pressed); position: relative; overflow: hidden; }
  .meter .m-five i b { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--color-text-secondary); }
  .meter .m-five .v { color: var(--color-text-primary); font-variant-numeric: tabular-nums; }
  /* Short cards: the tile drops what it can do without. */
  @container list (max-width: 520px) { .meter { display: none; } }
  /* The fills carry their height from the first draw; only the very first time they grow
     from empty, in turn from the bottom. */
  @starting-style { .meter.intro .m-seg b, .meter.intro .m-seg i { height: 0; } }
  @media (prefers-reduced-motion: reduce) { .meter .m-seg b, .meter .m-seg i { transition: background-color 200ms linear; } }
  /* The week's reset (rollWeek): one clock draws the fills and the blue line, which travels
     across the days on its own. */
  .rolling :is(.m-week, .ws-days) { position: relative; }
  .rolling :is(.m-seg, .ws-seg) :is(b, i) { transition: none; }
  .week-roll-now { position: absolute; border-radius: 1px; background: var(--color-text-accent); box-shadow: 0 0 0 1.6px var(--color-background-body); z-index: 1; pointer-events: none; }

  /* The rest of the week sits a step back from the active zone. */
  .group.active + .group { margin-top: 28px; }

  /* As many 288 px columns as fit, stretched to fill the width; one column, as wide as
     the window, when it's narrower than a card. */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--csm-card-w)), 1fr));
    grid-auto-rows: var(--csm-card-h);
    gap: 8px;
  }

  /* ---------- cards: the design system draws them; these are this page's own ---------- */
  .group:not(.active) .card.done { --tint: var(--color-background-card); }
  .group:not(.active) .card.done { --meta: var(--color-text-secondary); }
  .card .detail b, .card .detail .cur { color: var(--obsidian-text-hover); }
  .card .detail .cur { font-weight: 500; }
  /* Cards are always compact (130 px), so the plan's bar takes the folder's place, at the foot of the card. */
  .card:has(.bar) .tags { display: none; }
  .card .bar { margin-top: auto; padding-bottom: 6px; }
  /* A reminder's time and a "+1" never shrink; a long task name gives way first. */
  .tags .tag.sched { flex: none; }
  .tags .tag.made { flex: 0 100000 auto; min-width: 64px; }

  /* The plan's progress, one segment per step: done, the one it's on, still to do. The
     row is taller than the 2 px line so its tooltip is easy to hover. */
  .bar { display: flex; align-items: center; gap: 8px; height: 12px; margin-top: 2px; }
  .bar .segs { flex: 1; display: flex; align-items: center; gap: 4px; }
  .bar .segs span { flex: 1; height: 4px; border-radius: 2px; background: var(--color-fill); }
  .bar .segs span.on { background: var(--color-mark-working); }
  .bar .segs span.now { background: color-mix(in srgb, var(--color-mark-working) 45%, transparent); }
  /* The step in progress breathes while the session works, in step with its spinner. */
  .card.working .bar .segs span.now { background: var(--color-mark-working); animation: step 2.4s ease-in-out infinite; }
  /* On an amber card, in its own ink, as its task runs are: done steps black, the one it's on
     a lighter black, the rest a faint black track (the white track vanished on amber and the
     mark read as gray). */
  .card:is(.waiting, .asks, .needs):not(.stale) .bar .segs span { background: #00000033; }
  .card:is(.waiting, .asks, .needs):not(.stale) .bar .segs span.on { background: var(--color-on-needs); }
  .card:is(.waiting, .asks, .needs):not(.stale) .bar .segs span.now { background: color-mix(in srgb, var(--color-on-needs) 55%, transparent); }


  /* ---------- history ---------- */
  /* A readable line length: the time stays near the title on a wide window. */
  .hlist { display: flex; flex-direction: column; gap: 4px; max-width: 960px; }
  #history .group-head { max-width: 960px; }
  mark { background: #F2994A40; color: inherit; border-radius: 2px; }
  /* A row keeps the card surface whatever its state, which its mark and words say; only a row that
     needs you is amber, as its card is (the design system draws that). */
  .hrow.live .htime { color: var(--csm-text-on-tint); }
  .hrow.live.s-waiting .htime, .hrow.live.s-asks .htime { color: var(--color-text-orange); }
  .hrow.live.s-error .htime { color: var(--color-text-red); }
  .hrow .hicon svg.spin { animation: spin 2.4s linear infinite; }
  .hrow .tag.name { max-width: 160px; }
  .hrow.found { box-shadow: 0 0 0 2px var(--color-text-accent); }
  .hrow.fresh .hicon svg.pulse { animation: breathe 2.4s ease-in-out infinite; }
  .hrow .hstate { font-size: var(--csm-text-meta); font-weight: var(--font-weight-medium); white-space: nowrap; }
  .hrow.s-working .hstate { color: var(--color-text-working); }
  .hrow.s-waiting .hstate, .hrow.s-asks .hstate { color: var(--color-text-orange); }
  .hrow.s-error .hstate { color: var(--color-text-red); }

  /* ---------- scheduled ---------- */
  /* A task's card is calm unless its last run needs you, failed today or is running: then
     it takes that run's color. Done, paused and missed stay plain, with the tag saying it. */
  #scheduled .card.done, #scheduled .card.unrun, #scheduled .card.ended, #scheduled .card.paused, #scheduled .card.missed, #scheduled .card.queued {
    --tint: var(--color-background-card); --meta: var(--color-text-secondary);
  }
  #scheduled .group.active .card.done { --meta: var(--color-text-tinted); } /* done keeps the tinted cards' gray, on the plain surface */
  #scheduled .card.paused .title { color: var(--color-text-secondary); }
  .tag.s-missed { color: var(--color-text-orange); font-weight: var(--font-weight-medium); }
  /* The state's tag has no fill: the word and its mark in their color. */
  .card .top .tag:is(.s-working, .s-done, .s-error, .s-missed, .s-idle, .s-ended, .s-asks, .s-waiting) { background: none; padding: 0; gap: 6px; }
  #scheduled .card .tag.s-idle { background: none; }
  /* The last runs, oldest on the left: one dot each, in the color of how it ended. */
  .dots { display: inline-flex; align-items: center; gap: 4px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--color-overlay-pressed); }
  .dots i.r-done { background: var(--color-success); }
  .dots i.r-waiting, .dots i.r-asks { background: var(--color-needs); }
  .dots i.r-error { background: var(--color-error); }
  .dots i.r-working { background: var(--color-mark-working); }
  /* On an amber card the runs that needed you are black, the rest a dim black, so they show. */
  .card:is(.waiting, .asks, .needs):not(.stale) .dots i { background: #00000033; }
  .card:is(.waiting, .asks, .needs):not(.stale) .dots i:is(.r-waiting, .r-asks) { background: var(--color-on-needs); }
  .card:is(.waiting, .asks, .needs):not(.stale) .dots i.r-done { background: #2E6B24; }
  .card:is(.waiting, .asks, .needs):not(.stale) .dots i.r-error { background: #A3261F; }
  .hrow .hsched { display: inline-flex; color: var(--color-text-secondary); flex: none; }
  .hrow.live:is(.s-waiting, .s-asks) .hsched { color: var(--color-on-needs-text); } /* an amber row's icons in its ink, as its time and folder */
  /* A scheduled task a session set up: its tag on the card opens it in Scheduled. */
  .card .tags { gap: 14px; }
  .card .tags .tag.name, .card .tags .tag.rel { background: none; padding: 0; color: var(--meta); }
  .card .tags .tag.rel { flex: 0 1 auto; min-width: 25px; cursor: pointer; }
  .card:is(.waiting, .asks, .needs):not(.stale) .detail svg.i { color: var(--meta); }
  .card .tags .tag.rel:hover { color: var(--obsidian-text-hover); }
  /* Pointing at a session with relatives spotlights its family: it and the sessions it's
     related to stay as they are, everything else steps back, and their relation tags light up. */
  .family :is(.card, .hrow):not(.rel-lit):not(.rel-self), .family .meter { opacity: 0.3; }
  /* The step back is quicker than a card's own fade, so the spotlight keeps up with the
     pointer: only the opacity's time changes, the design system's other times stay. */
  .meter { transition: opacity 160ms var(--ease-standard); }
  #content .card { transition-duration: 450ms, var(--duration-fast), 700ms, 160ms; }
  #content .grid > .card { transition-duration: 450ms, var(--duration-fast), 0s, 160ms; }
  #content .hrow { transition-duration: 450ms, 700ms, 160ms; }
  @media (prefers-reduced-motion: reduce) { #content .card { transition-duration: 450ms, 160ms; } }
  :is(.rel-lit, .rel-self) .tags .tag.rel { color: var(--color-text-primary); background: none; }
  .card .tags .tag[data-show-task]:hover { color: var(--obsidian-text-hover); background: none; }
  /* On an amber card the foot tags stay in its dark ink: lit and pointed at, they go black. */
  .card:is(.waiting, .asks, .needs):not(.stale) .tags .tag:is(.rel, [data-show-task]):hover,
  .card:is(.waiting, .asks, .needs):not(.stale):is(.rel-lit, .rel-self) .tags .tag.rel { color: var(--color-on-needs); }
  .top .time { margin-left: auto; }

  /* ---------- pins ----------
     A pin at the end of a card's top row, after the time, and at the end of a row: an outline
     on hover and keyboard focus, filled and always there once pinned (white on a dark card, in
     the amber card's dark ink). Its place is kept either way, so nothing moves when it shows. */
  .pin-b { flex: none; box-sizing: border-box; width: 18px; height: 18px; margin: -2px 0 -2px 2px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 4px; color: #666A73; opacity: 1; cursor: pointer; /* always there, one faint neutral gray on every dark tint; the card's own gray when you point at it */
    transition: opacity var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }
  .pin-b svg.i { width: 13px; height: 13px; fill: none; }
  .pin-b.gap { visibility: hidden; } /* a task's card keeps the place, so its time lines up with the cards beside it */
  :is(.card, .hrow):is(:hover, :focus-visible) .pin-b, .pin-b:focus-visible { color: inherit; }
  :is(.card, .hrow) .pin-b:hover { color: var(--color-text-primary); background: var(--color-fill); }
  :is(.card, .hrow) .pin-b.on { opacity: 1; color: var(--color-text-primary); }
  .pin-b.on svg.i { fill: currentColor; }
  .pin-b:focus-visible { outline: 2px solid var(--color-text-accent); outline-offset: 1px; }
  /* On amber: the dark ink, faint at rest, full when you point at its card or row, filled when pinned. */
  .card:is(.waiting, .asks, .needs):not(.stale) .pin-b, .hrow.live:is(.s-waiting, .s-asks) .pin-b { color: var(--color-on-needs); opacity: 0.45; }
  .card:is(.waiting, .asks, .needs):not(.stale):is(:hover, :focus-visible) .pin-b, .hrow.live:is(.s-waiting, .s-asks):is(:hover, :focus-visible) .pin-b,
  .card:is(.waiting, .asks, .needs):not(.stale) .pin-b:is(.on, :focus-visible), .hrow.live:is(.s-waiting, .s-asks) .pin-b:is(.on, :focus-visible) { opacity: 1; }
  .card:is(.waiting, .asks, .needs):not(.stale) .pin-b:hover, .hrow.live:is(.s-waiting, .s-asks) .pin-b:hover { background: #0000001F; }
  .card:is(.waiting, .asks, .needs):not(.stale) .pin-b:focus-visible, .hrow.live:is(.s-waiting, .s-asks) .pin-b:focus-visible { outline-color: var(--color-on-needs); }
  .hrow .htime { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
  /* The filter, in a browser: a toggle with its count before the view tabs (the app has it in its toolbar). */
  header .pinf { all: unset; flex: none; box-sizing: border-box; height: 26px; margin-left: 8px; padding: 0 9px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border-radius: var(--radius-element); background: var(--color-background-region); color: var(--color-text-secondary); font-size: var(--csm-text-body);
    transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }
  header .pinf svg.i { width: 13px; height: 13px; }
  header .pinf:hover { color: var(--obsidian-text-hover); }
  header .pinf[aria-pressed="true"] { background: var(--color-fill-hover); color: var(--color-text-primary); }
  header .pinf[aria-pressed="true"] svg.i { fill: currentColor; }
  header .pinf .n { font-variant-numeric: tabular-nums; color: var(--color-text-secondary); }
  header .pinf .n:empty { display: none; }
  header .pinf:focus-visible { outline: 2px solid var(--color-text-accent); outline-offset: 2px; }
  header .pinf + .seg { margin-left: 4px; }
  header .pinf + .pinf { margin-left: 4px; }
  /* Most active: the toggle's activity mark stays a line when it's on, and each session's time
     working sits beside its state, in the working mark's color (the amber card's ink on amber). */
  header .maf[aria-pressed="true"] svg.i { fill: none; }
  .ma-b { flex: none; display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; white-space: nowrap;
    font-size: var(--csm-text-meta); line-height: var(--csm-lh-meta); font-variant-numeric: tabular-nums; font-weight: 600;
    color: var(--color-text-working); } /* the working words' blue: 5.8:1 or more on every tint and its hover (the mark itself falls to 4.4 on a hovered working card) */
  .ma-b svg.i { width: 12px; height: 12px; }
  .card:is(.waiting, .asks, .needs):not(.stale) .ma-b { color: var(--color-on-needs); }
  .hrow.live:is(.s-waiting, .s-asks) .ma-b { color: var(--color-on-needs-text); }
  .hrow .htime .ma-b { margin: 0 4px 0 0; }
  /* A card's time sits beside its state; a compact card has no state tag, so it leads the time instead. */
  .card .time > .ma-b.in-time { display: none; }
  @media (max-width: 639px) {
    .card > .top > .ma-b { display: none; }
    .card .time > .ma-b.in-time { display: inline-flex; margin: 0 8px 0 0; }
    .hrow:has(.htime .ma-b) > .tag.name { display: none; } /* a compact row has room for its time working or its folder: the time */
  }
  .quiet.maq svg.i { width: 14px; height: 14px; }
  @container (max-width: 940px) { header .pinf .w { display: none; } }
  .quiet.pinq svg.i { width: 14px; height: 14px; }
  header.p-short .pinf .n { display: none; }
  header.p-short .pinf { padding: 0 6px; }
  header.u-short .usage :is(.u-lbl, .u-reset) { display: none; }
  header.u-none .usage { display: none; }
  header.s-short .search { min-width: 72px; flex-basis: 120px; }

  /* The model, its effort, ultracode and the advisor, beside the time and in its color. The
     effort is its initial knocked out of a solid square (L, M, H, X), and Max is written whole,
     so it never reads as Medium. The advisor (/advisor) is the initial of the model that advises
     the session, in a circle: a second model, where the squares are settings. Each card measures
     itself: as it narrows, the model goes first (under about 283 px), then the effort (under
     about 223); the time always stays, and the tooltip says it all in words. A wide state tag,
     or the pin's place at the row's end, can still crowd them: then the script drops the model,
     the effort, the advisor, then all of it (fitMeta). With "Needs you" and the pin, the model
     goes under about 296 px and the effort under about 241. */
  .grid > .card { container-type: inline-size; }
  .card .top .time { min-width: 0; }
  /* With no meta left to give way, the time keeps its own width again, so the state tag gives way instead. */
  .card .top .time:not(:has(> .meta)), .card .top .time:has(> .meta.no-meta) { min-width: auto; }
  .card .time .meta { display: inline-flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; white-space: nowrap; color: var(--meta); }
  .card .time .meta svg.i { width: 12px; height: 12px; flex: none; }
  /* Ultracode: UC in a tag the effort's height, drawn in a line instead of filled. Whole
     pixels (a 1 px line, a 22 × 16 box): both tags are 16 px, an even height, so centered on
     the state tag's 20 px line they start on a whole pixel and the line stays sharp at 1×. */
  .card .time .meta .uc {
    flex: none; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
    width: 22px; height: 16px; border: 1px solid currentColor; border-radius: 3.5px;
    font-size: 9.5px; line-height: 1; font-weight: 700; letter-spacing: 0.04em; text-indent: 0.04em; /* the spacing after the C, matched before the U: centered */
  }
  .card .time .meta .eff {
    flex: none; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
    min-width: 16px; height: 16px; padding: 0 3px; border-radius: 3.5px; background: currentColor;
    font-size: 10.5px; line-height: 1; font-weight: 700; letter-spacing: 0.01em;
    -webkit-text-fill-color: var(--eff-fill);
  }
  /* The letter is cut out of its chip in the card's own color. --tint doesn't reach it (it's
     registered so it can fade between states, and registered values don't inherit), so the card
     hands its color down under another name. */
  .card { --eff-fill: var(--tint); }
  .card .time .meta .eff.max { padding: 0 4px; }
  /* The advisor: its initial in a 16 px circle drawn in a 1 px line, after the session's own tags. */
  .card .time .meta .advr {
    flex: none; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
    width: 16px; height: 16px; border: 1px solid currentColor; border-radius: 50%;
    font-size: 9.5px; line-height: 1; font-weight: 700;
  }
  /* The letters sit on their ink's center, not their advance's: centerInk moves each by the measured INK table. */
  .card .time .meta :is(.eff, .uc, .advr) > i { font-style: normal; text-indent: 0; transform: translate(var(--ink-x, 0), var(--ink-y, 0)); }
  /* The top line is three groups: the session's setup (model, effort, advisor), its time, and the pin.
     The model sits 5 px from its first chip, a little more than chip to chip (4 px), since a solid
     chip reads closer than its box; about 12 px between the setup and the time, and between the time
     and the pin, whose icon ends on the card's content edge. */
  .card .time .meta .mdl + :is(.eff, .advr) { margin-left: 1.8px; }
  .card .top .time .pin-b { margin-left: 5.5px; margin-right: -2.5px; }
  .card .time .msep { width: 3px; } /* a little air between the model and the time, no dot */
  @container (max-width: 259px) { .card .time .meta .mdl { display: none; } }
  @container (max-width: 199px) {
    .card .time .meta .eff { display: none; }
    .card .time .meta:not(:has(.uc, .advr)), .card .time .meta:not(:has(.uc, .advr)) + .msep { display: none; }
  }
  .card .time .meta.no-mdl .mdl, .card .time .meta.no-eff :is(.mdl, .eff), .card .time .meta.no-adv :is(.mdl, .eff, .advr) { display: none; }
  .card .time .meta.no-eff:not(:has(.uc, .advr)), .card .time .meta.no-eff:not(:has(.uc, .advr)) + .msep,
  .card .time .meta.no-adv:not(:has(.uc)), .card .time .meta.no-adv:not(:has(.uc)) + .msep,
  .card .time .meta.no-meta, .card .time .meta.no-meta + .msep { display: none; }

  /* ---------- answers: a question's buttons at the card's foot ----------
     The session's own answers take the folder's place: the first, filled, is the one it
     proposes; the second is quiet and gives way when long. 2 px taller than a tag, so the
     gap above gives 2 px and the card keeps its height. A click sends it; one that can't
     be sent from here carries the open mark and opens the session. */
  .card > .ans, .card > .sentline { margin-top: auto; padding-top: max(0px, calc(var(--card-tags-gap) - 2px)); display: flex; align-items: center; gap: 6px; min-width: 0; }
  .card .a-b { box-sizing: border-box; flex: 0 1 auto; min-width: 0; height: 22px; padding: 0 9px; display: inline-flex; align-items: center; gap: 4px;
    border-radius: var(--radius-element); font-size: var(--csm-text-meta); line-height: 22px; font-weight: var(--font-weight-medium); white-space: nowrap;
    transition: background-color var(--duration-fast) var(--ease-standard); }
  .card .a-b > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .card .a-b svg.i { width: 12px; height: 12px; flex: none; opacity: 0.8; }
  .ans .pri { flex: 0 0 auto; max-width: 62%; background: var(--color-accent); color: var(--color-on-accent); }
  .ans .pri:hover { background: var(--color-accent-hover); }
  .ans .sec, .sentline .a-b { background: var(--color-fill-strong); color: var(--color-text-primary); }
  .ans .sec:hover, .sentline .a-b:hover { background: var(--color-fill-strong-hover); }
  /* Sent: the card turns to work in blue, and for 5 s the answer can be taken back. */
  .card.sent .detail, .card.sent .detail b { color: var(--color-text-primary); }
  .card > .sentline { height: 22px; box-sizing: content-box; font-size: var(--csm-text-meta); color: var(--meta); white-space: nowrap; }
  .sentline .say { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sentline .a-b { flex: none; }
  /* A permission's ask under its wait: what it would run, open or fetch, one line in mono
     at the card's width (the whole of it in the tooltip). Allow and Deny are answers. */
  .card .detail .line[data-what] .txt { font-family: var(--font-family-mono); font-size: 11px; color: var(--color-text-primary); }
  .card .detail .line[data-what] svg.i { flex: none; }

  /* ---------- dictation: the app's mic on a card that waits on you ----------
     A round mic at the end of the foot. Pressed, it stays on and a composer comes out of it:
     the design system's anchored popover, outside the card and in the list that scrolls, so
     it follows the card. It holds the words as they come, then a text box to fix them and
     send. The card under it doesn't change. Five bars beside "Listening" follow the mic's
     level, calmly, in transform only; Reduce Motion keeps only their color. */
  .card .mic-b { order: 99; flex: none; margin-left: auto; box-sizing: border-box; width: 24px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-element); background: var(--color-fill-strong); color: var(--color-text-primary); transition: background-color var(--duration-fast) var(--ease-standard); }
  .card .mic-b:hover { background: var(--color-fill-strong-hover); }
  /* Its answers, the mic and the tags that open something are .ctl: they press themselves, not
     the card (the design system's rule). */
  .card .mic-b.on, .card .mic-b.on:hover { background: var(--color-accent); color: var(--color-on-accent); }
  .card .mic-b svg.i { width: 14px; height: 14px; }
  .card .mic-b:focus-visible, .dict :is(.d-b, .d-edit):focus-visible { outline: 2px solid var(--color-text-accent); outline-offset: 1px; }
  /* On the amber card (what needs you): only its two inks, black and amber. The first answer and
     the mic are black with amber words, the second answer is plain black words, and the mic
     in use wears a black ring 2 px out. */
  .card:is(.waiting, .asks, .needs):not(.stale) .ans .pri { background: var(--color-on-needs); color: var(--color-needs); font-weight: 600; }
  .card:is(.waiting, .asks, .needs):not(.stale) .ans .pri:hover { background: var(--color-on-needs-hover); }
  .card:is(.waiting, .asks, .needs):not(.stale) .ans .sec { background: none; color: var(--color-on-needs); }
  .card:is(.waiting, .asks, .needs):not(.stale) .ans .sec:hover { background: #0000001F; }
  .card:is(.waiting, .asks, .needs):not(.stale) .sentline .a-b { background: #0000001C; color: var(--color-on-needs); }
  .card:is(.waiting, .asks, .needs):not(.stale) .sentline .a-b:hover { background: #0000002B; }
  .card:is(.waiting, .asks, .needs):not(.stale) .mic-b { background: var(--color-on-needs); color: var(--color-needs); }
  .card:is(.waiting, .asks, .needs):not(.stale) .mic-b:hover { background: var(--color-on-needs-hover); }
  /* Pressed, an amber card's mic keeps its look, with no ring: the drawer open under the card shows it listens. */
  .card:is(.waiting, .asks, .needs):not(.stale) .mic-b.on, .card:is(.waiting, .asks, .needs):not(.stale) .mic-b.on:hover { background: var(--color-on-needs); color: var(--color-needs); }
  .card:is(.waiting, .asks, .needs):not(.stale) :is(.ans .a-b, .mic-b):focus-visible { outline-color: var(--color-on-needs); }
  .content { position: relative; } /* the composer is placed in it */
  /* The composer is the design system's drawer (.pop.anchored.drawer) from under its card,
     which is .lifted while it's out and while it slides back. */
  .dict { --meta: var(--color-text-secondary); cursor: auto; }
  .dict .d-head, .dict .d-row { flex: none; display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; font-size: var(--csm-text-meta); }
  .dict .d-head { height: 20px; }
  .dict .d-row { height: 22px; color: var(--meta); }
  .dict .d-say { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--color-text-primary); font-weight: var(--font-weight-medium); }
  .dict .d-say.note { color: var(--color-text-orange); }
  .dict .d-head > svg.i { flex: none; width: 13px; height: 13px; color: var(--color-text-orange); }
  .dict .d-hint { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .dict .d-words { flex: none; height: calc(var(--csm-lh-body) * 3); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    font-size: var(--csm-text-body); line-height: var(--csm-lh-body); color: var(--color-text-primary); overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
  .dict .d-words .wait { color: var(--meta); }
  /* Older words leave at the top through a short fade, never as half a line. */
  .dict.listening .d-words, .dict.stopping .d-words { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14px); mask-image: linear-gradient(to bottom, transparent, #000 14px); }
  .dict.error .d-words { height: auto; max-height: calc(var(--csm-lh-body) * 7); justify-content: flex-start; overflow-y: auto; }
  .dict .d-edit { flex: none; box-sizing: border-box; width: 100%; height: calc(var(--csm-lh-body) * 4 + 6px); margin: 0; padding: 3px 6px; resize: none; border: 0; border-radius: var(--radius-element);
    background: #00000040; color: var(--color-text-primary); font: inherit; font-size: var(--csm-text-body); line-height: var(--csm-lh-body); user-select: text; -webkit-user-select: text; }
  /* Whole pixels, so the bars and the gaps between them come out even on a 1× screen too. */
  .dict .d-wave { --lvl: 0; flex: none; display: inline-flex; align-items: center; gap: 2px; height: 14px; color: var(--color-text-primary); }
  .dict .d-wave i { width: 2px; height: 14px; border-radius: 1px; background: currentColor; transform: scaleY(var(--h, 0.2)); transition: transform 110ms var(--ease-standard); }
  .dict .d-wave.hush i { animation: d-idle 1600ms var(--ease-standard) infinite; } /* not .quiet: that's the design system's caught-up note */
  .dict .d-wave i:nth-child(2) { animation-delay: 120ms; }
  .dict .d-wave i:nth-child(3) { animation-delay: 240ms; }
  .dict .d-wave i:nth-child(4) { animation-delay: 360ms; }
  .dict .d-wave i:nth-child(5) { animation-delay: 480ms; }
  @keyframes d-idle { 0%, 100% { transform: scaleY(0.2); } 40% { transform: scaleY(0.42); } }
  .dict.stopping .d-wave { --lvl: 0 !important; color: var(--meta); }
  .dict.stopping .d-wave i { --h: 0.2 !important; animation: none; }
  .dict .d-lang { flex: none; padding: 0 4px; border-radius: 3.5px; background: #FFFFFF1A; color: var(--color-text-primary); font-size: 10.5px; line-height: 15px; font-weight: 700; letter-spacing: 0.02em; }
  .dict .d-b { all: unset; flex: none; box-sizing: border-box; height: 22px; padding: 0 9px; display: inline-flex; align-items: center; gap: 4px; border-radius: var(--radius-element);
    font-size: var(--csm-text-meta); font-weight: var(--font-weight-medium); white-space: nowrap; cursor: pointer; transition: background-color var(--duration-fast) var(--ease-standard); }
  .dict .d-b:first-of-type { margin-left: auto; }
  .dict .d-b.pri { background: var(--color-accent); color: var(--color-on-accent); }
  .dict .d-b.pri:hover { background: var(--color-accent-hover); }
  .dict .d-b.sec { background: var(--color-fill-strong); color: var(--color-text-primary); }
  .dict .d-b.sec:hover { background: var(--color-fill-strong-hover); }
  /* Under an amber card its Send turns the card's pair over: amber with black words. */
  html:has(.card:is(.waiting, .asks, .needs):not(.stale) .mic-b.on) .dict .d-b.pri { background: var(--color-needs); color: var(--color-on-needs); font-weight: 600; }
  html:has(.card:is(.waiting, .asks, .needs):not(.stale) .mic-b.on) .dict .d-b.pri:hover { background: var(--color-needs-hover); }
  .dict .d-b[aria-disabled="true"] { opacity: 0.6; cursor: default; }
  /* Under the words while it listens: the closing phrase that sends, or, once you said it
     (the head then says Sending…), a thin bar that fills for the 1.2 s you have to talk on or press Esc. */
  /* The hint (and the cue that replaces it) shares the buttons' line, at its left; where both
     don't fit, it takes the line above them. */
  .dict .d-row:has(.d-tip) { height: auto; min-height: 22px; flex-wrap: wrap; row-gap: 6px; }
  .dict .d-row > .d-tip { flex: 1 0 auto; }
  .dict .d-tip { flex: none; position: relative; box-sizing: border-box; height: 20px; padding-bottom: 5px; display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; font-size: var(--csm-text-meta); color: var(--meta); }
  .dict .d-tip > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .dict .d-tip > .d-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 1px; background: #FFFFFF1A; overflow: hidden; }
  .dict .d-tip > .d-bar::after { content: ""; position: absolute; inset: 0; background: var(--color-text-primary); transform-origin: left center; animation: d-fill 1200ms linear both; }
  @keyframes d-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes d-fill-color { from { background-color: transparent; } to { background-color: var(--color-text-primary); } }
  @media (prefers-reduced-motion: reduce) {
    .dict .d-wave i, .dict .d-wave.hush i { transform: scaleY(0.6); animation: none; transition: background-color 120ms linear;
      background: color-mix(in srgb, currentColor calc(35% + var(--lvl) * 65%), transparent); }
    .dict .d-tip > .d-bar::after { transform: none; animation-name: d-fill-color; }
  }




  /* Three small session cards, as surfaces: working, needs you, done. */
  .art { position: relative; width: 184px; height: 92px; }
  .mini {
    position: absolute; width: 96px; height: 62px; padding: 10px;
    display: flex; flex-direction: column; gap: 7px;
    border-radius: 10px; background: var(--color-background-card); box-shadow: 0 6px 18px #00000059;
  }
  .mini i { width: 8px; height: 8px; border-radius: 50%; }
  .mini b { height: 5px; border-radius: 3px; background: #FFFFFF2E; }
  .mini b + b { width: 60%; background: #FFFFFF14; }
  .mini.m1 { left: 0; top: 22px; }
  .mini.m1 i { background: var(--color-mark-working); }
  .mini.m2 { left: 44px; top: 0; z-index: 1; }
  .mini.m2 i { background: var(--color-warning); }
  .mini.m3 { left: 88px; top: 26px; }
  .mini.m3 i { background: var(--color-success); }
  .badge svg.spin { animation: spin 2.4s linear infinite; }
  .badge.off { color: var(--color-text-red); background: none; }
  .empty-state.loading { animation: enter 320ms 300ms var(--ease-standard) both; } /* no flash on a fast load */


  /* ---------- compact: a narrow window (a laptop on its own) ----------
     Under 640 pt the cards become rows of free height with the same tints: a dot for the
     state, the title and time, the question or what it's doing, then the card's tags as
     one quiet line of facts, and the plan's bar. The week's usage moves to one line
     under the header. The constraint is the width, so rows can grow down. */
  .wstrip { display: none; }
  @media (max-width: 639px) {
    /* In a browser, the page's own view switch keeps its icons and drops its words (they stay as tips). */
    .seg button > span { display: none; }
    .group.active { display: flex; flex-direction: column; }
    .group.active > .wstrip { order: -1; } /* above Active: the usage isn't one of its sessions */
    .meter { display: none; }
    .wstrip:not([hidden]) { --fill: #C4C8CF; --over: var(--fill); --say: var(--color-text-secondary);
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 14px;
      margin: 2px 2px 16px; font-size: var(--csm-text-meta); line-height: var(--csm-lh-meta); color: var(--color-text-secondary); cursor: default; }
    .wstrip.on-pace, .wstrip.plenty { --say: var(--color-text-green); }
    .wstrip.fast { --over: var(--color-text-orange); --say: var(--color-text-orange); }
    .wstrip.hot { --over: var(--color-warning); --say: var(--color-text-orange); }
    .wstrip.limit { --fill: var(--color-error); --over: var(--color-error); --say: var(--color-text-red); }
    .wstrip .ws-fig { font-family: ui-rounded, var(--font-family-body); font-size: 26px; line-height: 28px; font-weight: var(--font-weight-heading); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--color-text-primary); }
    .wstrip .ws-fig small { font-size: 14px; letter-spacing: 0; color: var(--color-text-secondary); margin-left: 1px; }
    /* 9% keeps 74%'s room, so the days don't move as it changes: two tabular digits (about 0.63 em
       each with the tracking) and the small sign, a hair under, so 74% itself is as before. */
    .wstrip .ws-fig { min-width: calc(1.25em + 13.3px); }
    .wstrip .ws-days { display: flex; gap: 3px; min-width: 0; }
    .wstrip .ws-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    .wstrip .ws-days.snap { gap: var(--gap); justify-content: center; }
    .wstrip .ws-days.snap .ws-day { flex: none; width: var(--col); }
    .wstrip .ws-seg { position: relative; display: block; width: 100%; height: 10px; border-radius: 2px; background: #FFFFFF0D; }
    .wstrip .ws-day.past .ws-seg, .wstrip .ws-day.today .ws-seg { background: #FFFFFF1C; }
    .wstrip .ws-seg b, .wstrip .ws-seg i { position: absolute; top: 0; bottom: 0; border-radius: inherit; }
    .wstrip .ws-seg b { left: 0; background: var(--fill); }
    .wstrip .ws-seg i { background: var(--over); }
    .wstrip .ws-seg b.seam { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .wstrip .ws-seg i.seam { border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .wstrip .ws-now { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--color-text-accent); box-shadow: 0 0 0 1.6px var(--color-background-body); z-index: 1; }
    .wstrip .ws-dl { font-size: 10px; line-height: 10px; font-weight: var(--font-weight-medium); color: var(--color-text-secondary); }
    .wstrip .ws-day.today .ws-dl { color: var(--color-text-primary); font-weight: var(--font-weight-heading); }
    .wstrip .ws-say { display: flex; flex-direction: column; align-items: flex-end; line-height: 15px; white-space: nowrap; }
    .wstrip .ws-pace { font-size: var(--csm-text-body); font-weight: var(--font-weight-heading); color: var(--say); }

    .grid { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; gap: 6px; }
    .hrow .tag.name { max-width: 30%; } /* earlier days: the folder gives way to the title */
    .card { --dot: var(--color-text-disabled);
      height: auto; display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; column-gap: 10px; align-items: start; padding: 10px 12px; }
    .card.waiting, .card.asks { --dot: var(--color-text-orange); }
    .card.error { --dot: var(--color-text-red); }
    .card.done { --dot: var(--color-text-green); }
    .group:not(.active) .card.done, .card.stale { --dot: var(--color-text-disabled); }
    /* An old question or error keeps a dimmer dot of its color, as its tag did. */
    .card.stale.asks, .card.stale.waiting { --dot: color-mix(in srgb, var(--color-text-orange) 55%, transparent); }
    .card.stale.error { --dot: color-mix(in srgb, var(--color-text-red) 55%, transparent); }
    .card::before { content: ""; grid-column: 1; grid-row: 1; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--dot); }
    .card > .top { display: contents; }
    .card > .top > .tag { display: none; } /* the state reads in the row's tint and dot, and VoiceOver says it */
    .card > .top > .time { grid-column: 3; grid-row: 1; line-height: 17px; }
    .card > .top > .time > :is(.meta, .msep) { display: none; } /* a row keeps the model to its time's tooltip */
    .card > .title { grid-column: 2; grid-row: 1; margin: 0; font-size: 13px; line-height: 17px; -webkit-line-clamp: 2; }
    .card > .detail { grid-column: 2 / 4; grid-row: 2; margin-top: 2px; font-size: var(--csm-text-body); line-height: var(--csm-lh-body); }
    .card > .tags { grid-column: 2 / 4; grid-row: 3; margin-top: 7px; gap: 14px; padding: 0; white-space: nowrap; }
    .card > .bar { grid-column: 2 / 4; grid-row: 4; margin-top: 9px; padding: 0; }
    .card:has(.bar) .tags { display: flex; }
    /* The tags as one line of facts: icon and text, no boxes; the last one takes what's left. */
    .card .tags .tag, .card .tags .tag.name, .card .tags .tag.rel { background: none; padding: 0; height: auto; flex: none; gap: 5px; min-width: 0; }
    .card .tags .tag:last-child { flex: 0 1 auto; }
    .card .tags .tag.name:not(:last-child) { flex: 0 100 auto; min-width: 40px; overflow: hidden; } /* a long folder gives way first */
    .card .tags .tag > span { overflow: hidden; text-overflow: ellipsis; }
    .card .tags .tag svg { opacity: 0.75; }
    .card .tags .tag[data-show-task]:hover { background: none; }
    /* A question's answers sit under it, in the tags' place: the row grows only then. */
    .card > .ans, .card > .sentline { grid-column: 2 / 4; grid-row: 3; margin-top: 8px; padding: 0; }
  }

  /* ---------- strip: a sliver of the screen (under 300 pt, down to 171) ----------
     Only what a glance needs: how many need you, the week in two lines, and each session
     as its dot, title, time and question. Folders, relations and earlier rows' details go. */
  @media (max-width: 299px) {
    header .name, .link span, .group-head .hint { display: none; }
    #counts .tag:not(.s-waiting) { display: none; } /* only what needs you */
    .wstrip:not([hidden]) { grid-template-columns: auto minmax(0, 1fr); row-gap: 8px; margin-bottom: 14px; }
    .wstrip .ws-days { grid-column: 1 / -1; grid-row: 2; }
    .wstrip .ws-say { grid-column: 2; grid-row: 1; }
    .wstrip .ws-fig { font-size: 22px; line-height: 24px; }
    .card { padding: 9px 10px; column-gap: 8px; }
    .card > .tags, .card:has(.bar) > .tags { display: none; }
    .card > .top > .time { grid-column: 2; grid-row: 2; margin: 2px 0 0; justify-self: start; }
    .card > .title { grid-column: 2 / 4; }
    .card > .detail { grid-column: 2 / 4; grid-row: 3; }
    .card > .bar, .card > .ans, .card > .sentline { grid-row: 4; }
    /* The tags go, and only the mic stays on their line. */
    .card > .tags:has(.mic-b) { display: flex; grid-row: 4; } /* under the detail, not over it */
    .card > .tags:has(.mic-b) > .tag { display: none; }
    .dict .d-lang, .dict .d-hint { display: none; }
    .hrow { grid-template-columns: 16px minmax(0, 1fr); padding: 8px 10px; }
    .hrow > .tag, .hrow .hsnip, .hrow > span:empty { display: none; }
    .hrow .htime { grid-column: 2; grid-row: 2; justify-content: flex-start; }
    header .search { display: none; } /* no room for it in a strip; in the app its own stays in the toolbar */
    header .pinf { padding: 0 5px; margin-left: 0; } /* the pin alone: its count stays in its tip */
    header .pinf + .seg { margin-left: 0; }
    /* Two filters and the view tabs: each a little narrower, so the counts keep their room. */
    header .pinf { padding: 0 3px; }
    header .pinf + .pinf { margin-left: 0; }
    header .seg button { padding: 0 6px; }
    header .spacer { display: none; } /* no room to spare in a strip, and its gap is the counts' */
    header .pinf .n { display: none; }
  }
  /* A count's menu starts on its rows: the count above already says what they are. Its head shows
     only in a tight header, where the count is a bare number. */
  #pop:not(.labeled) .pop-head { display: none; }
</style>
</head>
<body>
<main class="strip" aria-label="Claude sessions">
  <header>
    <span class="lights" aria-hidden="true"></span>
    <span class="name">Sessions</span>
    <span id="counts"></span>
    <span class="spacer"></span>
    <button id="pinf" class="pinf" type="button" aria-pressed="false" title="Show only pinned sessions in Last 7 Days and All Sessions"></button>
    <button id="maf" class="pinf maf" type="button" aria-pressed="false" title="Show only the sessions Claude worked in most over the last 7 days"></button>
    <div class="seg" role="tablist">
      <button type="button" role="tab" data-view="week" aria-selected="true"></button>
      <button type="button" role="tab" data-view="history" aria-selected="false"></button>
      <button type="button" role="tab" data-view="scheduled" aria-selected="false"></button>
    </div>
    <label class="search"><span class="sr"></span><input id="q" type="search" placeholder="Search all sessions" aria-label="Search all sessions"></label>
    <span id="usage" class="usage" hidden></span>
    <span id="link" class="link off" title="Connection to the local server"><i></i><span>Connecting…</span></span>
    <button id="sound" class="icon-btn" type="button" aria-pressed="false"></button>
  </header>
  <div id="pop" class="pop menu" role="group" aria-label="Details"></div>
  <div class="content" id="content" data-scroll-edge="whole">
    <i class="scroll-fade up" aria-hidden="true"></i>
    <div id="banner"></div>
    <section id="week" class="view" aria-label="Last 7 days"></section>
    <section id="history" class="view" aria-label="All sessions" hidden></section>
    <section id="scheduled" class="view" aria-label="Scheduled tasks" hidden></section>
    <i class="scroll-fade down" aria-hidden="true"></i>
  </div>
  <div id="announce" class="sr" aria-live="polite"></div>
</main>

<script src="usage.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const embed = params.has("embed");
  if (embed) document.body.classList.add("embed");
  const bridge = () => window.webkit?.messageHandlers?.strip;

  // ---------------------------------------------------------------- icons
  // Drawn for this app on a 24 px grid, all in the same 1.25 px stroke.
  const svg = (d, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  // The family's icons, from the design system (design-icons.js), as inline SVG strings.
  const ICON = Object.fromEntries(DesignIcons.names.map((n) => [n, DesignIcons.svg(n)]));
  // A question keeps its own icon, but it needs you just like a blocked session does.
  const STATUS_ICON = {
    working: ICON.spinner, waiting: ICON.alert, asks: ICON.question, error: ICON.error,
    done: ICON.check, idle: ICON.moon, ended: ICON.power,
  };
  const LABEL = { working: "Working", waiting: "Needs you", asks: "Needs you", error: "Error", done: "Done", idle: "Idle", ended: "Closed" };
  const TOOLS = {
    Read: ["Reading", "file"], Edit: ["Editing", "pencil"], MultiEdit: ["Editing", "pencil"], Write: ["Writing", "pencil"],
    NotebookEdit: ["Editing", "pencil"], Bash: ["Running", "terminal"], Grep: ["Searching", "search"],
    Glob: ["Finding files", "search"], WebFetch: ["Reading the web", "globe"], WebSearch: ["Searching the web", "globe"],
    Agent: ["Delegating", "bot"], Task: ["Delegating", "bot"], Skill: ["Using skill", "star"],
    TodoWrite: ["Updating todos", "listChecks"], ToolSearch: ["Loading tools", "plug"],
    Compact: ["Compacting context", "compress"], Workflow: ["Starting a workflow", "flow"],
  };
  const MCP = {
    Claude_Browser: ["Using the browser", "browser"], "claude-in-chrome": ["Using Chrome", "browser"],
    "computer-use": ["Controlling the Mac", "browser"], ccd_session: ["Managing sessions", "grid"],
    ccd_session_mgmt: ["Managing sessions", "grid"], visualize: ["Drawing a visual", "star"],
  };

  const $content = document.getElementById("content");
  const $banner = document.getElementById("banner");
  const $week = document.getElementById("week");
  const $history = document.getElementById("history");
  const $scheduled = document.getElementById("scheduled");
  const $counts = document.getElementById("counts");
  const $link = document.getElementById("link");
  const $sound = document.getElementById("sound");
  const $q = document.getElementById("q");

  // Where a list scrolls out of view it fades into its surface instead of a hard line (the
  // design system's .scroll-fade): each end's band shows only while there's more past it.
  const FADES = `<i class="scroll-fade up" aria-hidden="true"></i>`, FADES_END = `<i class="scroll-fade down" aria-hidden="true"></i>`;
  function fades(box) {
    const up = box.querySelector(":scope > .scroll-fade.up"), down = box.querySelector(":scope > .scroll-fade.down");
    if (!up || !down) return;
    up.classList.toggle("on", box.scrollTop > 1);
    down.classList.toggle("on", box.scrollTop + box.clientHeight < box.scrollHeight - 1);
  }
  // The list's top edge (data-scroll-edge="whole"): a card or row going under it is cut at the edge
  // line and fades as it goes, a group head only fades. The design system draws it from each card's
  // own view timeline, in the scroll's own frame. Where that isn't supported, or under Reduce Motion
  // (which stops every animation), this does it: data-edge="up" on what crosses the edge, how much
  // of it is past in --cut and how much it still shows in --sf. Top only.
  const noMotion = matchMedia("(prefers-reduced-motion: reduce)");
  function scrollEdge() {
    const crossing = $content.querySelectorAll("[data-edge]");
    if (CSS.supports("animation-timeline: view()") && !noMotion.matches) {
      for (const e of crossing) { delete e.dataset.edge; e.style.removeProperty("--cut"); e.style.removeProperty("--sf"); }
      return;
    }
    const els = [...$content.querySelectorAll(".card, .hrow, .group-head")];
    const box = $content.getBoundingClientRect();
    const rects = els.map((e) => e.getBoundingClientRect());
    els.forEach((e, i) => {
      const r = rects[i], top = box.top - r.top, bottom = r.bottom - box.bottom, cut = Math.max(0, top, bottom);
      e.style.removeProperty("--cut"); e.style.removeProperty("--sf"); delete e.dataset.edge;
      if (!r.height || cut <= 0 || cut >= r.height || bottom > top) return;
      e.dataset.edge = "up";
      e.style.setProperty("--cut", cut.toFixed(1) + "px");
      e.style.setProperty("--sf", Math.max(0, 1 - cut / r.height / 0.7).toFixed(3));
    });
  }
  $content.addEventListener("scroll", () => { fades($content); scrollEdge(); }, { passive: true });
  noMotion.addEventListener?.("change", scrollEdge);
  if ("ResizeObserver" in window) {
    const sizes = new ResizeObserver(() => { fades($content); scrollEdge(); });
    sizes.observe($content);
    for (const el of $content.children) sizes.observe(el);
  }
  const $announce = document.getElementById("announce");
  document.querySelector('[data-view="week"]').title = "Last 7 Days";
  document.querySelector('[data-view="week"]').innerHTML = `${ICON.grid}<span>Last 7 Days</span>`;
  document.querySelector('[data-view="history"]').title = "All Sessions";
  document.querySelector('[data-view="history"]').innerHTML = `${ICON.history}<span>All Sessions</span>`;
  document.querySelector('[data-view="scheduled"]').title = "Scheduled";
  document.querySelector('[data-view="scheduled"]').innerHTML = `${ICON.calendarClock}<span>Scheduled</span>`;
  document.querySelector(".search .sr").outerHTML = ICON.search;

  let state = { now: Date.now(), needs: 0, sessions: [], tasks: [] };
  let live = new Map(); // sid → session, for what is in the last 7 days
  let ready = false; // the first update has arrived
  let link = "connecting"; // connecting, live or offline
  let skew = 0;
  let view = "week";
  let query = "";
  const seen = new Map(); // sid → what we last alerted on

  const DAY = 864e5;
  const FRESH_MS = 60_000; // what needs you breathes for this long, then holds still
  const now = () => Date.now() + skew;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const base = (p) => (typeof p === "string" && p.startsWith("/") ? p.split("/").filter(Boolean).pop() : p);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const tag = (inner, cls = "", title = "") => `<span class="tag ${cls}"${title ? ` title="${esc(title)}"` : ""}>${inner}</span>`;
  const kTokens = (n) => (n >= 999_500 ? `${(n / 1e6).toFixed(1).replace(/\.0$/, "")}M` : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n));
  const dayStart = (back = 0) => { const d = new Date(now()); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - back); return d.getTime(); };
  const scratch = document.createElement("div");
  // Text for VoiceOver: two lines of a card read as two sentences, not one run-on word.
  const plain = (html) => {
    scratch.innerHTML = html.replace(/<\/div>(?=<div class="line">)/g, ". </div>");
    return scratch.textContent.replace(/\s+/g, " ").trim();
  };

  function describe(tool) {
    if (TOOLS[tool]) return TOOLS[tool];
    if (tool?.startsWith("mcp__")) {
      const server = tool.split("__")[1] || "";
      return MCP[server] || [`Using ${/^[0-9a-f-]{20,}$/.test(server) ? "a connector" : server}`, "plug"];
    }
    return [`Using ${tool}`, "plug"];
  }

  // What a session (or one of its agents) is doing: the tool's icon, then its target.
  function action(tool, detail) {
    if (!tool) return "";
    const [verb, icon] = describe(tool);
    const d = base(detail);
    return `<span title="${esc(verb)}">${ICON[icon]}</span><span class="txt">${d ? `<b>${esc(d)}</b>` : esc(verb)}</span>`;
  }

  // One way to write time everywhere: "now", "6m ago", "6h ago", "yesterday", "3d ago",
  // and spans as "45m" or "1h 5m".
  function ago(t) {
    const s = Math.max(0, Math.round((now() - t) / 1000));
    if (s < 45) return "now";
    const m = Math.round(s / 60);
    if (m < 60) return `${m}m ago`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.round(h / 24);
    return d === 1 ? "yesterday" : `${d}d ago`;
  }
  function span(t) {
    const m = Math.max(0, Math.round((now() - t) / 60000));
    return m < 1 ? "<1m" : m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
  }
  const clock = (t) => new Date(t).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  function dayLabel(t) {
    if (t >= dayStart(0)) return "Today";
    if (t >= dayStart(1)) return "Yesterday";
    const d = new Date(t);
    if (t >= dayStart(6)) return d.toLocaleDateString("en-US", { weekday: "long" });
    const sameYear = d.getFullYear() === new Date(now()).getFullYear();
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", ...(sameYear ? {} : { year: "numeric" }) });
  }

  // The one rule for "needs you" is the server's, so the window, the Dock badge and the
  // menu bar always agree: blocked on you, or a question or an error from the last day.
  // Every session, History row and task it sends says whether it needs you.
  const needsYou = (s) => s.needsYou === true;
  const isFresh = (s) => (s.status === "waiting" || s.status === "asks" || s.status === "error") && needsYou(s) && now() - (s.since || s.last) < FRESH_MS;

  // The server calls a workflow it can't name "Workflow"; that name says nothing.
  const wfNamed = (wf) => Boolean(wf?.name) && wf.name !== "Workflow";
  // An answer you sent from its card, waiting its 5 s or on its way: the session is about
  // to work on it, so the card shows it working, not an old question.
  const answerSent = (s) => s.kind !== "task" && (s.status === "asks" || s.status === "done" || s.status === "error") && (s.reply?.state === "pending" || s.reply?.state === "sent");
  // A permission the session waits on that its mod holds (the plugin): what it asks, with
  // Allow and Deny on its card. Once you click one it's on its way, as a sent answer is.
  // The window's key (src/keys.ts): answering a session and allowing or denying a permission need
  // it. The app gives it to its page (window.csm.setKey) once its own server answers, and a new
  // one each time that server starts; a test can put it in window.__csmKey. A page in a browser
  // has none, so it only looks: its answer buttons open the session, and a permission shows as
  // a plain wait.
  let KEY = (() => { try { return typeof window.__csmKey === "string" ? window.__csmKey : ""; } catch { return ""; } })();
  const actHeaders = () => ({ "x-csm": "1", "x-csm-key": KEY, "content-type": "application/json" });
  const permitOf = (s) => (s.kind !== "task" && s.status === "waiting" && s.permit) || null;
  const permitOut = (s) => permitOf(s)?.state === "sending" || permitOf(s)?.state === "sent";
  const sentOf = (s) => answerSent(s) || permitOut(s);
  const isStale = (s) => (s.status === "asks" || s.status === "error") && !needsYou(s) && !sentOf(s);
  // Its own turn is over and something it started goes on: agents, or only a shell command.
  const onlyCommands = (s) => s.background && !s.agentCount && !s.workflows?.length && s.commandCount > 0;
  const label = (s) => (s.kind === "task" ? "Can't run" : sentOf(s) ? "Working" : onlyCommands(s) ? "In the background" : s.background ? "Agents working" : s.status === "asks" && isStale(s) ? "Asked you" : LABEL[s.status] || "Closed");

  // A scheduled task the Claude app tried to start and couldn't. It needs you like an error
  // does, so it also gets a card in Active, next to what else needs you.
  function blockedWhy(b) {
    if (b.reason === "per_task_limit") {
      if (!b.run) return "a run of it is still open";
      const from = `the run from ${when(b.run.at)}`;
      if (b.queued) return `it starts once ${from} ends`;
      return b.run.status === "working" ? `${from} has had no activity since ${when(b.run.last)}`
        : b.run.status === "waiting" || b.run.status === "asks" ? `${from} is waiting for you` : `${from} is still open`;
    }
    return b.reason ? `the Claude app skipped it (${b.reason.replace(/_/g, " ")})` : "the Claude app skipped it";
  }
  const blockedText = (b) => `Didn't run ${when(b.since)}: ${blockedWhy(b)}`;
  const blockedHint = (b) => (b.reason === "per_task_limit" && b.run ? "It runs once that one is closed." : "The Claude app keeps trying every minute.");
  function blockedCards(st = state) {
    return (st.tasks || []).filter((t) => t.needsYou && t.blocked).map((t) => ({
      sid: `task:${t.id}`, kind: "task", task: t.id, taskName: t.name, title: t.name,
      project: t.project, cwd: t.cwd, file: t.file, status: "error", needsYou: true,
      since: t.blocked.since, first: t.blocked.since, last: t.blocked.since,
      error: blockedText(t.blocked), blocked: t.blocked, open: t.blocked.run?.sid,
      agents: [], agentCount: 0, workflows: [], plan: null, reminder: null, made: [],
    }));
  }
  // The sessions with the blocked tasks among what needs you, after the sessions waiting on you.
  function withBlocked(list, st = state) {
    const extra = blockedCards(st);
    if (!extra.length) return list;
    // A card whose answer you just sent keeps its place, so nothing moves under the pointer.
    const at = list.findIndex((s) => (!needsYou(s) && !sentOf(s)) || s.status === "error");
    return at < 0 ? [...list, ...extra] : [...list.slice(0, at), ...extra, ...list.slice(at)];
  }
  const statusIcon = (s) => (s.background ? ICON.bot : STATUS_ICON[s.status] || ICON.check);
  // On a card: a beating dot while it needs you, three calm dots while it works.
  const PDOT = '<span class="pdot" aria-hidden="true"></span>';
  const CALM = '<span class="calm" aria-hidden="true"><i></i><i></i><i></i></span>';
  const cardIcon = (s) => ((s.status === "waiting" || s.status === "asks") && needsYou(s) ? PDOT
    : (s.status === "working" && !s.background) || sentOf(s) ? CALM : statusIcon(s));
  // How long it has been waiting on you or working: "2m", "1h 5m". Minutes, so it changes
  // once a minute, not every second.
  const spanWords = (s) => `${s.status === "working" ? "working" : "waiting for you"} for ${span2(s.since || s.last).replace(/h/, " hours").replace(/(\d+)m/, "$1 minutes")}`;
  function span2(t) {
    const m = Math.max(1, Math.floor((now() - t) / 60_000));
    return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}m` : ""}`;
  }
  const busiest = (s) => [...(s.agents || [])].sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0))[0];
  const agentLine = (a) => {
    const d = base(a.detail);
    return `${ICON.bot}<span class="txt"><span class="sub">${esc(a.label || "Agent")} ·</span> ${a.tool ? `<b>${esc(d || describe(a.tool)[0])}</b>` : "Thinking…"}</span>`;
  };

  // Two fixed lines under the title: what is happening, and its context.
  function detail(s) {
    const wrap = (html) => `<div class="wrap">${html}</div>`;
    const lines = (a, b) => `<div class="line">${a}</div>${b ? `<div class="line">${b}</div>` : ""}`;
    const plan = s.plan?.current
      ? `${ICON.listChecks}<span class="txt"><span class="sub">Step ${s.plan.index} of ${s.plan.total} ·</span> <span class="cur">${esc(s.plan.current)}</span></span>` : "";
    const agent = busiest(s);

    if (s.kind === "task") {
      const why = blockedWhy(s.blocked);
      return wrap(`<b>${esc(`Didn't run ${when(s.blocked.since)}.`)}</b> ${esc(why[0].toUpperCase() + why.slice(1))}.`);
    }
    if (answerSent(s)) return wrap(`<b>You answered “${esc(s.reply.text)}”</b>`);
    if (permitOf(s)?.what) {
      // The wait, or what you decided, then what it asks for: one line each.
      const p = s.permit;
      const [verb, icon] = describe(p.tool);
      const head = permitOut(s) ? `<b>${p.allow ? "You allowed it" : "You denied it"}</b>` : esc(s.wait || "Wants permission");
      return `<div class="line"><span class="txt">${head}</span></div><div class="line" data-what title="${esc(p.what)}"><span title="${esc(verb)}">${ICON[icon] || ICON.plug}</span><span class="txt">${esc(p.what)}</span></div>`;
    }
    if (permitOut(s)) return wrap(`<b>${s.permit.allow ? "You allowed it" : "You denied it"}</b>`);
    if (s.status === "waiting") return wrap(esc(s.wait || "Waiting for your answer"));
    if (s.status === "asks") return wrap(`<b>${esc(s.ask || "It asked you something")}</b>`);
    if (s.status === "error") return wrap(esc(s.error || "The turn ended with an error"));
    if (onlyCommands(s)) {
      // The newest command, by its description; Claude Code wakes the session when it ends.
      const c = [...s.commands].sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0))[0];
      const head = `<span title="Running in the background">${ICON.terminal}</span><span class="txt">${c?.detail ? `<b>${esc(c.detail)}</b>` : "A command"}</span>`;
      const more = `${ICON.clock}<span class="txt">${s.commandCount > 1 ? `${s.commandCount} commands` : "Running"} in the background${c?.startedAt ? ` · ${span2(c.startedAt)}` : ""}</span>`;
      return lines(head, plan || more);
    }
    if (s.background) {
      const wf = s.workflows?.[0];
      const head = wf
        ? `${ICON.flow}<span class="txt">${wfNamed(wf) ? `Workflow <b>${esc(wf.name)}</b>` : "A workflow"}${wf.phase ? ` · ${esc(wf.phase)}` : ""}</span>`
        : `${ICON.agents}<span class="txt">${plural(s.agentCount, "agent", "agents")} in the background</span>`;
      return lines(head, agent ? agentLine(agent) : "");
    }
    if (s.status === "working") {
      return lines(action(s.tool, s.detail) || `${ICON.bulb}<span class="txt">Thinking…</span>`, plan || (agent ? agentLine(agent) : ""));
    }
    if (s.note) return wrap(esc(s.note));
    if (s.recap) return wrap(esc(s.recap));
    if (s.status === "done") return wrap(`Finished at ${clock(s.last)}`);
    if (s.status === "idle") return wrap("Open, waiting for a message");
    if (s.status === "ended") return wrap(`Closed at ${clock(s.since || s.last)}`);
    return "";
  }

  // When its workflow or its first agent started, for "agents · 12m".
  const agentsSince = (s) => s.workflows?.[0]?.startedAt ?? Math.min(...(s.agents || []).map((a) => a.startedAt || Date.now()));

  function tags(s) {
    const out = [];
    const mic = micHtml(s);
    if (s.project) out.push(tag(`${ICON.folder}<span>${esc(s.project)}</span>`, "name", s.project));
    // Relatives: where it came from, or how many side sessions it started. The name gives
    // way first when the footer is full, down to the icon; hovering the card outlines the
    // other one, and a click opens it.
    if (s.from) out.push(`<span class="tag rel ctl" data-open-sid="${esc(s.from.sid)}" title="${esc(relTip(s, "from"))}">${ICON.branch}<span>From ${esc(s.from.title)}</span></span>`);
    if (s.sides) out.push(`<span class="tag rel ctl" data-open-sid="${esc(s.sides[0].sid)}" title="${esc(relTip(s, "sides"))}">${ICON.branch}<span>${s.sides.length === 1 ? "1 side session" : `${s.sides.length} side sessions`}</span></span>`);
    const wf = s.workflows?.[0];
    if (wf || s.agentCount) {
      const tokens = wf?.tokens || (s.agents || []).reduce((n, a) => n + (a.tokens || 0), 0);
      const since = agentsSince(s);
      const bits = [
        s.agentCount ? plural(s.agentCount, "agent", "agents") : "",
        wf && !s.background && wfNamed(wf) ? wf.name : "",
        since ? span(since) : "",
