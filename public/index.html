    const $s = document.querySelector("#week .wstrip");
    if ($s) {
      const shtml = `<span class="ws-fig"><span class="ws-n">${pct}</span><small>%</small></span><span class="ws-days" aria-hidden="true">${strip.join("")}</span><span class="ws-say">${p.say ? `<span class="ws-pace">${p.say}</span>` : ""}${fc ? `<span class="ws-out">Out ${outWords(fc.at)}</span>` : w.resets ? `<span>Resets ${resetWords(w.resets)}</span>` : ""}</span>`;
      $s.hidden = false;
      $s.className = `wstrip ${p.key}`;
      $s.setAttribute("aria-valuenow", String(pct));
      $s.setAttribute("aria-label", $m.getAttribute("aria-label"));
      if ($s._html !== shtml) { $s.innerHTML = shtml; $s._html = shtml; }
      usageHover($s);
    }
    // A size change, or showing the tile again, lays the days out anew.
    if (!$m._sizes && "ResizeObserver" in window) {
      $m._sizes = new ResizeObserver(() => snapWeek());
      $m._sizes.observe($m);
      if ($s) $m._sizes.observe($s);
    }
    snapWeek();
    if ($m._landing) { landWeek($m._landing); $m._landing = null; }
    else if (rolled && still) for (const el of document.querySelectorAll("#week :is(.m-week, .m-pct, .ws-days, .ws-fig)")) el.animate([{ opacity: 0.35 }, { opacity: 1 }], { duration: 240, easing: "linear" });
    if (ucardFor) showUsageCard(ucardFor); // open: it follows the new numbers
    renderUsage();
  }

  // The week's days, the gaps between them and the blue line, in whole screen pixels. At 125%
  // a 2 px gap is 2.5 screen pixels, which the screen rounds to 2 or 3 depending on where it
  // falls, and the days look uneven. The app says how many screen pixels a page pixel is (its
  // zoom isn't in devicePixelRatio); in a browser, devicePixelRatio has it.
  function snapWeek() {
    const k = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--csm-scale")) || devicePixelRatio || 1;
    const dev = (n) => Math.max(1, Math.round(n * k)); // a length, in whole screen pixels
    // Seven days and six gaps across the box's length; what's left over splits at both ends.
    const lay = ($box, length, gap, size) => {
      if (!$box || !$box.offsetParent) return 0;
      const g = dev(gap);
      const day = Math.floor((Math.floor(length($box.getBoundingClientRect()) * k) - 6 * g) / 7);
      if (day < 1) return 0;
      $box.style.setProperty("--gap", `${g / k}px`);
      $box.style.setProperty(size, `${day / k}px`);
      $box.classList.add("snap");
      return day;
    };
    // The blue line, centered on its spot in today's day, with its contour.
    const place = (el, day, side) => {
      if (!el || !day) return;
      const t = dev(2);
      const start = Math.round((day * Number(el.dataset.at)) / 100 - t / 2);
      const across = side === "bottom" ? "height" : "width";
      el.style.setProperty(side, `${start / k}px`);
      el.style.setProperty(across, `${t / k}px`);
      el.style.setProperty(side === "bottom" ? "margin-bottom" : "margin-left", "0");
      el.style.boxShadow = `0 0 0 ${dev(1.6) / k}px var(--color-background-body)`;
    };
    const $w = document.querySelector("#week .meter .m-week");
    place($w?.querySelector(".m-now"), lay($w, (r) => r.height, 2, "--row"), "bottom");
    const $d = document.querySelector("#week .wstrip .ws-days");
    place($d?.querySelector(".ws-now"), lay($d, (r) => r.width, 3, "--col"), "left");
  }

  function renderUsage() {
    const u = state.usage;
    // The tile in Active says it better; the header carries it only when the tile is off screen.
    const onScreen = (el) => el && !el.hidden && el.offsetParent !== null;
    const tileShown = view === "week" && (onScreen(document.querySelector("#week .meter")) || onScreen(document.querySelector("#week .wstrip")));
    if (!u || tileShown) { $usage.hidden = true; $usage._html = ""; return; }
    // The week leads; without it, the 5-hour window stands in.
    const [name, w] = u.week ? ["This week", u.week] : ["Last 5 hours", u.five];
    const pct = Math.floor(w.pct);
    const html = `<span class="u-lbl">${name}</span><span class="u-bar" role="meter" aria-label="${name}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i></i></span><span class="u-pct">${pct}%</span>${u.week && forecast(u.week) ? `<span class="u-reset">· runs out ${outWords(forecast(u.week).at)}</span>` : w.resets ? `<span class="u-reset">· resets ${resetWords(w.resets)}</span>` : ""}`;
    $usage.hidden = false;
    $usage.classList.toggle("high", u.week ? ["hot", "limit"].includes(pace(u.week).key) : w.pct >= USAGE_HIGH);
    if ($usage._html !== html) {
      $usage.innerHTML = html;
      $usage._html = html;
      requestAnimationFrame(() => { const bar = $usage.querySelector(".u-bar i"); if (bar) bar.style.width = `${Math.min(100, w.pct)}%`; });
      requestAnimationFrame(fitCounts);
    }
  }
  addEventListener("resize", () => requestAnimationFrame(renderUsage));

  // The usage tile sticks at the very place it starts, under Active's heading, so it doesn't
  // move at all while the cards scroll by.
  function pinMeter() {
    const m = document.querySelector(".abody > .meter");
    if (!m || m.hidden) return;
    const top = Math.round(m.parentElement.getBoundingClientRect().top - $content.getBoundingClientRect().top + $content.scrollTop);
    if (m.style.top !== `${top}px`) m.style.top = `${top}px`;
  }
  addEventListener("resize", () => requestAnimationFrame(pinMeter));
  usageHover($usage);

  // The header's counts, which the app also shows on its Dock icon and in the menu bar.
  const headCounts = (st) => ({
    needs: st.needs ?? st.sessions.filter(needsYou).length,
    working: st.sessions.filter((s) => s.status === "working").length,
  });

  function renderHeader() {
    renderUsage();
    const list = state.sessions;
    const { needs, working } = headCounts(state);
    const agents = list.reduce((k, s) => k + (s.agentCount || 0), 0);
    // Each count is a menu button: a click shows what's behind it.
    // The number and its words are apart, so a tight header can keep just the number.
    const count = (kind, icon, n, words, cls) =>
      `<span class="tag ${cls}" data-pop="${kind}" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false" aria-label="${n} ${words}">${icon}<span>${n}<span class="word"> ${words}</span></span>${ICON.chev}</span>`;
    const counts = [
      needs ? count("needs", PDOT, needs, needs === 1 ? "needs you" : "need you", "s-waiting") : "",
      working ? count("working", '<span class="sdot" aria-hidden="true"></span>', working, "working", "low working") : "", // neutral and still: only what needs you moves
      agents ? count("agents", ICON.agents, agents, agents === 1 ? "agent" : "agents", "low") : "",
      list.length ? count("week", "", list.length, "in 7 days", "low") : "",
    ].join("");
    if ($counts._html !== counts) {
      $counts.innerHTML = counts;
      $counts._html = counts;
      syncIcons($counts);
      fitCounts();
      requestAnimationFrame(reportChrome);
      // The counts were redrawn: keep an open card on its count, or close it if that count is gone.
      if (popKind) {
        const anchor = $counts.querySelector(`[data-pop="${popKind}"]`);
        if (anchor) { popAnchor = anchor; anchor.setAttribute("aria-expanded", "true"); placePop(); } else hidePop();
      }
    }
    if (popKind) fillPop();
  }

  // ---------------------------------------------------------------- count details

  const $pop = document.getElementById("pop");
  let popKind = null; // which count's card is open
  let popAnchor = null;
  const POP_MAX = 8;
  $pop.addEventListener("scroll", () => fades($pop), { passive: true });

  const openSession = (sid) => fetch(`/api/open/${encodeURIComponent(sid)}`, { method: "POST", headers: { "x-csm": "1" } });
  const still = (icon) => icon.replace(/ (spin|pulse|bot)"/, '"');

  function popRow(s, text, meta) {
    return `<button type="button" class="prow s-${s.status}" data-sid="${esc(s.sid)}" title="Show its card">
      <span class="pi">${cardIcon(s)}</span><span class="pt">${esc(s.title)}</span><span class="pm">${esc(meta)}</span>
      <span class="ps">${esc(text)}</span></button>`;
  }
  const popHead = (icon, text) => `<div class="pop-head">${still(icon)}<span>${esc(text)}</span></div>`;
  const popMore = (n) => (n > 0 ? `<div class="pop-more">and ${n} more</div>` : "");
  const popAll = (kind, n) => (n > 1 ? `<div class="pop-foot"><button type="button" class="prow" data-all="${kind}"><span class="pi">${ICON.arrowDown}</span><span class="pt">Show these ${n} cards</span></button></div>` : "");

  function doing(s) {
    if (s.background) {
      const wf = s.workflows?.[0];
      if (onlyCommands(s)) return s.commands?.[0]?.detail || `${plural(s.commandCount, "command", "commands")} in the background`;
      return wf ? `${wfNamed(wf) ? `Workflow ${wf.name}` : "A workflow"}${wf.phase ? ` · ${wf.phase}` : ""}` : `${plural(s.agentCount, "agent", "agents")} in the background`;
    }
    return s.tool ? act(s.tool, s.detail) : "Thinking…";
  }
  // "Reading orders.sql", or a command's own description as it is ("Run the checkout tests").
  function act(tool, detail) {
    const target = base(detail);
    if (!target) return describe(tool)[0];
    return /\s/.test(target) ? target : `${describe(tool)[0]} ${target}`;
  }

  function popHtml(kind) {
    const list = state.sessions;
    if (kind === "needs") {
      const items = withBlocked(list).filter(needsYou);
      const what = (s) => (s.status === "waiting" ? s.wait || "Waiting for your answer" : s.status === "asks" ? s.ask || "It asked you something" : s.error || "The turn ended with an error");
      return popHead(PDOT, items.length === 1 ? "1 needs you" : `${items.length} need you`) +
        items.slice(0, POP_MAX).map((s) => popRow(s, what(s), s.kind === "task" || s.status === "error" ? ago(s.since) : span2(s.since || s.last))).join("") + popMore(items.length - POP_MAX) + popAll("needs", items.length);
    }
    if (kind === "working") {
      const items = list.filter((s) => s.status === "working");
      return popHead(CALM, `${items.length} working`) +
        items.slice(0, POP_MAX).map((s) => popRow(s, doing(s), s.plan?.current && !s.background ? `Step ${s.plan.index} of ${s.plan.total}` : ago(s.last))).join("") +
        popMore(items.length - POP_MAX) + popAll("working", items.length);
    }
    if (kind === "agents") {
      const total = list.reduce((k, s) => k + (s.agentCount || 0), 0);
      const pairs = list.flatMap((s) => (s.agents || []).map((a) => ({ s, a })));
      const rows = pairs.slice(0, POP_MAX).map(({ s, a }) => {
        const doing = a.tool ? act(a.tool, a.detail) : "Thinking…";
        return `<button type="button" class="prow s-working" data-sid="${esc(s.sid)}" title="Show the card of ${esc(s.title)}">
          <span class="pi">${ICON.bot}</span><span class="pt">${esc(a.label || "Agent")}</span><span class="pm">${a.tokens ? `${kTokens(a.tokens)} tokens` : ""}</span>
          <span class="ps">${esc(s.title)} · ${esc(doing)}</span></button>`;
      }).join("");
      return popHead(ICON.agents, plural(total, "agent", "agents")) + rows + popMore(total - Math.min(pairs.length, POP_MAX)) + popAll("agents", list.filter((s) => (s.agentCount || 0) > 0).length);
    }
    // In the last 7 days: how many in each state, most urgent first.
    const order = ["Needs you", "Error", "Asked you", "Working", "Agents working", "In the background", "Done", "Idle", "Closed"];
    const color = { "Needs you": "var(--color-needs)", Error: "var(--color-error)", "Asked you": "var(--color-warning-muted)",
      Working: "var(--color-mark-working)", "Agents working": "var(--color-text-working)", "In the background": "var(--color-text-working)", Done: "var(--color-success)" };
    const by = new Map();
    for (const s of list) by.set(label(s), (by.get(label(s)) || 0) + 1);
    const rows = order.filter((l) => by.get(l)).map((l) => `<button type="button" class="prow count" data-state="${l}" title="Show these cards">
        <span class="pi"><i class="pop-dot" style="${color[l] ? `background:${color[l]}` : ""}"></i></span><span class="pt">${l}</span><span class="pm">${by.get(l)}</span></button>`).join("");
    const runs = list.filter((s) => s.task).length;
    return popHead(ICON.calendar, `${plural(list.length, "session", "sessions")} in the last 7 days`) + rows +
      (runs ? `<div class="pop-note">${runs === 1 ? "1 is a run" : `${runs} are runs`} of a scheduled task.</div>` : "") +
      `<div class="pop-foot"><button type="button" class="prow" data-go="history"><span class="pi">${ICON.history}</span><span class="pt">Show All Sessions</span></button></div>`;
  }

  function fillPop() {
    const html = popHtml(popKind);
    if ($pop._html !== html) { $pop.innerHTML = FADES + html + FADES_END; $pop._html = html; syncIcons($pop); } // its marks in step with the cards'
    fades($pop);
  }

  // Under its count, kept inside the window.
  function placePop() {
    if (!popAnchor) return;
    const r = popAnchor.getBoundingClientRect();
    const w = $pop.offsetWidth;
    const left = Math.round(Math.max(8, Math.min(r.left, innerWidth - w - 8))); // whole pixels: its marks stay sharp
    $pop.style.left = `${left}px`;
    $pop.style.top = `${Math.round(r.bottom + 6)}px`;
    $pop.style.setProperty("--ox", `${Math.round(r.left + r.width / 2 - left)}px`); // it grows out of its count
    $pop.style.maxHeight = `${Math.max(120, Math.min(420, innerHeight - r.bottom - 6 - 8))}px`;
    fades($pop); // its height changed: the fades follow
  }

  let popKeys = false; // opened from the keyboard: no motion
  let popEnterTimer;
  function showPop(anchor) {
    if (dict) return; // one popover at a time: a composer you're dictating in stays
    const fresh = !$pop.classList.contains("open");
    if (popAnchor && popAnchor !== anchor) popAnchor.setAttribute("aria-expanded", "false");
    popKind = anchor.dataset.pop;
    popAnchor = anchor;
    anchor.setAttribute("aria-expanded", "true");
    fillPop();
    placePop();
    if (fresh && popKeys) {
      $pop.classList.add("instant");
      requestAnimationFrame(() => requestAnimationFrame(() => $pop.classList.remove("instant")));
    } else if (fresh) {
      [...$pop.querySelectorAll(".prow")].forEach((r, i) => r.style.setProperty("--i", String(Math.min(i, 5))));
      $pop.classList.add("enter");
      clearTimeout(popEnterTimer);
      popEnterTimer = setTimeout(() => $pop.classList.remove("enter"), 600);
    }
    popKeys = false;
    const word = anchor.querySelector(".word"); // a head only where the count is a bare number
    $pop.classList.toggle("labeled", !word || getComputedStyle(word).display === "none");
    $pop.classList.add("open");
    reportChrome();
  }

  function hidePop() {
    popAnchor?.setAttribute("aria-expanded", "false");
    popKind = null;
    popAnchor = null;
    $pop.classList.remove("open");
    reportChrome();
  }

  // Each count is a menu, as in a menu bar: a click opens it and closes it, and while one is
  // open, pointing at the next count opens that one at once. A click outside or Escape closes it.
  const toCountOrPop = (el) => el && ($pop.contains(el) || el.closest?.("#counts [data-pop]"));
  $counts.addEventListener("pointerover", (e) => {
    const t = e.target.closest("[data-pop]");
    if (!t || popAnchor === t || !popKind) return;
    showPop(t);
  });
  // A menu's first row (or a row of its own) goes to those cards: back to Last 7 Days if
  // needed, up (or down) to the first of them, and a ring on each for a moment.
  const FOR_COUNT = {
    needs: (s) => needsYou(s),
    working: (s) => s.status === "working",
    agents: (s) => (s.agentCount || 0) > 0,
    week: () => true,
  };
  let foundTimer;
  function goToCards(match, ring = true) {
    hidePop();
    if (view !== "week") setView("week");
    const sids = new Set(withBlocked(state.sessions).filter(match).map((s) => s.sid));
    const els = [...$week.querySelectorAll(".card, .hrow")].filter((el) => sids.has(el.dataset.sid));
    if (!els.length) return;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    els[0].scrollIntoView({ block: "nearest", behavior: still ? "auto" : "smooth" });
    els[0].focus({ preventScroll: true });
    clearTimeout(foundTimer);
    $week.querySelectorAll(".found").forEach((el) => el.classList.remove("found"));
    if (!ring) return;
    els.forEach((el) => el.classList.add("found"));
    foundTimer = setTimeout(() => els.forEach((el) => el.classList.remove("found")), 1600);
  }
  // A scheduled task a session set up: switch to Scheduled and ring its card.
  function showTask(id) {
    hidePop();
    setView("scheduled");
    const el = taskCards.get(id);
    if (!el?.isConnected) return;
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ block: "nearest", behavior: still ? "auto" : "smooth" });
    el.focus({ preventScroll: true });
    clearTimeout(foundTimer);
    el.classList.add("found");
    foundTimer = setTimeout(() => el.classList.remove("found"), 1600);
  }
  function goToCount(kind) {
    if (kind !== "week") return goToCards(FOR_COUNT[kind] || (() => false));
    hidePop();
    if (view !== "week") setView("week");
    $content.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  $counts.addEventListener("click", (e) => { const t = e.target.closest("[data-pop]"); if (!t) return; if (popAnchor === t) hidePop(); else showPop(t); });
  document.addEventListener("pointerdown", (e) => { if (popKind && !toCountOrPop(e.target)) hidePop(); });
  $counts.addEventListener("keydown", (e) => {
    const t = e.target.closest("[data-pop]");
    if (!t) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      if (popAnchor === t) return hidePop(); // the same as a click
      popKeys = true;
      showPop(t);
      $pop.querySelector(".prow[data-all], .prow[data-sid], .prow[data-state], .prow[data-go]")?.focus();
    } else if (e.key === "ArrowDown") {
      // Down arrow steps into the card's rows; up and down move between them.
      e.preventDefault();
      if (popAnchor !== t) { popKeys = true; showPop(t); }
      $pop.querySelector(".prow[data-all], .prow[data-sid], .prow[data-state], .prow[data-go]")?.focus();
    }
  });
  $pop.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const rows = [...$pop.querySelectorAll(".prow[data-all], .prow[data-sid], .prow[data-state], .prow[data-go]")];
    const i = rows.indexOf(document.activeElement);
    if (e.key === "ArrowUp" && i <= 0) return popAnchor?.focus();
    rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))]?.focus();
  });
  document.addEventListener("focusin", (e) => { if (popKind && !toCountOrPop(e.target)) hidePop(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !popKind) return;
    const back = popAnchor;
    hidePop();
    if (back && document.activeElement !== back) back.focus({ preventScroll: true });
  });
  addEventListener("resize", () => { if (popKind) placePop(); placeDict(true); });
  $pop.addEventListener("click", (e) => {
    const all = e.target.closest("[data-all]");
    if (all) return goToCount(all.dataset.all);
    const go = e.target.closest("[data-go]");
    if (go) { hidePop(); return setView(go.dataset.go); }
    // A row goes to its card (or a state to its cards); the card itself opens the session.
    const item = e.target.closest("[data-sid]");
    if (item) return goToCards((s) => s.sid === item.dataset.sid);
    const st = e.target.closest("[data-state]");
    if (st) goToCards((s) => label(s) === st.dataset.state);
  });

  // The app says when a newer version is out. "Later" hides it until the next version.
  let update = null;
  let dismissed = "";
  try { dismissed = localStorage.getItem("csm-update-dismissed") || ""; } catch {}
  window.csm.updateAvailable = (v) => { update = v; renderBanner(); };

  function renderBanner() {
    const offline = ready && link === "offline"
      ? `<div class="banner" role="status">${ICON.unplug}<span><b>Can't reach the monitor.</b> Showing what it last sent while it tries again.</span></div>`
      : "";
    const newer = update && update !== dismissed
      ? `<div class="banner update" role="status">${ICON.arrowDown}<span><b>Version ${esc(update)} is available.</b> Download it, quit this one, and put the new one in Applications in its place.</span>
          <button class="btn" type="button" data-update>Download</button>
          <button class="x" type="button" data-later aria-label="Later" title="Later">${ICON.close}</button></div>`
      : "";
    const html = offline + newer;
    if ($banner.innerHTML !== html) $banner.innerHTML = html;
  }
  $banner.addEventListener("click", (e) => {
    if (e.target.closest("[data-update]")) bridge()?.postMessage({ update: true });
    if (e.target.closest("[data-later]")) {
      dismissed = update;
      try { localStorage.setItem("csm-update-dismissed", update); } catch {}
      renderBanner();
    }
  });

  let freshTimer;
  // While the window is hidden (closed with the red button, minimized, or covered), the page
  // keeps every update but draws nothing; it draws once when it's shown again, with things
  // already in place, as they would have been.
  let behind = false;
  let catchingUp = false;
  // Active's window, picked in its header and kept for next time.
  document.addEventListener("pointerdown", (e) => { if (e.target.id === "active-hours") e.target.dataset.clicked = ""; });
  document.addEventListener("focusout", (e) => { if (e.target.id === "active-hours") delete e.target.dataset.clicked; });
  document.addEventListener("change", (e) => {
    if (e.target.id !== "active-hours") return;
    activeHours = Number(e.target.value);
    const words = e.target.parentElement.querySelector(".pick-text");
    if (words) words.textContent = `last ${activeHours} hours`;
    try { localStorage.setItem("csm-active-hours", String(activeHours)); } catch {}
    render();
  });

  function render() {
    if (document.hidden) { behind = true; return; }
    behind = false;
    checkDict();
    renderHeader();
    renderBanner();
    renderWeek();
    pinMeter();
    syncMic();
    placeDict();
    chaseDict();
    if (view === "history") refreshHistory();
    if (view === "scheduled") renderScheduled();
    // Redraw when the first breathing minute of something that needs you runs out.
    clearTimeout(freshTimer);
    const ends = state.sessions.filter(isFresh).map((s) => (s.since || s.last) + FRESH_MS - now());
    if (ends.length) freshTimer = setTimeout(render, Math.max(50, Math.min(...ends) + 50));
  }
  document.addEventListener("visibilitychange", () => {
    if (document.hidden || !behind) return;
    catchingUp = true;
    try { render(); } finally { catchingUp = false; }
  });

  // Animated icons breathe or turn in step with each other, whenever their card was
  // drawn: each starts at the same point of a shared 2.4 s clock.
  function syncIcons(root) {
    const offset = `-${Math.round(performance.now() % 2400)}ms`;
    root.querySelectorAll("svg.spin, svg.pulse, svg.bot, .bar .now").forEach((d) => { d.style.animationDelay = offset; });
    root.querySelectorAll(".pdot, .calm").forEach((d) => d.style.setProperty("--sync", offset)); // their dots run on a CSS variable
  }

  // ---------------------------------------------------------------- sound

  // In the app the alert sound is the system's, played by the app when sound is on; in
  // a browser, a soft chime, off until you turn it on (that click also unlocks audio).
  let audio = null;
  let soundOn = false;
  try { soundOn = localStorage.getItem("csm-sound") === "1"; } catch {}
  function paintSound() {
    const text = soundOn ? "Turn Off Alert Sound" : "Turn On Alert Sound";
    $sound.innerHTML = soundOn ? ICON.speaker : ICON.speakerOff;
    $sound.setAttribute("aria-pressed", String(soundOn));
    $sound.setAttribute("aria-label", text);
    $sound.title = text;
  }
  $sound.addEventListener("click", () => {
    soundOn = !soundOn;
    try { localStorage.setItem("csm-sound", soundOn ? "1" : "0"); } catch {}
    if (soundOn) { audio = audio || new AudioContext(); audio.resume(); chime(); }
    paintSound();
  });
  function chime() {
    if (!soundOn) return;
    audio = audio || new AudioContext();
    const t = audio.currentTime;
    [[880, 0], [1320, 0.12]].forEach(([f, d]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.18, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.35);
      o.connect(g).connect(audio.destination);
      o.start(t + d); o.stop(t + d + 0.4);
    });
  }
  paintSound();
  pinsShown(); // once on load, for the app's toolbar; again whenever the filter or the count changes
  activeShown(); // the same for Most active

  // ---------------------------------------------------------------- live updates

  // What is worth a sound and a spoken note: a session starts waiting on you, or ends
  // its turn with a question or an error.
  // A blocked task's text says "today" or "yesterday", so its key is when it started instead.
  const alertKey = (s) => s.kind === "task" ? `e:task:${s.blocked.since}` :
    s.status === "waiting" ? `w:${s.wait}${s.permit?.state === "failed" ? ":unsent" : ""}` : s.status === "asks" ? `a:${s.ask}${s.reply?.state === "failed" ? ":unsent" : ""}` : s.status === "error" ? `e:${s.error}` : s.status;

  // The app's Dock badge and menu bar show what the header does. They're told on every
  // change, hidden window or not, so the app doesn't have to ask.
  let sentStatus = "";
  function postStatus(st) {
    const status = { ...headCounts(st), attention: st.attention ?? null };
    const key = JSON.stringify(status);
    if (key !== sentStatus && bridge()) { sentStatus = key; bridge().postMessage({ status }); }
    return status;
  }

  function receive(next) {
    const first = !ready;
    if (!KEY) for (const s of next.sessions) { s.canAnswer = false; s.canSay = false; delete s.permit; } // no key: it only looks
    const changed = [];
    for (const s of [...next.sessions, ...blockedCards(next)]) {
      const key = alertKey(s);
      if (!first && seen.get(s.sid) !== key && /^[wae]:/.test(key)) changed.push(s);
    }
    state = next;
    live = new Map(next.sessions.map((s) => [s.sid, s]));
    pinSet = new Set(next.pins ?? next.sessions.filter((s) => s.pinned).map((s) => s.sid));
    for (const [sid, on] of pinWant) if (pinSet.has(sid) === on) pinWant.delete(sid); // back from the server
    ready = true;
    skew = next.now - Date.now();
    render();
    seen.clear();
    for (const s of [...next.sessions, ...blockedCards(next)]) seen.set(s.sid, alertKey(s));
    if (!seen.size) seen.set("", "");
    const { needs } = postStatus(next);
    pinsShown();
    document.title = needs ? `(${needs}) Claude Session Monitor` : "Claude Session Monitor";
    if (changed.length) {
      const text = changed.map((s) => `${s.title}: ${s.status === "error" ? "error" : "needs you"}`).join(". ");
      if (bridge()) bridge().postMessage({ alert: true, announce: text }); // the app speaks it and plays the sound
      else { $announce.textContent = text; chime(); }
    }
  }

  function setLink(v) {
    if (link === v) return;
    link = v;
    $link.classList.toggle("off", v !== "live");
    $link.lastElementChild.textContent = v === "live" ? "Live" : v === "offline" ? "Offline" : "Connecting…";
    render();
  }

  // The server pings every 10 s. With no word from it for 25 s the connection is dead
  // even if it never closed, so start over.
  let es = null;
  let heard = 0;
  function connect() {
    es?.close();
    es = new EventSource("/api/stream");
    heard = Date.now();
    es.onopen = () => { heard = Date.now(); setLink("live"); };
    es.onmessage = (m) => { heard = Date.now(); setLink("live"); receive(JSON.parse(m.data)); };
    es.addEventListener("ping", () => { heard = Date.now(); setLink("live"); });
    es.onerror = () => setLink("offline"); // EventSource keeps retrying on its own
  }
  setInterval(() => {
    if (Date.now() - heard > 25_000) { setLink("offline"); connect(); }
  }, 5000);
  render();
  connect();
  setInterval(render, 15000); // keeps "5m ago" fresh

  // anime.js's layout module ships with the page (no network). Until it loads, or if it
  // can't, the cards still glide with the page's own FLIP.
  import("./anime-layout.js").then(({ createLayout }) => {
    weekLayout = createLayout($week, {
      children: [".group", ".card", ".hrow"],
      duration: 420,
      ease: "out(4)",
      enterFrom: { opacity: 0, scale: 0.98 },
      leaveTo: { opacity: 0, scale: 0.98 },
    });
  }).catch(() => {});
</script>
</body>
</html>
