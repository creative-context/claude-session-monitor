        tokens ? `${kTokens(tokens)} tokens` : "",
      ].filter(Boolean);
      const tip = [
        wf ? `Workflow ${wf.name}` : "", wf?.description,
        since ? `Running for ${span(since)}` : "", tokens ? `${kTokens(tokens)} tokens` : "", "",
        ...(s.agents || []).map((a) => `${a.label || "Agent"}${a.phase ? ` (${a.phase})` : ""}${a.tokens ? ` · ${kTokens(a.tokens)} tokens` : ""}`),
      ].filter((x) => x !== undefined).join("\n").trim();
      out.push(tag(`${wf ? ICON.flow : ICON.agents}<span>${esc(bits.join(" · "))}</span>`, "", tip));
    }
    if (s.reminder) out.push(tag(`${ICON.wake}<span>${esc(shortWhen(s.reminder.at))}${s.reminder.more ? ` +${s.reminder.more}` : ""}</span>`, "sched", wakeTip(s.reminder)));
    const made = s.made || [];
    if (made.length) {
      out.push(`<span class="tag made ctl" data-show-task="${esc(made[0].id)}" title="${esc(madeTip(made))}">${ICON.calendarPlus}<span>${esc(made[0].name)}</span></span>`);
      if (made.length > 1) out.push(tag(`<span>+${made.length - 1}</span>`, "sched", madeTip(made)));
    }
    return `<div class="tags">${out.join("")}${mic}</div>`;
  }

  // A question's answers, in the tags' place: the session's own buttons, up to two. A click
  // sends one (its answers mod takes it to the session); one the app has to do, or any while
  // no mod is listening, opens the session instead and says why. It goes at once: Sending
  // until the mod takes it, then Sent; if no mod took it, the card needs you again.
  const SENT_WORDS = "Sent. The session is working on it.";
  const SENDING_WORDS = "Sending…";
  const answerable = (s) => s.kind !== "task" && s.status === "asks" && s.answers?.length > 0;
  // The answer you gave from the card, a button's or your words: on its way, or not sent.
  const replied = (s) => s.kind !== "task" && (s.reply?.state === "failed" || answerSent(s));
  function replyFoot(s) {
    const r = s.reply;
    if (r.state === "failed") {
      return `<div class="sentline failed"><span class="say" title="${esc(`“${r.text}” didn't reach the session`)}">Couldn't send</span><span class="a-b ctl" data-open-sid="${esc(s.sid)}" title="Opens the session: answer there"><span>Open</span>${ICON.open}</span>${micHtml(s)}</div>`;
    }
    return `<div class="sentline"><span class="say">${r.state === "pending" ? SENDING_WORDS : SENT_WORDS}</span></div>`;
  }
  function answersFoot(s) {
    if (replied(s)) return replyFoot(s);
    return `<div class="ans">${s.answers.map((a, i) => {
      const opens = Boolean(a.app) || !s.canAnswer;
      const tip = a.app ? "Only the Claude app can do this" : !s.canAnswer ? "Opens the session: answer there" : `Answer “${a.label}”${i ? "" : " (⌘↩)"}`;
      return `<span class="a-b ctl ${i ? "sec" : "pri"}${opens ? " opens" : ""}" data-answer="${i}" title="${esc(tip)}"><span>${esc(a.label)}</span>${opens ? ICON.open : ""}</span>`;
    }).join("")}${micHtml(s)}</div>`;
  }
  // VoiceOver: what the answers are, and what a click or ⌘↩ does with the first.
  function answerWords(s) {
    if (replied(s) && s.reply.state === "failed") return [`Couldn't send your answer “${s.reply.text}”`];
    if (replied(s)) return [s.reply.state === "pending" ? "Sending your answer" : SENT_WORDS];
    if (!answerable(s)) return canMic(s) ? ["You can dictate an answer"] : [];
    const first = s.answers[0];
    return [`Answers: ${s.answers.map((a) => a.label).join(", ")}`,
      first.app || !s.canAnswer ? "Command-Return opens the session to answer" : `Command-Return answers ${first.label}`,
      canMic(s) ? "You can dictate an answer" : ""];
  }

  async function answerCard(sid, i) {
    const s = live.get(sid);
    const a = s?.answers?.[i];
    if (!a || a.app || !s.canAnswer || s.reply) return openSession(sid);
    const r = await fetch(`/api/answer/${encodeURIComponent(sid)}`, {
      method: "POST", headers: actHeaders(), body: JSON.stringify({ i }),
    }).catch(() => null);
    // 409: no mod is there to take it after all. Anything else unexpected: answer there.
    if (r?.status !== 204) openSession(sid);
  }

  // A permission's Allow and Deny, in the folder's place as a question's answers are. A click
  // POSTs your decision; the server hands it to the mod holding the ask, and the card says
  // Allowing… or Denying…, then Allowed or Denied. One that never reached the session says so
  // and needs you again; a click on it opens the session. No shortcut allows: ⌘↩ opens it.
  const toolName = (t) => (t?.startsWith("mcp__") ? t.split("__").slice(2).join("__") || t : t || "it");
  function permitFoot(s) {
    const p = s.permit;
    if (p.state === "failed") {
      return `<div class="sentline failed"><span class="say" title="${esc(`Your ${p.allow === false ? "Deny" : "Allow"} didn't reach the session`)}">Couldn't send</span><span class="a-b ctl" data-open-sid="${esc(s.sid)}" title="Opens the session: answer there"><span>Open</span>${ICON.open}</span></div>`;
    }
    if (p.state !== "held") {
      const say = p.state === "sending" ? (p.allow ? "Allowing…" : "Denying…") : p.allow ? "Allowed" : "Denied";
      return `<div class="sentline"><span class="say">${say}</span></div>`;
    }
    const name = esc(toolName(p.tool));
    return `<div class="ans permit"><span class="a-b ctl pri" data-permit="allow" title="Allow ${name} (the session runs it)"><span>Allow</span></span><span class="a-b ctl sec" data-permit="deny" title="Deny ${name} (the session doesn't run it)"><span>Deny</span></span></div>`;
  }
  function permitWords(s) {
    const p = s.permit;
    if (p.state === "failed") return ["Couldn't send your answer", "Command-Return opens the session"];
    if (p.state === "sending") return [p.allow ? "Allowing" : "Denying"];
    if (p.state === "sent") return [p.allow ? "Allowed" : "Denied"];
    return ["Answers: Allow, Deny", "Command-Return opens the session"];
  }
  const permitBusy = new Set();
  async function permitCard(sid, allow) {
    const p = permitOf(live.get(sid) || {});
    if (!p || p.state !== "held") return openSession(sid);
    if (permitBusy.has(sid)) return; // one click at a time
    permitBusy.add(sid);
    const r = await fetch(`/api/permission/${encodeURIComponent(sid)}/decide`, {
      method: "POST", headers: actHeaders(), body: JSON.stringify({ id: p.id, allow }),
    }).catch(() => null);
    permitBusy.delete(sid);
    // 409: settled in the meantime (answered in its dialog, or it moved on). Anything else: answer there.
    if (r?.status !== 204) openSession(sid);
  }

  // ---------------------------------------------------------------- dictation
  // In the app, a card whose session waits on you (canSay: Done, Needs you or Error, its mod
  // listening) has a mic. Pressing it asks the app to listen, on this Mac only, and opens a
  // composer under the mic (above it when there's no room below): the words as they come,
  // then a text box to fix them and send as the session's next prompt. The composer is one
  // element in the list, outside the card, so a redraw of the card never touches it and the
  // card keeps its question in sight. One card at a time. Return stops, then sends; Esc,
  // Cancel and Close always drop it; a click elsewhere never does, so a stray click can't lose
  // the words. In a browser there's no app to listen, so no mic.
  const dictBridge = () => window.webkit?.messageHandlers?.dictate;
  let dict = null; // { sid, phase: listening | stopping | review | sending | error, text, level, lang, error, note, armed (the phrase's timer), viaPhrase }
  let dictEl = null; // the composer, while there is one
  let dictLang = "en-US"; // the last one the app said (it says it as the page loads)
  const LANGS = { "es-MX": ["ES", "Spanish (Mexico)"], "en-US": ["EN", "English (US)"] };
  const canMic = (s) => Boolean(dictBridge()) && s.canSay === true && s.kind !== "task" && !sentOf(s);
  // The mic's on state is set on it in place (syncMic), so the card's markup is the same whether you dictate or not.
  const micHtml = (s) => (canMic(s)
    ? `<span class="mic-b ctl" role="button" tabindex="0" data-mic aria-haspopup="dialog" aria-expanded="false" aria-label="Dictate an answer" title="Dictate an answer">${ICON.mic}</span>` : "");
  const DICT_ERRORS = {
    denied: "Dictation needs the microphone and speech recognition. Allow this app for both in System Settings, under Privacy & Security.",
    unavailable: "Dictation isn't ready for this language. Download it in System Settings, under Keyboard, Dictation.",
    failed: "Dictation stopped before it finished. Try again.",
    silent: "The microphone gives no sound. Check that it isn't muted and that this app may use it in System Settings, under Privacy & Security.",
    empty: "No words came through. Try again.",
    moved: "Not sent: the session closed or moved on before you sent this.",
  };
  const DICT_TITLES = { denied: "Dictation isn't allowed", unavailable: "Language not ready", failed: "Dictation stopped", silent: "No sound", empty: "No words heard", moved: "The session moved on" };
  const dictBtn = (act, words, cls, tip, extra = "") =>
    `<button type="button" class="d-b ${cls}" data-dict="${act}" title="${esc(tip)}"${extra}>${words}</button>`;
  const micOf = (sid) => cards.get(sid)?.querySelector("[data-mic]") ?? null;
  let dictUnder = null; // the card whose drawer is sliding back under it
  function syncMic() {
    for (const m of $content.querySelectorAll("[data-mic]")) {
      const sid = m.closest("[data-sid]")?.dataset.sid;
      const on = Boolean(dict) && sid === dict.sid;
      if (m.classList.contains("on") !== on) m.classList.toggle("on", on);
      const under = !on && sid === dictUnder;
      if (m.classList.contains("under") !== under) m.classList.toggle("under", under);
      const card = m.closest(".card"); // over its drawer while it's out or sliding back
      if (card && card.classList.contains("lifted") !== (on || under)) card.classList.toggle("lifted", on || under);
      if (m.getAttribute("aria-expanded") !== String(on)) m.setAttribute("aria-expanded", String(on));
    }
  }

  // The five bars follow your voice. Each takes the level with its own weight and a little
  // chance, so a sentence reads as speech, not one pump; the curve lifts a normal voice to
  // the middle. Quiet, they rest low and breathe, so it shows it's listening.
  const WAVE_K = [0.55, 0.85, 1, 0.8, 0.5];
  function drawWave(level) {
    const w = dictEl?.querySelector(".d-wave");
    if (!w) return;
    const raw = Math.max(0, Math.min(1, Number(level) || 0));
    const lvl = Math.pow(raw, 0.7);
    w.style.setProperty("--lvl", String(raw));
    w.classList.toggle("hush", lvl < 0.08);
    [...w.children].forEach((b, i) => b.style.setProperty("--h", (0.2 + Math.min(0.8, lvl * WAVE_K[i] * (0.65 + Math.random() * 0.5))).toFixed(3)));
  }
  // What the composer holds for the phase it's in, made anew when the phase changes.
  function buildDict() {
    const d = dict;
    if (!dictEl) {
      dictEl = document.createElement("div");
      dictEl.id = "dict";
      dictEl.setAttribute("role", "dialog");
      dictEl.setAttribute("aria-label", "Dictate an answer");
      dictEl.style.transition = "none"; // placed and measured first, then it slides out (dictPhase)
      $content.append(dictEl);
    }
    dictEl.className = `pop anchored drawer dict ${d.phase}${dictEl.classList.contains("open") ? " open" : ""}${dictEl.classList.contains("above") ? " above" : ""}`;
    const [short, long] = LANGS[d.lang] || LANGS["en-US"];
    const lang = `<span class="d-lang" title="${esc(`Dictating in ${long}. Change the language in the menu bar menu.`)}">${short}</span>`;
    const cancel = dictBtn("cancel", "Cancel", "sec", "Cancel (Esc)");
    if (d.phase === "listening" || d.phase === "stopping") {
      dictEl.innerHTML = `<div class="drawer-in"><div class="d-head"><span class="d-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span class="d-say">${d.phase === "stopping" ? "Sending…" : "Listening"}</span>${lang}</div>
        <div class="d-words"><span></span></div>
        <div class="d-row">${d.phase === "listening" ? `<div class="d-tip"></div>` : ""}${cancel}${dictBtn("send", "Send", "pri", "Send what you said (Return)", d.phase === "stopping" ? ' aria-disabled="true"' : "")}</div></div>`;
    } else if (d.phase === "error") {
      // A session that moved on keeps what you said in sight, and offers no second try here.
      const moved = d.error === "moved";

    }
    // The pin had the keyboard: the row's new one gets it back.
    if (pinAt && !document.activeElement?.matches?.("[data-pin]")) listEl.querySelector(`[data-sid="${CSS.escape(pinAt)}"] [data-pin]`)?.focus({ preventScroll: true });
  }

  const LONG_DAY = 6; // more rows than this, and a wide window splits the day in two columns

  // The empty Active tells, in a loop, what the app does with sessions: two start working,
  // one stops to need you and moves to the first place (with the cards' own glide), then
  // both finish and rest done for a while before the next round. Reduce Motion shows them
  // done and still.
  function quietStory(el) {
    const art = el.querySelector(".qart");
    const [a, b] = art.querySelectorAll(".qcard");
    const set = (c, st) => { c.className = `qcard ${st}`; syncIcons(c); };
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) { set(a, "done"); set(b, "done"); return; }
    const glide = { duration: 380, easing: "cubic-bezier(0.2, 0, 0, 1)" };
    const enter = (c, st) => { set(c, st); c.animate([{ transform: "scale(0.98)" }, { transform: "none" }], { duration: 420, easing: glide.easing }); };
    const first = (c) => {
      if (art.firstElementChild === c) return;
      const kids = [...art.children], was = new Map(kids.map((k) => [k, k.getBoundingClientRect().left]));
      art.prepend(c);
      for (const k of kids) {
        const dx = was.get(k) - k.getBoundingClientRect().left;
        if (Math.abs(dx) > 1) k.animate([{ transform: `translateX(${dx}px)` }, { transform: "none" }], glide);
      }
    };
    // Each round, the card in second place is the one that needs you, so they take turns.
    const play = () => {
      if (!el.isConnected) return;
      const [x, y] = art.children;
      const go = (c) => c.classList.contains("off") ? enter(c, "work") : set(c, "work");
      const steps = [[200, () => go(x)], [700, () => go(y)], [2200, () => { set(y, "need"); first(y); }],
        [4200, () => set(y, "done")], [5200, () => set(x, "done")]];
      for (const [at, fn] of steps) setTimeout(() => el.isConnected && fn(), at);
      setTimeout(play, 8200);
    };
    set(a, "off"); set(b, "off");
    play();
  }

  function weekShell() {
    if ($week.querySelector(":scope > .wsplit")) return;
    cards.clear();
    groups.clear();
    $week.innerHTML = `<div class="wsplit"><div class="wmain"></div><div class="wside"></div></div>`;
  }

  function renderWeek() {
    if (!ready) {
      cards.clear();
      groups.clear();
      $week.innerHTML = link === "offline" ? offlineState() : loadingState();
      syncIcons($week);
      return;
    }
    const all = withBlocked(state.sessions);
    if (!all.length) {
      cards.clear();
      groups.clear();
      $week.innerHTML = emptyWeek();
      return;
    }
    // The Pinned filter: only pinned sessions (no task cards). One you unpin under the pointer
    // stays where it is until the pointer leaves, like anything else while the list holds still.
    // Most active: only the sessions with the most time working, in the usual sections.
    const list = activeOnly ? topActive(all) : pinnedOnly ? all.filter((s) => s.kind !== "task" && (isPinned(s.sid) || held?.has(s.sid))) : all;
    const hadShell = Boolean($week.querySelector(":scope > .wsplit"));
    weekShell();
    const $main = $week.querySelector(".wmain");
    const $side = $week.querySelector(".wside");

    // Cards are kept between updates, one per session. A status change then fades the
    // card's color instead of redrawing it, and a card that changes place slides there.
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const buckets = new Map(SECTIONS.map((g) => [g.id, []]));
    for (const s of list) buckets.get(held?.get(s.sid)?.[0] ?? SECTIONS.find((g) => g.test(s)).id).push(s);
    // Held: each in its place from the hold's start, something new after them, in its usual order.
    if (held) for (const arr of buckets.values()) arr.sort((a, b) => (held.get(a.sid)?.[1] ?? Infinity) - (held.get(b.sid)?.[1] ?? Infinity));
    // Only a change in what is where (which cards and rows, in what order) is animated by
    // the layout. While it measures it mutes CSS transitions, and a card's color fade on a
    // status change must keep running, so updates that only change content skip it.
    // Pinned sessions come first in each part, after what needs you, which always leads; each
    // part keeps its own order (the sort is stable). Before the shape, so a pin's move glides.
    const pinRank = (s) => (s.needsYou ? 0 : isPinned(s.sid) ? 1 : 2);
    // Most active: most time working first in each part instead.
    if (!held) for (const arr of buckets.values()) arr.sort((a, b) => activeOnly ? byWorked(a, b) : pinRank(a) - pinRank(b));
    const shape = JSON.stringify(SECTIONS.map((g) => [g.id, buckets.get(g.id).map((s) => s.sid)]));
    // Newest first in the day sections; the server's order (urgency) in Active.
    if (!held && !activeOnly) for (const id of ["today", "yesterday", "earlier"]) buckets.get(id).sort((a, b) => pinRank(a) - pinRank(b) || b.last - a.last);
    weekOrder = new Map();
    for (const [id, arr] of buckets) arr.forEach((s, i) => weekOrder.set(s.sid, [id, i]));
    // Held, what counts is what's on screen: as long as nothing new comes or goes, nothing moved.
    const shown = JSON.stringify(SECTIONS.map((g) => [g.id, buckets.get(g.id).map((s) => s.sid)]));
    const moved = held ? shown !== weekShown : shape !== weekShape;
    weekShape = shape;
    weekShown = shown;
    // Back from hidden, things are simply where they are now.
    const glide = moved && hadShell && weekLayout && !still && !catchingUp && document.visibilityState === "visible";
    // Without the layout, the page's own FLIP slides what moved: every card if the shape or
    // the column beside them changed, else the cards from the first one whose content
    // changed (a taller card pushes the ones after it), else nothing, and no measuring.
    const active = buckets.get("active");
    const keys = active.map((s) => cardKey(s));
    const meterOn = Boolean(state.usage?.week);
    let from = moved || meterOn !== weekMeterOn ? 0 : active.findIndex((s, i) => cards.get(s.sid)?._key !== keys[i]);
    weekMeterOn = meterOn;
    const before = new Map();
    if (!glide && !still && !catchingUp && from >= 0) {
      for (const s of active.slice(from)) { const el = cards.get(s.sid); if (el?.isConnected) before.set(s.sid, el.getBoundingClientRect()); }
    }

    const section = (g, body) => {
      const sec = document.createElement("section");
      sec.className = `group ${g.id}`;
      sec.dataset.layoutId = `g-${g.id}`;
      sec.setAttribute("aria-label", g.label);
      sec.innerHTML = `<h2 class="group-head">${g.icon}<span>${g.label}</span><span class="count"></span>${g.pick ? g.pick() : g.hint ? `<span class="hint">· ${g.hint}</span>` : ""}</h2>${body}`;
      groups.set(g.id, sec);
      return sec;
    };

    // What leaves for good is hidden first, so the layout can fade it out, and taken out
    // on the next draw. A card that becomes a row is taken out now: the row takes its place.
    const listed = new Set(list.map((s) => s.sid));
    const drop = (el) => {
      if (!glide) return el.remove();
      el.style.display = "none";
      el.dataset.leaving = String(Date.now());
      // Its rows may show up in another section now; their ids belong to those.
      el.querySelectorAll("[data-layout-id]").forEach((c) => c.removeAttribute("data-layout-id"));
    };
    const mutate = () => {
    // Gone once their fade has run its course, even if the next update comes sooner.
    $week.querySelectorAll("[data-leaving]").forEach((el) => { if (Date.now() - Number(el.dataset.leaving) > 500) el.remove(); });
    // Active: cards.
    const keep = new Set();
    // Active stays even when it's empty, and then says so: a calm line instead of a gap.
    let sec = groups.get("active");
    if (!sec) $main.appendChild(sec = section(SECTIONS[0], `<div class="wstrip" hidden role="meter" aria-valuemin="0" aria-valuemax="100"></div><div class="abody"><div class="grid"></div><aside class="meter" hidden role="meter" aria-valuemin="0" aria-valuemax="100"></aside></div>`));
    // With the Pinned filter on, an empty Active says why in a quiet line of its own; so does Most active.
    const pinWords = activeOnly ? (!list.length ? "Nothing counted yet. Sessions show here once Claude has worked in them." : "None of the most active sessions are active.") : !pinnedOnly ? "" : !pinCount() ? "No pinned sessions. Pin one from its card."
      : !list.length ? "No pinned sessions in the last 7 days." : "No pinned sessions are active.";
    let quiet = sec.querySelector(".quiet");
    if (!active.length) {
      sec.querySelector(".count").textContent = "";
      if (quiet && (quiet.dataset.words ?? "") !== pinWords) { quiet.remove(); quiet = null; }
      if (!quiet && pinWords) {
        sec.querySelector(".meter").insertAdjacentHTML("beforebegin", `<div class="quiet ${activeOnly ? "maq" : "pinq"}" role="status" data-words="${esc(pinWords)}">${activeOnly ? ICON.activity : ICON.pin}<span>${esc(pinWords)}</span></div>`);
      } else if (!quiet) {
        const mini = (id) => `<span class="qcard" id="${id}"><span class="qrow"><span class="qpill"></span>${CALM}${PDOT}<span class="qok">${ICON.check}</span></span><b></b></span>`;
        sec.querySelector(".meter").insertAdjacentHTML("beforebegin", `<div class="quiet" role="status"><span class="qart" aria-hidden="true">${mini("qa")}${mini("qb")}</span><span>You're all caught up.</span></div>`);
        quietStory(sec.querySelector(".quiet"));
      }
    } else {
      quiet?.remove();
      sec.querySelector(".count").textContent = active.length;
      const grid = sec.querySelector(".grid");
      active.forEach((s, i) => {
        const el = upsertCard(s, keys[i]);
        keep.add(s.sid);
        const at = [...grid.children].filter((c) => !("leaving" in c.dataset))[i]; // what's leaving doesn't count
        if (at !== el) grid.insertBefore(el, at || null);
      });
    }
    for (const [sid, el] of cards) if (!keep.has(sid)) { listed.has(sid) ? el.remove() : drop(el); metaFit?.unobserve(el); cards.delete(sid); }
    renderMeter();
    checkFamily();

    // The rest of the week: compact rows, by day.
    let prev = null;
    for (const g of SECTIONS.slice(1)) {
      const items = buckets.get(g.id);
      sec = groups.get(g.id);
      if (!items.length) { if (sec) drop(sec); groups.delete(g.id); continue; }
      if (!sec) sec = section(g, `<div class="hlist"></div>`);
      const want = prev ? prev.nextSibling : $side.firstChild;
      if (sec !== want) $side.insertBefore(sec, want);
      prev = sec;
      sec.querySelector(".count").textContent = items.length;
      const rows = sec.querySelector(".hlist");
      rows.classList.toggle("long", items.length > LONG_DAY);
      morphRows(rows, items.map((s) => weekRow(s, g.id === "earlier")).join(""));
    }
    };

    // anime.js measures before and after, then animates what changed: a card that moves
    // glides, one that leaves fades out instead of vanishing, a section opens and closes,
    // and a card that becomes a row (or a row a card) turns into it.
    if (glide) { snapMetas(480); return void weekLayout.update(mutate); } // it fades colors as it moves things
    mutate();
    snapMetas();

    // Without it, FLIP: start each moved card where it was on screen and let it glide to
    // its new place. Starting from the on-screen position keeps it smooth even mid-move.
    if (before.size) {
      for (const [sid, a] of before) {
        const el = cards.get(sid);
        if (!el?.isConnected) continue;
        const b = el.getBoundingClientRect();
        const dx = a.left - b.left;
        const dy = a.top - b.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }],
            { duration: 380, easing: "cubic-bezier(0.2, 0, 0, 1)" });
        }
      }
    }
  }

  // ---------------------------------------------------------------- All Sessions

  const hist = { items: [], total: 0, ready: false, html: "", req: 0 };

  async function loadHistory(reset) {
    const q = query;
    const pins = pinnedOnly; // the Pinned filter asks the server for the pinned ones only
    const most = activeOnly; // and Most active for its sessions, most first
    const req = ++hist.req; // a refresh and a "Show more" can cross; only the newest counts
    // A refresh keeps as many rows as were already shown.
    const limit = reset ? Math.max(60, hist.items.length) : 60;
    const offset = reset ? 0 : hist.items.length;
    try {
      const r = await fetch(`/api/history?limit=${limit}&offset=${offset}&q=${encodeURIComponent(q)}${pins ? "&pinned=1" : ""}${most ? "&active=1" : ""}`).then((x) => x.json());
      if (q !== query || pins !== pinnedOnly || most !== activeOnly || req !== hist.req) return; // a newer request is on its way
      hist.items = reset ? r.sessions : hist.items.concat(r.sessions);
      hist.total = r.total;
      hist.ready = true;
      renderHistory();
    } catch {
      // The server is restarting; the next update tries again.
    }
  }

  // Marks every match of the search in a piece of text.
  function hl(text) {
    const raw = String(text ?? "");
    if (!query) return esc(raw);
    const lower = raw.toLowerCase();
    const q = query.toLowerCase();
    let out = "";
    let i = 0;
    for (let j; (j = lower.indexOf(q, i)) !== -1; i = j + q.length) {
      out += esc(raw.slice(i, j)) + `<mark>${esc(raw.slice(j, j + q.length))}</mark>`;
    }
    return out + esc(raw.slice(i));
  }

  // A row reads from the database, then takes the live state of the session if it is
  // still in the last 7 days, so a row that is working right now looks and moves like
  // its card.
  function merged(h) {
    const s = live.get(h.sid);
    return s ? { ...h, ...s, project: s.project || h.project, cwd: s.cwd || h.cwd } : h;
  }

  function historyRow(h) {
    const st = LABEL[h.status] ? h.status : "ended";
    const isLive = live.has(h.sid) && (st === "working" || needsYou(h));
    let snip = st === "waiting" ? h.wait : st === "asks" ? h.ask : st === "error" ? h.error : h.note || h.recap || h.ask || "";
    // A search that matched only the first prompt shows the prompt, so you can see why.
    const q = query.toLowerCase();
    if (q && !`${h.title} ${snip}`.toLowerCase().includes(q) && h.prompt?.toLowerCase().includes(q)) snip = h.prompt;
    let icon = h.background ? ICON.bot : STATUS_ICON[st] || ICON.check;
    if (!isLive) icon = icon.replace(/ (spin|pulse|bot)"/, '"');
    const what = isLive ? `<span class="hstate">${esc(label(h))}</span>` : `<span class="sr">${esc(label(h))}.</span>`;
    const pinned = isPinned(h.sid) ? `<span class="sr">Pinned.</span>` : "";
    return `<button type="button" class="hrow s-${st}${isLive ? " live" : ""}${isLive && isFresh(h) ? " fresh" : ""}" data-sid="${esc(h.sid)}" title="Open in the Claude app">
      <span class="hicon" title="${esc(label(h))}">${icon}</span>
      <span class="htitle"><span class="t">${hl(h.title)}</span>${h.task ? `<span class="hsched" title="${esc(h.taskName ? `A run of ${h.taskName}` : "A scheduled run")}">${ICON.calendarClock}</span>` : ""}${schedIcons(h)}${what}${pinned}</span>
      ${h.project ? tag(`${ICON.folder}<span>${hl(h.project)}</span>`, "name", h.project) : "<span></span>"}
      <span class="htime">${workedHtml(h)}${clock(h.last)}${pinHtml(h.sid)}</span>
      ${snip ? `<span class="hsnip">${hl(snip)}</span>` : ""}
    </button>`;
  }

  function renderHistory() {
    let html;
    if (!hist.ready) {
      html = link === "offline" ? offlineState() : loadingState();
    } else if (activeOnly && !hist.items.length) {
      html = query
        ? `<div class="empty-state"><div class="badge">${ICON.activity}</div>
            <h3>No active sessions match “${esc(query)}”</h3>
            <p>Turn off Most active to search all sessions.</p></div>`
        : `<div class="empty-state"><div class="badge">${ICON.activity}</div>
            <h3>Nothing counted yet</h3>
            <p>Sessions show here once Claude has worked in them in the last 7 days.</p></div>`;
    } else if (pinnedOnly && !hist.items.some((h) => isPinned(h.sid))) {
      html = query
        ? `<div class="empty-state"><div class="badge">${ICON.pin}</div>
            <h3>No pinned sessions match “${esc(query)}”</h3>
            <p>Turn off Pinned to search all sessions.</p></div>`
        : `<div class="empty-state"><div class="badge">${ICON.pin}</div>
            <h3>No pinned sessions</h3>
            <p>Pin one from its card.</p></div>`;
    } else if (!hist.items.length) {
      html = query
        ? `<div class="empty-state"><div class="badge">${ICON.search}</div>
            <h3>No sessions match “${esc(query)}”</h3>
            <p>Try a project name or a word from the task.</p></div>`
        : `<div class="empty-state"><div class="badge">${ICON.history}</div>
            <h3>No sessions yet</h3>
            <p>Every session is kept here for good, and you can search them all. The last 7 days are here too.</p></div>`;
    } else {
      // With the Pinned filter, a row you unpin goes at once; the server's list follows.
      const items = hist.items.filter((h) => !pinnedOnly || isPinned(h.sid)).map(merged).sort((a, b) => b.last - a.last);
      const days = [];
      for (const h of items) {
        const d = dayLabel(h.last);
        if (days.at(-1)?.label !== d) days.push({ label: d, items: [] });
        days.at(-1).items.push(h);
      }
      if (activeOnly) for (const d of days) d.items.sort(byWorked); // Most active: most time working first in each day
      html = days.map((d) => `<section class="group" aria-label="${esc(d.label)}">
          <h2 class="group-head">${d.label === "Today" ? ICON.sun : ICON.calendar}<span>${esc(d.label)}</span><span class="count">${d.items.length}</span></h2>
          <div class="hlist${d.items.length > LONG_DAY ? " long" : ""}">${d.items.map(historyRow).join("")}</div>
        </section>`).join("") +
        (hist.items.length < hist.total
          ? `<div class="more"><button class="btn" type="button" data-more>${ICON.arrowDown}Show ${Math.min(60, hist.total - hist.items.length)} More</button></div>` : "");
    }
    // Live updates arrive often; redraw only when something on screen changed.
    if (html === hist.html) return;
    hist.html = html;
    const next = document.createElement("template");
    next.innerHTML = html;
    const PARTS = "[data-sid], .group-head .count, [data-more]";
    const shape = (root) => [...root.querySelectorAll(".group-head > span:not(.count), [data-sid], [data-more]")]
      .map((e) => e.dataset.sid ?? e.textContent).join("|");
    const was = shape($history);
    const pinAt = $history.contains(document.activeElement) && document.activeElement.matches("[data-pin]") ? document.activeElement.closest("[data-sid]")?.dataset.sid : null;
    if (was && shape(next.content) === was) {
      // Same rows in the same order: change each one in place, so a new state fades its
      // color like a card does, and hover and focus stay where they are.
      const old = $history.querySelectorAll(PARTS);
      next.content.querySelectorAll(PARTS).forEach((n, i) => {
        const o = old[i];
        if (o.className !== n.className) o.className = n.className;
        if (o._html !== n.innerHTML) { o.innerHTML = n.innerHTML; o._html = n.innerHTML; }
      });
    } else {
      const focused = $history.contains(document.activeElement) ? document.activeElement.closest("[data-sid]")?.dataset.sid : null;
      $history.innerHTML = html;
      $history.querySelectorAll(PARTS).forEach((o) => { o._html = o.innerHTML; });
      if (focused) $history.querySelector(`[data-sid="${CSS.escape(focused)}"]`)?.focus({ preventScroll: true });
    }
    // The pin had the keyboard: the row's new one gets it back.
    if (pinAt && !document.activeElement?.matches?.("[data-pin]")) $history.querySelector(`[data-sid="${CSS.escape(pinAt)}"] [data-pin]`)?.focus({ preventScroll: true });
    syncIcons($history);
  }

  // A new session shows up in All Sessions too, without waiting for a search or a switch.
  let historyTimer;
  function refreshHistory() {
    if (view !== "history" || !hist.ready) return renderHistory();
    const loaded = new Set(hist.items.map((h) => h.sid));
    const oldest = hist.items.at(-1)?.last ?? 0;
    // Most active: a session joins or leaves the ten (their order is the page's own).
    const ids = (l) => l.map((x) => x.sid).sort().join();
    const missing = activeOnly ? !query && ids(topActive(state.sessions)) !== ids(hist.items)
      : !query && state.sessions.some((s) => !loaded.has(s.sid) && s.last >= oldest && (!pinnedOnly || isPinned(s.sid)));
    if (missing) { clearTimeout(historyTimer); historyTimer = setTimeout(() => loadHistory(true), 400); }
    renderHistory();
  }

  // ---------------------------------------------------------------- Scheduled

  // When something happens, in words: "today at 7:10 AM", "yesterday at…", "Mon at…".
  function when(t) {
    const at = clock(t);
    if (t >= dayStart(0) && t < dayStart(-1)) return `today at ${at}`;
    if (t >= dayStart(1) && t < dayStart(0)) return `yesterday at ${at}`;
    if (t >= dayStart(-1) && t < dayStart(-2)) return `tomorrow at ${at}`;
    const d = new Date(t);
    const near = Math.abs(t - now()) < 6 * DAY;
    return `${d.toLocaleDateString("en-US", near ? { weekday: "short" } : { month: "short", day: "numeric" })} at ${at}`;
  }
  // The next run, short, for the corner of the card.
  function nextLabel(t) {
    const ms = t - now();
    if (ms < 45_000) return "now";
    if (ms < 3_600_000) return `in ${Math.round(ms / 60_000)}m`;
    const w = when(t);
    return w[0].toUpperCase() + w.slice(1);
  }

  // A task card: how its last run went, or that it is paused, missed a run or never ran.
  function taskLook(t) {
    const r = t.lastRun;
    if (!t.enabled && !t.ran) return { cls: "paused", tag: tag(`${ICON.pause}<span>Paused</span>`, "s-idle"), label: "Paused" };
    if (t.blocked?.queued) return { cls: "queued", tag: tag(`${ICON.clock}<span>Waiting</span>`, "s-idle"), label: "Waiting" };
    if (t.blocked) return { cls: "error", tag: tag(`${ICON.error}<span>Can't run</span>`, "s-error"), label: "Can't run", fresh: now() - t.blocked.since < FRESH_MS };
    if (r && (r.status === "working" || r.needsYou)) {
      const s = { ...r, background: false };
      const text = r.status === "working" ? "Running" : label(s);
      return { cls: r.status, tag: tag(`${statusIcon(s)}<span>${text}</span>`, `s-${r.status}`), label: text, fresh: isFresh(s) };
    }
    if (t.missed) return { cls: "missed", tag: tag(`${ICON.alarm}<span>Missed</span>`, "s-missed"), label: "Missed a run" };
    if (!r && t.ran) return { cls: "done", tag: tag(`${ICON.check}<span>Done</span>`, "s-done"), label: "Done" }; // ran before we saw it
    if (!r) return { cls: "unrun", tag: tag(`${ICON.calendarClock}<span>Scheduled</span>`, "s-idle"), label: "No runs yet" };
    if (r.status === "asks") return { cls: "asks stale", tag: tag(`${ICON.question.replace(" pulse", "")}<span>Asked you</span>`, "s-asks"), label: "Asked you" };
    if (r.status === "error") return { cls: "error stale", tag: tag(`${ICON.error.replace(" pulse", "")}<span>Error</span>`, "s-error"), label: "Error" };
    if (r.status === "ended" && r.note) return { cls: "ended", tag: tag(`${ICON.power}<span>Closed</span>`, "s-ended"), label: "Closed" };
    return { cls: "done", tag: tag(`${ICON.check}<span>Done</span>`, "s-done"), label: "Done" };
  }

  function taskDetail(t) {
    const r = t.lastRun;
    const line = (html) => `<div class="line">${html}</div>`;
    const sched = line(`${ICON.calendarClock}<span class="txt">${t.schedule ? esc(t.schedule) : `<code>${esc(t.cron)}</code>`}</span>`);
    let second;
    if (t.enabled && t.blocked?.queued) {
      return sched + line(`${ICON.history}<span class="txt">Starts once the run from ${esc(when(t.blocked.run.at))} ends</span>`);
    } else if (t.enabled && t.blocked) {
      // Two lines, so why it can't run is never cut off.
      const why = blockedWhy(t.blocked);
      return sched + `<div class="wrap"><b>${esc(`Didn't run ${when(t.blocked.since)}.`)}</b> ${esc(why[0].toUpperCase() + why.slice(1))}.</div>`;
    } else if (t.enabled && r?.status === "working") {
      second = action(r.tool, r.detail) || `${ICON.bulb}<span class="txt">Started ${when(r.first)}</span>`;
    } else if (t.enabled && r?.needsYou) {
      const text = r.status === "waiting" ? r.wait || "Waiting for your answer" : r.status === "asks" ? r.ask || "It asked you something" : r.error || "The run ended with an error";
      second = `<span class="txt"><b>${esc(text)}</b></span>`;
    } else if (t.enabled && t.missed) {
      second = `${ICON.alarm}<span class="txt">Didn't run ${when(t.missed)}</span>`;
    } else {
      second = `${ICON.history}<span class="txt">${r ? `Last run ${when(r.first)}` : t.ran ? `Ran ${when(t.once)}` : "No runs yet"}</span>`;
    }
    return sched + line(second);
  }

  function runDots(t) {
    if (!t.runs.length) return "";
    const runs = [...t.runs].reverse(); // oldest first, like a timeline
    const word = runWord;
    const tip = `Last ${plural(runs.length, "run", "runs")}, oldest first:\n${runs.map((r) => `${when(r.at)}: ${word(r)}`).join("\n")}`;
    const dots = runs.map((r) => `<i class="r-${r.status === "idle" ? "done" : r.status}"></i>`).join("");
    return tag(`<span class="dots" aria-hidden="true">${dots}</span>`, "", tip);
  }
  const runWord = (r) => (r.status === "working" ? "running" : r.status === "done" || r.status === "idle" ? "done"
    : r.status === "ended" ? "closed" : r.status === "error" ? "error" : r.status === "waiting" ? "needs you" : "asked you");
  // "Last 7 runs: 6 done, 1 error", for VoiceOver, which can't see the dots.
  function runSummary(t) {
    if (!t.runs.length) return "";
    const counts = new Map();
    for (const r of t.runs) counts.set(runWord(r), (counts.get(runWord(r)) || 0) + 1);
    return `Last ${plural(t.runs.length, "run", "runs")}: ${[...counts].map(([w, n]) => `${n} ${w}`).join(", ")}`;
  }

  const taskCards = new Map(); // task id → card element, kept between updates
  function upsertTask(t) {
    let el = taskCards.get(t.id);
    if (!el) {
      el = document.createElement("button");
      el.type = "button";
      el.dataset.task = t.id;
      taskCards.set(t.id, el);
    }
    const look = taskLook(t);
    const cls = `card task ${look.cls}${look.fresh ? " fresh" : ""}${el.classList.contains("found") ? " found" : ""}`;
    if (el.className !== cls) el.className = cls;
    // A click opens the last run (the one holding it up, if it's blocked); a task that
    // never ran has nothing to open.
    const opens = t.blocked?.run?.sid ?? t.lastRun?.sid;
    if (opens) el.dataset.sid = opens; else delete el.dataset.sid;
    const nextText = t.enabled && t.next ? nextLabel(t.next) : "";
    const inner = `
      <div class="top">
        ${look.tag}
        ${nextText ? `<span class="time" title="Next run ${esc(when(t.next))}">${ICON.clock}${nextText}</span>` : ""}
      </div>
      <div class="title">${esc(t.name)}</div>
      <div class="detail">${taskDetail(t)}</div>
      <div class="tags">${t.project ? tag(`${ICON.folder}<span>${esc(t.project)}</span>`, "name", t.project) : ""}${runDots(t)}</div>`;
    if (el._inner !== inner) {
      el.innerHTML = inner;
      el._inner = inner;
      syncIcons(el);
      el.setAttribute("aria-label", [t.name, look.label, plain(taskDetail(t)), nextText ? `Next run ${when(t.next)}` : "", runSummary(t)].filter(Boolean).join(". "));
    }
    const tip = t.blocked?.run ? (t.blocked.queued ? "Open the run it's waiting for in the Claude app" : "Open the run that's holding it up in the Claude app") : t.lastRun ? "Open the last run in the Claude app" : "No runs yet";
    if (el.title !== tip) el.title = tip;
    return el;
  }

  const TASK_GROUPS = [
    { id: "on", label: "Scheduled", hint: "on this Mac", icon: ICON.calendarClock, test: (t) => t.enabled && !t.ran },
    { id: "off", label: "Paused", icon: ICON.pause, test: (t) => !t.enabled && !t.ran },
    { id: "ran", label: "Ran once", icon: ICON.check, test: (t) => t.ran }, // one-time tasks, done
  ];
  const taskGroups = new Map();

  function renderScheduled() {
    if (!ready) {
      taskCards.clear();
      taskGroups.clear();
      $scheduled.innerHTML = link === "offline" ? offlineState() : loadingState();
      syncIcons($scheduled);
      return;
    }
    const list = state.tasks || [];
    if (!list.length) {
      taskCards.clear();
      taskGroups.clear();
      $scheduled.innerHTML = `<div class="empty-state"><div class="badge">${ICON.calendarClock}</div>
        <h3>No scheduled tasks</h3>
        <p>Ask Claude in the Claude app to run something on a schedule. Each task shows up here with its next run and how the last one went.</p></div>`;
      return;
    }
    $scheduled.querySelector(":scope > .empty-state")?.remove();
    const keep = new Set();
    let prev = null;
    for (const g of TASK_GROUPS) {
      const items = list.filter(g.test); // the server's order: what needs you, running, missed, next up
      let sec = taskGroups.get(g.id);
      if (!items.length) { sec?.remove(); taskGroups.delete(g.id); continue; }
      if (!sec) {
        sec = document.createElement("section");
        sec.className = `group ${g.id === "on" ? "active" : ""}`;
        sec.setAttribute("aria-label", g.label);
        sec.innerHTML = `<h2 class="group-head">${g.icon}<span>${g.label}</span><span class="count"></span>${g.hint ? `<span class="hint">· ${g.hint}</span>` : ""}</h2><div class="grid"></div>`;
        taskGroups.set(g.id, sec);
      }
      const want = prev ? prev.nextSibling : $scheduled.firstChild;
      if (sec !== want) $scheduled.insertBefore(sec, want);
      prev = sec;
      sec.querySelector(".count").textContent = items.length;
      const grid = sec.querySelector(".grid");
      items.forEach((t, i) => {
        const el = upsertTask(t);
        keep.add(t.id);
        if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
      });
    }
    for (const [id, el] of taskCards) if (!keep.has(id)) { el.remove(); taskCards.delete(id); }
  }

  // ---------------------------------------------------------------- views

  function setView(v, fromApp) {
    if (v !== "week" && v !== "history" && v !== "scheduled") return;
    view = v;
    // Another view closes the composer, like any popover: hidden, it would still hold the keys.
    if (v !== "week" && dict) endDict(false);
    $week.hidden = v !== "week";
    $history.hidden = v !== "history";
    $scheduled.hidden = v !== "scheduled";
    document.querySelectorAll(".seg [data-view]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === v)));
    $content.scrollTop = 0;
    if (v === "history") { renderHistory(); loadHistory(true); }
    if (v === "scheduled") renderScheduled();
    renderUsage(); // the header carries the usage when the Active tile is out of view
    endFamily(); // the card that lit the spotlight may be out of view now
    placeDict(); // the composer shows only with its card
    if (!fromApp) bridge()?.postMessage({ view: v }); // keep the app's toolbar switch in step
  }

  let searchTimer;
  function search(q, fromApp) {
    query = String(q ?? "").trim();
    if ($q.value !== q) $q.value = q ?? "";
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (query && view !== "history") setView("history", fromApp);
      else if (view === "history") loadHistory(true);
    }, 180);
  }

  // The app drives these from its toolbar.
  window.csm = {
    // The app's key for this start of its server: the cards can answer and allow from now on.
    setKey: (k) => {
      if (typeof k !== "string" || !/^[0-9a-f]{64}$/.test(k) || k === KEY) return;
      KEY = k;
      fetch("/api/state").then((r) => r.json()).then(receive).catch(() => {}); // what the keyless view left out
    },
    setView: (v) => setView(v, true), search: (q) => search(q, true), reportChrome: () => { fitCounts(); reportChrome(); snapWeek(); },
    endFamily: () => endFamily(), // the app calls these when the pointer enters or leaves the window, active or not
    pointer: (inside) => { appInside = Boolean(inside); pointerIn = false; if (!inside) { endFamily(); hideUsageCard(); holdEnd(); } },
    dictation: (m) => onDictation(m), // the app's dictation, for the card that asked
    pinnedOnly: (on) => setPinnedOnly(on), togglePin: (sid) => togglePin(sid), // the app's toolbar filter, and its card menu's Pin and Unpin
    activeOnly: (on) => setActiveOnly(on) }; // the app's toolbar Most active filter

  // In the app the header row sits in the title bar, and the app drags the window by it.
  // It needs to know where the things you can click are, so it leaves those alone.
  function reportChrome() {
    if (!bridge()) return;
    const holes = [...document.querySelectorAll("#counts [data-pop], #link, #sound, #pop.open")]
      .map((el) => el.getBoundingClientRect())
      .filter((r) => r.width && r.height)
      .map((r) => [r.left, r.top, r.width, r.height]);
    bridge().postMessage({ holes });
  }
  addEventListener("resize", () => requestAnimationFrame(reportChrome));

  document.querySelector(".seg").addEventListener("click", (e) => {
    const b = e.target.closest("[data-view]");
    if (b) setView(b.dataset.view);
  });
  $q.addEventListener("input", () => search($q.value));

  $content.addEventListener("click", (e) => {
    // A card's or a row's pin pins it, and opens nothing.
    const pin = e.target.closest("[data-pin]");
    if (pin) return togglePin(pin.closest("[data-sid]")?.dataset.sid);
    // The mic and the composer: nothing in them opens the session.
    const mic = e.target.closest("[data-mic]");
    if (mic) { const sid = mic.closest("[data-sid]").dataset.sid; return dict?.sid === sid ? endDict() : startDict(sid); } // a second press closes it
    const act = e.target.closest("[data-dict]");
    if (act) return act.getAttribute("aria-disabled") === "true" ? undefined : dictAct(act.dataset.dict);
    if (e.target.closest(".dict")) return;
    const go = e.target.closest("[data-go]");
    if (go) return setView(go.dataset.go);
    const made = e.target.closest("[data-show-task]");
    if (made) return showTask(made.dataset.showTask);
    // A permission's Allow or Deny, and a question's answer, on its card.
    const pb = e.target.closest("[data-permit]");
    if (pb) return permitCard(pb.closest("[data-sid]").dataset.sid, pb.dataset.permit === "allow");
    const ans = e.target.closest("[data-answer]");
    if (ans) return answerCard(ans.closest("[data-sid]").dataset.sid, Number(ans.dataset.answer));
    const rel = e.target.closest("[data-open-sid]");
    if (rel) return openSession(rel.dataset.openSid);
    if (e.target.closest("[data-more]")) return loadHistory(false);
    const item = e.target.closest("[data-sid]");
    if (!item) return;
    // A blocked task opens the run that holds it up, so you can close it.
    const b = item.dataset.sid.startsWith("task:") ? blockedCards().find((x) => x.sid === item.dataset.sid) : null;
    if (b) return b.open ? openSession(b.open) : showTask(b.task);
    openSession(item.dataset.sid);
  });

  // In the app, a right click opens the app's own menu for that session, and anywhere
  // else no web menu (Reload, Inspect) at all.
  const sessionFor = (sid) => live.get(sid) ?? hist.items.find((h) => h.sid === sid);

  // Pointing at a session (or focusing it) spotlights its family: the one it came from and
  // the side sessions it started stay, the rest steps back. A short pause before it starts,
  // so passing over the window doesn't make it flicker; at once from the keyboard.
  let litFor = null;
  let litTimer;
  const FAMILY_DELAY = 80;
  function lightRelatives(item, now) {
    clearTimeout(litTimer);
    if (item === litFor) return;
    const s = item && sessionFor(item.dataset.sid);
    const sids = s ? [s.from?.sid, ...(s.sides || []).map((x) => x.sid)].filter(Boolean) : [];
    const apply = () => {
      litFor = item;
      for (const el of $content.querySelectorAll(".rel-lit, .rel-self")) el.classList.remove("rel-lit", "rel-self");
      const lit = sids.flatMap((sid) => [...$content.querySelectorAll(`.card[data-sid="${CSS.escape(sid)}"], .hrow[data-sid="${CSS.escape(sid)}"]`)]);
      $content.classList.toggle("family", lit.length > 0);
      if (!lit.length) return;
      item.classList.add("rel-self");
      lit.forEach((el) => el.classList.add("rel-lit"));
    };
    // Crossing the gap between two cards, or onto one with no relatives, waits the same
    // pause before the spotlight goes, so it doesn't blink off and on.
    if (now) apply();
    else litTimer = setTimeout(apply, FAMILY_DELAY);
  }
  // Only a pointer that's really in the window lights it up. WebKit replays the last
  // pointer position when the layout changes, even after the pointer left for another
  // window, and those replays don't move. In the app, the app also says when the pointer
  // comes and goes (window.csm.pointer).
  // In the app: whether the window says the pointer is inside it. Coming back in, nothing
  // lights up until the pointer really moves, so a replay of where it left can't light the
  // card it left from; and while it's out, nothing does at all.
  let pointerIn = !embed;
  let appInside = true;
  // On a card or a row of Last 7 Days, the list holds still (holdStart); off them, it lets go.
  const pointAt = (el) => { if (el?.closest("#week")) holdStart(); else holdEnd(); };
  $content.addEventListener("pointerover", (e) => {
    if (!pointerIn) return;
    const el = e.target.closest?.(".card, .hrow");
    lightRelatives(el);
    pointAt(el);
  });
  $content.addEventListener("pointermove", (e) => {
    if (pointerIn || !appInside || !(e.movementX || e.movementY)) return;
    pointerIn = true;
    const el = e.target.closest?.(".card, .hrow");
    lightRelatives(el);
    pointAt(el);
  });
  $content.addEventListener("pointerleave", () => { if (embed) pointerIn = false; lightRelatives(null, true); holdEnd(); });
  // WebKit doesn't always say the pointer left when it leaves the window or the app goes to
  // the back, so the spotlight also goes then.
  const endFamily = () => lightRelatives(null, true);
  addEventListener("blur", endFamily);
  document.addEventListener("pointerout", (e) => { if (!e.relatedTarget) endFamily(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) endFamily(); });
  // A redraw can take away the card that lit it, under a pointer that didn't move.
  function checkFamily() { if (litFor && !litFor.isConnected) endFamily(); }
  // From the keyboard only: a card keeps focus after a click opens its session, and the
  // window gives it back on return, which mustn't light anything up by itself.
  let keyAt = -Infinity;
  document.addEventListener("keydown", () => { keyAt = performance.now(); }, true);
  $content.addEventListener("focusin", (e) => {
    if (performance.now() - keyAt < 1000) lightRelatives(e.target.closest?.(".card, .hrow"), true);
  });
  $content.addEventListener("focusout", (e) => { if (!$content.contains(e.relatedTarget)) lightRelatives(null, true); });
  document.addEventListener("contextmenu", (e) => {
    if (!embed || e.target.closest?.(".dict textarea")) return;
    e.preventDefault();
    const task = e.target.closest("[data-task]");
    if (task) {
      const t = state.tasks.find((x) => x.id === task.dataset.task);
      if (t) bridge()?.postMessage({ menu: { sid: t.lastRun?.sid ?? "", title: t.name, cwd: t.cwd, file: t.file } });
      return;
    }
    const item = e.target.closest("[data-sid]");
    if (!item) return;
    const b = item.dataset.sid.startsWith("task:") ? blockedCards().find((x) => x.sid === item.dataset.sid) : null;
    if (b) return bridge()?.postMessage({ menu: { sid: b.open ?? "", title: b.title, cwd: b.cwd, file: b.file } });
    const s = sessionFor(item.dataset.sid);
    bridge()?.postMessage({ menu: { sid: item.dataset.sid, title: s?.title ?? "", cwd: s?.cwd ?? "", pinned: isPinned(item.dataset.sid) } });
  });

  // Dictation from the keyboard: Return or Space presses the mic and the composer's buttons;
  // while it listens, Return sends what you said wherever the focus is; Esc drops it (from a
  // search field only while it listens); Tab stays in the composer. After a send that didn't
  // go through, the words wait in a text box where Return sends again (Shift-Return too: the
  // words go as one line). A held key or a quick second press must not send twice: while it
  // stops and sends, Return does nothing, and back in the text box a repeat, or a press within
  // 0.6 s, does nothing. Keys in the composer stay there, so arrows and letters never move
  // between cards or open the session.
  const REVIEW_GRACE = 600;
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if (dict?.phase === "review" && (e.key === "Enter" || e.key === " ") && t.closest?.(".dict")
      && (e.repeat || performance.now() - (dict.reviewAt ?? 0) < REVIEW_GRACE)
      && (e.key === "Enter" || t.matches?.("[data-dict]"))) { e.preventDefault(); e.stopPropagation(); return; }
    const inPanel = t.closest?.(".dict, [data-mic]");
    const press = e.key === "Enter" || e.key === " ";
    // Return or Space on a pin pins it, and doesn't open the session.
    if (press && !e.metaKey && !e.altKey && !e.ctrlKey && t.matches?.("[data-pin]")) {
      e.preventDefault(); e.stopPropagation();
      if (!e.repeat) togglePin(t.closest("[data-sid]")?.dataset.sid);
      return;
    }
    if (press && !e.metaKey && !e.altKey && !e.ctrlKey && t.matches?.("[data-mic], [data-dict]")) {
      e.preventDefault(); e.stopPropagation();
      if (t.dataset.mic !== undefined) return startDict(t.closest("[data-sid]").dataset.sid);
      if (t.getAttribute("aria-disabled") !== "true") dictAct(t.dataset.dict);
      return;
    }
    if (!dict) return;
    const listening = dict.phase === "listening" || dict.phase === "stopping";
    // Tab and Shift-Tab stay in the composer.
    if (e.key === "Tab" && dictEl?.contains(t)) {
      e.preventDefault(); e.stopPropagation();
      const f = [...dictEl.querySelectorAll("textarea, .d-b")].filter((x) => x.getClientRects().length);
      return f[(f.indexOf(t) + (e.shiftKey ? -1 : 1) + f.length) % f.length]?.focus();
    }
    if (e.key === "Escape" && (inPanel || listening || !t.closest?.("input, textarea"))) { e.preventDefault(); e.stopPropagation(); return endDict(true); }
    if (e.key === "Enter" && !e.metaKey && !e.altKey && !e.ctrlKey) {
      if ((listening || dict.phase === "sending") && (inPanel || !t.closest?.("input, textarea"))) { e.preventDefault(); e.stopPropagation(); return stopDict(); }
      if (dict.phase === "review" && t.tagName === "TEXTAREA" && inPanel) { e.preventDefault(); e.stopPropagation(); return sendDict(); }
    }
    if (inPanel) e.stopPropagation();
  }, true);

  // On a card that asks: ⌘↩ gives its first answer (or opens the session when it can't be
  // sent from here). On a permission's card it opens the session: no key allows.
  $content.addEventListener("keydown", (e) => {
    const card = e.target.closest?.(".card[data-sid]");
    if (!card || !e.metaKey || e.altKey || e.ctrlKey || e.shiftKey) return;
    const s = live.get(card.dataset.sid);
    if (s && permitOf(s) && e.key === "Enter") { e.preventDefault(); return openSession(s.sid); }
    if (!s || !answerable(s)) return;
    if (e.key === "Enter") {
      e.preventDefault();
      if (s.reply?.state === "failed") openSession(s.sid);
      else if (!s.reply) answerCard(s.sid, 0);
    }
  });

  // Arrow keys move between cards the way they look on screen; Home and End jump to the
  // first and last. Return or Space opens the session, as a click does.
  $content.addEventListener("keydown", (e) => {
    const from = e.target.closest?.(".card, .hrow");
    if (!from || e.metaKey || e.altKey || e.ctrlKey) return;
    const items = [...(view === "week" ? $week : view === "history" ? $history : $scheduled).querySelectorAll(".card, .hrow")]
      .filter((el) => !el.closest("[data-leaving]")); // on its way out
    const i = items.indexOf(from);
    let to;
    if (e.key === "Home") to = items[0];
    else if (e.key === "End") to = items.at(-1);
    else if (e.key === "ArrowLeft") to = items[i - 1];
    else if (e.key === "ArrowRight") to = items[i + 1];
    else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      const down = e.key === "ArrowDown";
      const a = from.getBoundingClientRect();
      const cx = a.left + a.width / 2;
      const all = items.filter((el) => el !== from).map((el) => ({ el, b: el.getBoundingClientRect() }))
        .filter(({ b }) => (down ? b.top >= a.bottom - 1 : b.bottom <= a.top + 1));
      if (all.length) {
        // The nearest row first, then the item in it closest to the same column.
        const edge = down ? Math.min(...all.map((c) => c.b.top)) : Math.max(...all.map((c) => c.b.bottom));
        const row = all.filter((c) => Math.abs((down ? c.b.top : c.b.bottom) - edge) < 4);
        row.sort((p, q) => Math.abs(p.b.left + p.b.width / 2 - cx) - Math.abs(q.b.left + q.b.width / 2 - cx));
        to = row[0].el;
      }
    } else return;
    e.preventDefault();
    if (to) { to.focus({ preventScroll: true }); to.scrollIntoView({ block: "nearest" }); }
  });

  // ---------------------------------------------------------------- header

  // Full counts if they fit; numbers only if not; then without the less important ones.
  function fitCounts() {
    // The header row: the counts give way first, as they always have; if the row still runs
    // past its end, the Pinned toggle keeps only its pin, then the week's usage drops its
    // words, then itself, then the search narrows.
    const head = $counts.parentElement;
    head.classList.remove("p-short", "u-short", "u-none", "s-short");
    fitCountsOnly();
    // The counts give way inside their own box, so a cut count also asks for the next step.
    const cut = () => $counts.scrollWidth > $counts.clientWidth + 1;
    for (const step of ["p-short", "u-short", "u-none", "s-short"]) {
      if (head.scrollWidth <= head.clientWidth + 1 && !cut()) return;
      head.classList.add(step);
      fitCountsOnly();
    }
  }
  function fitCountsOnly() {
    $counts.classList.remove("tight", "tighter", "tightest");
    const over = () => $counts.scrollWidth > $counts.clientWidth + 1;
    for (const step of ["tight", "tighter", "tightest"]) {
      if (!over()) return;
      $counts.classList.add(step);
    }
  }
  addEventListener("resize", () => requestAnimationFrame(fitCounts));

  // The plan's usage, saved by the status line after each reply in any session.
  const $usage = document.getElementById("usage");
  const USAGE_HIGH = 80;
  // The week's pace, when it runs out and the times that go with them live in usage.js, as
  // pure functions of the reading and the time now (tested in test/usage.test.ts). Here they
  // read the server's clock.
  const U = window.CsmUsage;
  const { HOUR, WEEK, hourOf } = U;

  // A curve through the readings that never dips or overshoots between them (Fritsch and
  // Carlson's monotone cubic), so the week's share reads as the steady climb it is.
  function smoothPath(pts) {
    const n = pts.length;
    if (n < 2) return "";
    const d = pts.slice(1).map(([x, y], i) => (x === pts[i][0] ? 0 : (y - pts[i][1]) / (x - pts[i][0])));
    const m = pts.map((_, i) => (i === 0 ? d[0] : i === n - 1 ? d[n - 2] : d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2));
    for (let i = 0; i < n - 1; i++) {
      if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
      const a = m[i] / d[i], b = m[i + 1] / d[i], h = a * a + b * b;
      if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }

    let path = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < n - 1; i++) {

      path += ` C${(x0 + h).toFixed(1)},${(y0 + m[i] * h).toFixed(1)} ${(x1 - h).toFixed(1)},${(y1 - m[i + 1] * h).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;

  // The week as a curve: the share used so far against the blue diagonal of an even week,

  // it gets there first (fainter in the first day). Today has its band, its letter in white

  function weekChart(w, p, W = 216) {

    // From 0 at the reset to now, one reading every 6 hours or so, then the latest. A reading
    // from the last hour is now itself: a second point that close would bend the curve.
    const raw = [[start, 0], ...(w.samples || []).filter(([at]) => at > start && at < t - HOUR), [t, w.pct]];
    const keep = [raw[0]];
    for (const r of raw.slice(1, -1)) if (r[0] - keep.at(-1)[0] >= 6 * HOUR) keep.push(r);
    keep.push(raw.at(-1));
    const pts = keep.map(([at, pct]) => [X(at), Y(pct)]);
    const line = smoothPath(pts);
    const [nx, ny] = pts.at(-1);
    const area = `${line} L${nx.toFixed(1)},${H} L0,${H} Z`;
    const color = { fast: "var(--color-text-orange)", hot: "var(--color-text-orange)", limit: "var(--color-text-red)" }[p.key] || "var(--color-text-secondary)";
    const days = (t - start) / DAY;
    const pr = U.projection(w, p, t);
    const ahead = pr ? `<g opacity="${pr.early ? 0.55 : 1}"><line x1="${nx.toFixed(1)}" y1="${ny.toFixed(1)}" x2="${X(pr.at).toFixed(1)}" y2="${Y(pr.pct).toFixed(1)}" stroke="${color}" stroke-width="1.75" stroke-dasharray="3 3" stroke-linecap="round"/>
      ${pr.pct >= 100 ? `<line x1="${X(pr.at).toFixed(1)}" y1="${(Y(pr.pct) + 5).toFixed(1)}" x2="${X(pr.at).toFixed(1)}" y2="${H}" stroke="${color}" stroke-opacity="0.7" stroke-width="1" stroke-dasharray="2 2"/>` : ""}
      <circle cx="${X(pr.at).toFixed(1)}" cy="${Y(pr.pct).toFixed(1)}" r="3.5" fill="${color}"/></g>` : "";
    const today = Math.min(6, Math.floor(days));
    const letters = Array.from({ length: 7 }, (_, d) => {
      const l = new Date(start + d * DAY + 1).toLocaleDateString("en-US", { weekday: "narrow" });
      return `<text x="${(((d + 0.5) / 7) * W).toFixed(1)}" y="${H + 14}" text-anchor="middle"${d === today ? ' class="today"' : ""}>${l}</text>`;
    }).join("");
    return `<svg viewBox="0 -8 ${W} ${H + 30}" width="${W}" height="${H + 30}" aria-hidden="true">
      <defs><clipPath id="uc-ahead"><polygon points="0,${H} 0,-8 ${W},-8 ${W},0"/></clipPath></defs>
      <rect x="${((today / 7) * W).toFixed(1)}" y="-6" width="${(W / 7).toFixed(1)}" height="${H + 26}" rx="5" fill="#FFFFFF0E"/>
      <line x1="0" y1="0" x2="${W}" y2="0" stroke="#FFFFFF1C" stroke-dasharray="2 3"/>
      <text x="2" y="10" class="lim">100%</text>

      <path d="${area}" fill="#FFFFFF0B"/>

      <line x1="0" y1="${H}" x2="${W}" y2="0" stroke="var(--color-text-accent)" stroke-width="1.5"/>
      <path d="${line}" fill="none" stroke="#E6E8EB" stroke-width="1.75" stroke-linecap="round"/>
      ${ahead}
      <line x1="${nx.toFixed(1)}" y1="${(ny + 5).toFixed(1)}" x2="${nx.toFixed(1)}" y2="${H}" stroke="#F7F8F859" stroke-width="1"/>
      <circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="4.5" fill="var(--color-text-primary)" stroke="var(--color-surface-raised)" stroke-width="2"/>
      ${letters}</svg>`;
  }

  // The card over the week's usage, in place of a plain tooltip: when it runs out, if it
  // does; the week's curve; how far ahead or behind; and when it resets.
  function usageCard(u, chartW) {
    const w = u.week;
    const row = (k, v, mark = "") => `<div class="uc-row"><span class="k">${k}</span>${mark}<span class="v">${v}</span></div>`;
    let html = "";
    if (w?.resets) {
      const p = pace(w), fc = forecast(w, p);
      if (w.pct >= 100) {

        const until = ms < HOUR ? "within the hour" : h >= 48 ? `in ${Math.round(h / 24)} days` : `in ${h} ${h === 1 ? "hour" : "hours"}`;
        html += `<div class="uc-out limit"><div class="l">Limit reached · resets</div><div class="t">${whenWords(w.resets, true)}</div><div class="l">${until}</div></div>`;
      } else if (fc) {

        html += `<div class="uc-out${p.key === "limit" ? " limit" : ""}"><div class="l">Runs out around</div><div class="t">${whenWords(fc.at)}</div><div class="l">${before} before the reset</div></div>`;

      html += `<div class="uc-rows">${U.paceRows(w, p, now()).map(([k, v], i) => row(k, v, i ? "" : '<i class="uc-sw"></i>')).join("")}</div>`;

    const resets = w?.resets ? `Resets <b>${dayTime(w.resets)}</b> · ` : "";

  document.body.appendChild($ucard);
  let ucardFor = null;
  // Beside the column, to its left; under the strip and the header's small version.
  function showUsageCard(anchor) {

    // left inside (its text keeps its size).
    $ucard.innerHTML = usageCard(state.usage, Math.min(248, innerWidth - 16) - 32);
    ucardFor = anchor;
    const r = anchor.getBoundingClientRect(), cw = $ucard.offsetWidth, ch = $ucard.offsetHeight;
    const beside = anchor.classList.contains("meter");
    // Beside the column it sits 4 px off it, inside the 8 px gap, so it covers the edge of the
    // cards under it instead of leaving a sliver of them showing.
    const left = beside ? r.left - cw - 4 : r.left, top = beside ? r.top : r.bottom + 8;
    $ucard.style.left = `${Math.max(8, Math.min(left, innerWidth - cw - 8))}px`;
    $ucard.style.top = `${Math.max(8, Math.min(top, innerHeight - ch - 8))}px`;

    $ucard.classList.add("open");
  }
  // A pointer passing over shouldn't flash it: it opens after a short rest on the usage, at

  // once for keyboard focus.

    ucardPending = el;
    ucardTimer = setTimeout(() => { ucardPending = null; showUsageCard(el); }, 350);
  }
  function hideUsageCard() {

  // and the figure reads the same clock. The old words step out first; only at landing do the

  const tok = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

    const snap = (px) => Math.round(px * k) / k;

    for (const [el, days, figure, words, tall] of [
      [$m, ".m-week", ".m-pct", ".m-say, .m-reset", true],
      [document.querySelector("#week .wstrip"), ".ws-days", ".ws-n", ".ws-say", false],
    ]) {
      if (!el || el.hidden || el.offsetParent === null) continue;
      const $d = el.querySelector(days);
      const segs = $d ? [...$d.querySelectorAll(".m-seg, .ws-seg")] : [];
      if (segs.length !== 7) continue;
      const dr = $d.getBoundingClientRect();
      const box = segs.map((seg) => { const r = seg.getBoundingClientRect(); return tall ? { at: dr.bottom - r.bottom, len: r.height } : { at: r.left - dr.left, len: r.width }; });
      const parts = segs.map((seg) => ({ b: seg.querySelector("b") || seg.appendChild(document.createElement("b")), i: seg.querySelector("i") || seg.appendChild(document.createElement("i")) }));
      $d.querySelectorAll(".m-now, .ws-now").forEach((n) => n.remove());
      const r0 = segs[0].getBoundingClientRect();
      const line = document.createElement("span");
      line.className = "week-roll-now";
      if (tall) Object.assign(line.style, { left: `${snap(r0.left - dr.left - 5)}px`, width: `${snap(r0.width + 10)}px`, height: `${snap(2)}px` });
      else Object.assign(line.style, { top: `${snap(r0.top - dr.top - 3)}px`, height: `${snap(r0.height + 6)}px`, width: `${snap(2)}px` });
      $d.append(line);
      const num = [...(el.querySelector(figure)?.childNodes ?? [])].find((n) => n.nodeType === 3 && /\d/.test(n.nodeValue));
      for (const w of el.querySelectorAll(words)) w.animate([{ opacity: 1 }, { opacity: 0 }], { duration: tokMs("--duration-exit", 160), easing: tok("--ease-standard"), fill: "forwards" });
      el.classList.add("rolling");
      views.push({ el, segs, box, parts, line, num, tall });
    }
    if (!views.length) return false;
    // 74 points down take about 1.4 s; a short drop, less; never past 1.7 s.
    const clock = new Animation(new KeyframeEffect(null, null, { duration: Math.min(1700, 560 + 11 * Math.abs(from.pct - to.pct)), easing: tok("--ease-inertial") || "ease-in-out" }), document.timeline);
    const lerp = (a, b, e) => a + (b - a) * e;
    const share = (x, d) => Math.max(0, Math.min(1, x - d));
    const paint = (e) => {
      const t = job.to;
      const used = lerp(from.used, t.used, e), even = lerp(from.even, t.even, e);
      const base = from.oneColor ? used : Math.min(used, even); // the old week's colors until it lands
      const at = from.at != null && t.at != null ? lerp(from.at, t.at, e) : null;
      const pct = String(Math.round(lerp(from.pct, t.pct, e)));
      for (const v of views) {
        v.parts.forEach(({ b, i }, d) => {
          const len = v.box[d].len;
          const fill = share(base, d) * len;
          const overFrom = share(even, d) * len;
          const over = from.oneColor ? 0 : Math.max(0, (used > even ? share(used, d) * len : 0) - overFrom);
          b.style[v.tall ? "height" : "width"] = `${snap(fill)}px`;
          i.style[v.tall ? "bottom" : "left"] = `${snap(overFrom)}px`;
          i.style[v.tall ? "height" : "width"] = `${snap(over)}px`;
          b.classList.toggle("seam", over > 0 && fill > 0);
          i.classList.toggle("seam", over > 0 && fill > 0);
        });
        if (at == null) v.line.style.opacity = "0";
        else {
          const d = Math.max(0, Math.min(6, Math.floor(at)));
          v.line.style[v.tall ? "bottom" : "left"] = `${snap(v.box[d].at + share(at, d) * v.box[d].len - 1)}px`;
        }
        if (v.num) v.num.nodeValue = pct;
      }

      if ($m._roll !== job) return;
      $m._roll = null;
      // How each day looked, so its track and letter can fade to the new week's.
      if (landing) $m._landing = new Map(views.map((v) => [v.el, v.segs.map((seg) => ({ track: getComputedStyle(seg).backgroundColor, letter: getComputedStyle(seg.parentElement.querySelector(".m-dl, .ws-dl")).color }))]));
      for (const v of views) { v.el.classList.remove("rolling"); v.line.remove(); v.el._html = ""; } // drawn anew
      if (landing) renderMeter();
    };

    $m._roll = job;
    const frame = () => {

  // The landing: the fills are already where the new week has them, so only the days' tracks and

  function landWeek(looks) {
    const color = { duration: tokMs("--duration-color", 450), easing: tok("--ease-standard") };
    for (const [el, was] of looks) {
      el.querySelectorAll(".m-seg, .ws-seg").forEach((seg, d) => {
        const dl = seg.parentElement.querySelector(".m-dl, .ws-dl");
        const track = getComputedStyle(seg).backgroundColor, letter = getComputedStyle(dl).color;
        if (was[d] && track !== was[d].track) seg.animate([{ backgroundColor: was[d].track }, { backgroundColor: track }], color);
        if (was[d] && letter !== was[d].letter) dl.animate([{ color: was[d].letter }, { color: letter }], color);
      });
      for (const w of el.querySelectorAll(".m-say, .m-reset, .ws-say")) w.animate([{ opacity: 0, transform: "translateY(2px)" }, { opacity: 1, transform: "none" }], { duration: tokMs("--duration-enter", 320), easing: tok("--ease-enter") });
    }
  }

  function renderMeter() {

    // that color is the fill's own (on pace, plenty left, near the limit), it's one piece.

    const days = Array.from({ length: 7 }, (_, d) => {
